:false,"unit":"σετ","bag":true,"bagAmount":1,"expires":false,"note":"Σε αεροστεγές σακουλάκι, για να μείνουν στεγνά."},{"id":"vrefiko-gala","cat":"paidia","name":"Βρεφικό γάλα και τροφές","per":"infant","amount":1,"perDay":true,"unit":"ημερήσιες μερίδες","bag":true,"bagAmount":1,"expires":true,"note":"Αν χρησιμοποιείς σκόνη, χρειάζεσαι και επιπλέον εμφιαλωμένο νερό."},{"id":"panes","cat":"paidia","name":"Πάνες","per":"infant","amount":8,"perDay":true,"unit":"τεμάχια","bag":true,"bagAmount":8,"expires":false,"note":""},{"id":"paixnidi","cat":"paidia","name":"Το αγαπημένο παιχνίδι ή λούτρινο κάθε παιδιού","per":"child","amount":1,"perDay":false,"unit":"τεμάχια","bag":true,"bagAmount":1,"expires":false,"note":"Βοηθά τα παιδιά να ηρεμήσουν σε άγνωστο χώρο."},{"id":"trapoula","cat":"paidia","name":"Τράπουλα, βιβλίο ή μικρό επιτραπέζιο","per":"household","amount":1,"perDay":false,"unit":"σετ","bag":true,"expires":false,"note":"Οι ώρες αναμονής είναι πολλές. Ένα παιχνίδι μειώνει το άγχος σε μικρούς και μεγάλους."},{"id":"trofi-zoon","cat":"paidia","name":"Τροφή κατοικιδίων","per":"pet","amount":1,"perDay":true,"unit":"ημερήσιες μερίδες","bag":true,"bagAmount":1,"expires":true,"note":"Και επιπλέον νερό για το ζώο."},{"id":"zoa-loures","cat":"paidia","name":"Λουρί, κλουβί μεταφοράς, βιβλιάριο υγείας ζώου","per":"pet","amount":1,"perDay":false,"unit":"σετ","bag":true,"bagAmount":1,"expires":false,"note":""},{"id":"ypnosakos","cat":"diany","name":"Υπνόσακος","per":"person","amount":1,"perDay":false,"unit":"τεμάχια","bag":false,"only":"camp","expires":false,"note":"Για κρύες νύχτες, υπνόσακος με θερμοκρασία άνεσης γύρω στους 0 °C ή χαμηλότερα."},{"id":"ypostroma","cat":"diany","name":"Υπόστρωμα ή φουσκωτό στρώμα","per":"person","amount":1,"perDay":false,"unit":"τεμάχια","bag":false,"only":"camp","expires":false,"note":"Το έδαφος τραβάει θερμότητα πιο γρήγορα από τον αέρα. Χωρίς υπόστρωμα κρυώνεις ακόμη και με καλό υπνόσακο."},{"id":"skini","cat":"diany","name":"Σκηνή ή μουσαμάς με σχοινί και πασσαλάκια","per":"household","amount":1,"perDay":false,"unit":"σετ","bag":false,"only":"camp","expires":false,"note":"Ένας μουσαμάς με σχοινί γίνεται πρόχειρο στέγαστρο από βροχή και ήλιο."},{"id":"fakos-kefalis","cat":"diany","name":"Φακός κεφαλής με εφεδρικές μπαταρίες","per":"person","amount":1,"perDay":false,"unit":"τεμάχια","bag":false,"only":"camp","expires":false,"note":"Ελεύθερα χέρια για στήσιμο, μαγείρεμα και τουαλέτα τη νύχτα."},{"id":"mageiriko","cat":"diany","name":"Γκαζάκι, φιαλίδια, κατσαρολάκι και κουτάλι","per":"household","amount":1,"perDay":false,"unit":"σετ","bag":false,"only":"camp","expires":false,"note":"Μόνο σε ανοιχτό χώρο, μακριά από τη σκηνή."},{"id":"filtro","cat":"diany","name":"Φορητό φίλτρο νερού","per":"household","amount":1,"perDay":false,"unit":"τεμάχιο","bag":false,"only":"camp","expires":false,"note":"Για νερό από βρύσες ή πηγές που δεν είσαι σίγουρος ότι είναι πόσιμες."},{"id":"zesta","cat":"diany","name":"Ζεστά ρούχα: ισοθερμικά, φλις, σκούφος, γάντια, μάλλινες κάλτσες","per":"person","amount":1,"perDay":false,"unit":"σετ","bag":false,"only":"camp","expires":false,"note":"Και καλοκαίρι: οι νύχτες έξω είναι πιο κρύες απ' όσο περιμένεις."},{"id":"pontso","cat":"diany","name":"Αδιάβροχο πόντσο ή μπουφάν","per":"person","amount":1,"perDay":false,"unit":"τεμάχια","bag":false,"only":"camp","expires":false,"note":""},{"id":"toualeta-camp","cat":"diany","name":"Φτυαράκι, χαρτί υγείας, σακούλες, αντισηπτικό","per":"household","amount":1,"perDay":false,"unit":"σετ","bag":false,"only":"camp","expires":false,"note":"Για υγιεινή όταν δεν υπάρχουν τουαλέτες."},{"id":"sxoini","cat":"diany","name":"Σχοινί, κλιπ και ταινία επισκευής","per":"household","amount":1,"perDay":false,"unit":"σετ","bag":false,"only":"camp","expires":false,"note":"Για στήσιμο, άπλωμα ρούχων και επισκευές."}],"cards":[{"id":"kit-vs-tsanta","title":"Κιτ σπιτιού, τσάντα διαφυγής ή διανυκτέρευση;","icon":"🎒","lead":"Χρειάζεσαι και το κιτ του σπιτιού και την τσάντα διαφυγής. Αν ο προορισμός σου μπορεί να μην είναι οργανωμένος, χρειάζεσαι και εξοπλισμό διανυκτέρευσης.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Κιτ σπιτιού (72 ώρες)","items":["Για σενάρια όπου μένεις μέσα: μπλακάουτ, χιονοθύελλα, διακοπή νερού, χημικό ατύχημα.","Νερό, τρόφιμα, φως, φάρμακα και υγιεινή για όλους για τουλάχιστον 3 ημέρες."]},{"type":"list","title":"Τσάντα διαφυγής","items":["Ένα σακίδιο ανά ενήλικα, έτοιμο δίπλα στην πόρτα.","Τα απολύτως απαραίτητα για τις πρώτες ώρες μετά από εκκένωση: νερό, κάτι να φας, φάρμακα, έγγραφα, μετρητά, φακός, φορτιστής, ρούχα.","Να μπορείς να το κουβαλήσεις άνετα για αρκετή ώρα."]},{"type":"list","title":"Διανυκτέρευση","items":["Αν φεύγεις σε οργανωμένο χώρο των αρχών, η τσάντα διαφυγής αρκεί.","Αν ο προορισμός μπορεί να μην είναι οργανωμένος, πρόσθεσε υπνόσακο, υπόστρωμα, σκηνή ή μουσαμά, φακό κεφαλής, μαγειρικό σετ και ζεστά ρούχα.","Και τότε πήγαινε εκεί όπου μαζεύονται κι άλλοι, όχι σε απομονωμένο σημείο."]},{"type":"warn","title":"Κράτα τα πάντα στεγνά","items":["Τα περισσότερα σακίδια δεν είναι αδιάβροχα. Αν φύγεις με βροχή, βρεγμένα φάρμακα, ρούχα, χαρτιά και μπαταρίες αχρηστεύονται.","Βάλε κάθε ομάδα πραγμάτων σε δικό της αεροστεγές σακουλάκι τύπου zip: φάρμακα, ρούχα, χαρτί υγείας, μπαταρίες και power bank, μετρητά και έγγραφα.","Βάλε μια μεγάλη σακούλα σκουπιδιών μέσα στο σακίδιο, σαν εσωτερική επένδυση."]},{"type":"tip","title":"Κανόνας ανανέωσης","items":["Βάλε ημερομηνίες λήξης στο «Κιτ» και πρόσθεσε υπενθύμιση στο ημερολόγιό σου 2 μήνες πριν τη λήξη. Έτσι τα τρως πριν λήξουν και δεν πετάς τίποτα.","Δύο φορές τον χρόνο, για παράδειγμα όταν αλλάζει η ώρα, έλεγξε το κιτ, φόρτισε τα power bank και άλλαξε τα ρούχα ανάλογα με την εποχή."]}],"sources":[{"label":"Ευρωπαϊκή Επιτροπή – Στρατηγική για την Ένωση Ετοιμότητας","url":"https://civil-protection-humanitarian-aid.ec.europa.eu/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"kit-autokinito","title":"Κιτ αυτοκινήτου","icon":"🚙","lead":"Πολλές καταστροφές σε βρίσκουν στον δρόμο. Ένα μικρό κιτ στο πορτμπαγκάζ κάνει μεγάλη διαφορά.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τι βάζεις","items":["Νερό (2–3 μπουκάλια) και σνακ που αντέχουν στη ζέστη.","Κουβέρτα ή θερμική κουβέρτα, αδιάβροχο, γάντια εργασίας.","Φακός με μπαταρίες και φορτιστής κινητού για το αυτοκίνητο.","Φαρμακείο, τρίγωνο, ανακλαστικό γιλέκο και πυροσβεστήρας (υποχρεωτικά).","Καλώδια μπαταρίας και χάρτης της περιοχής σε χαρτί.","Σφυράκι θραύσης τζαμιών με κόφτη ζώνης, σε σημείο που το φτάνει ο οδηγός.","Τον χειμώνα: αλυσίδες, φτυαράκι, ξύστρα πάγου."]},{"type":"tip","title":"Κανόνας","items":["Κράτα το ρεζερβουάρ πάνω από τη μέση, ειδικά το καλοκαίρι και όταν υπάρχει προειδοποίηση. Σε εκκένωση τα πρατήρια κλείνουν ή έχουν ουρές."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"kit-douleia","title":"Τσαντάκι δουλειάς ή σχολείου","icon":"💼","lead":"Ένα μικρό τσαντάκι στο γραφείο ή στη σχολική τσάντα, για τις ώρες μέχρι να γυρίσεις σπίτι.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τι βάζεις","items":["Νερό και κάτι να φας.","Τα φάρμακα που παίρνεις, για 1–2 ημέρες.","Power bank και καλώδιο.","Μικρός φακός και σφυρίχτρα.","Μάσκα FFP2 (σκόνη ή καπνός).","Άνετα παπούτσια για περπάτημα, αν φοράς κάτι άλλο στη δουλειά.","Λίστα τηλεφώνων σε χαρτί και λίγα μετρητά."]},{"type":"tip","title":"Επίσης","items":["Μάθε το σχέδιο εκκένωσης του κτιρίου σου: έξοδοι, σκάλες, σημείο συγκέντρωσης.","Υπολόγισε πώς θα γυρίσεις σπίτι με τα πόδια αν σταματήσουν τα μέσα μεταφοράς."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"nero","title":"Νερό","icon":"💧","order":3,"intro":"Χωρίς νερό αντέχουμε μόνο λίγες ημέρες. Είναι το πρώτο που πρέπει να εξασφαλίσεις.","cards":[{"id":"posotites","title":"Πόσο νερό χρειάζομαι;","icon":"🧮","lead":"Προετοίμασε τουλάχιστον 3 ημέρες πόσιμο νερό για κάθε άτομο. Το CDC προτείνει περίπου 3,8 λίτρα ανά άτομο ανά ημέρα για πόση και βασικές ανάγκες.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Για 3 ημέρες","items":["1 άτομο: 9 λίτρα","2 άτομα: 18 λίτρα","4 άτομα: 36 λίτρα","Κατοικίδια: πρόσθεσε νερό ανάλογα με το μέγεθος του ζώου."]},{"type":"tip","title":"Χρειάζεσαι περισσότερο αν","items":["κάνει ζέστη ή υπάρχει καύσωνας,","υπάρχει έγκυος, θηλάζουσα, άρρωστος ή ηλικιωμένος,","χρησιμοποιείς βρεφικό γάλα σε σκόνη."]}],"sources":[{"label":"CDC – Emergency Water Supply","url":"https://www.cdc.gov/water-emergency/about/how-to-create-and-store-an-emergency-water-supply.html"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"apothikeusi","title":"Αποθήκευση νερού","icon":"📦","lead":"Το πιο απλό και ασφαλές: εμφιαλωμένο νερό του εμπορίου, σε δροσερό και σκοτεινό μέρος.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Σωστά","items":["Κράτα τα μπουκάλια σφραγισμένα, μακριά από ήλιο, θερμότητα και χημικά (απορρυπαντικά, καύσιμα).","Ανανέωνε το απόθεμα πριν λήξει. Πίνε το παλιό και αγόρασε καινούργιο.","Αν γεμίσεις δικά σου δοχεία: μόνο καθαρά δοχεία τροφίμων, με νερό βρύσης, και άλλαξέ το κάθε 6 μήνες."]},{"type":"warn","title":"Μην","items":["Μην χρησιμοποιείς δοχεία που είχαν χημικά, γάλα ή χυμό. Το γάλα και ο χυμός αφήνουν υπολείμματα όπου αναπτύσσονται βακτήρια."]},{"type":"tip","title":"Όταν ανακοινωθεί διακοπή νερού","items":["Γέμισε μπανιέρα, κατσαρόλες και μπουκάλια.","Το νερό της μπανιέρας είναι για καζανάκι και πλύσιμο, όχι για πόσιμο."]}],"sources":[{"label":"WHO – Drinking water","url":"https://www.who.int/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"katharismos","title":"Καθαρισμός νερού","icon":"🫧","lead":"Αν υπάρχει υποψία μικροβιακής μόλυνσης, ακολούθησε τις οδηγίες των αρχών. Το βράσιμο σκοτώνει παθογόνα, όχι χημικές ουσίες.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"1. Βράσιμο (η καλύτερη μέθοδος)","items":["Αν το νερό είναι θολό, άφησέ το να κατακαθίσει και φίλτραρέ το με καθαρό πανί ή φίλτρο καφέ.","Βράσε το για 1 λεπτό αφού πάρει κανονική βράση. Σε υψόμετρο πάνω από 2.000 μέτρα, βράσε 3 λεπτά.","Άφησέ το να κρυώσει σε σκεπασμένο καθαρό δοχείο."]},{"type":"steps","title":"2. Χλωρίνη (αν δεν μπορείς να βράσεις)","items":["Προτίμησε εμφιαλωμένο νερό ή βράσιμο. Χρησιμοποίησε χλωρίνη μόνο αν δεν μπορείς να βράσεις και αν η μόλυνση είναι μικροβιακή, όχι χημική.","Μόνο απλή, μη αρωματισμένη υγρή χλωρίνη ΧΩΡΙΣ πρόσθετα και με 5–9% υποχλωριώδες νάτριο: για 1 λίτρο διαυγούς νερού, 2 σταγόνες (περίπου 0,1 ml) σύμφωνα με CDC. Για 1% απαιτείται διαφορετική δόση. Μην υπολογίζεις από άγνωστο προϊόν.","Για θολό νερό: άφησέ το να κατακαθίσει, φίλτραρέ το με καθαρό ύφασμα και χρησιμοποίησε διπλάσια δόση αν παραμένει θολό/χρωματισμένο ή είναι πολύ κρύο.","Ανακάτεψε και περίμενε τουλάχιστον 30 λεπτά. Η απολύμανση με χλωρίνη δεν εξουδετερώνει αξιόπιστα όλα τα παράσιτα.","Αν υπάρχει υποψία καυσίμων, χημικών, τοξινών ή ραδιενεργών ουσιών, ΜΗΝ χρησιμοποιήσεις το νερό: ούτε το βράσιμο ούτε η χλωρίνη το καθιστούν ασφαλές."]},{"type":"list","title":"3. Άλλες μέθοδοι","items":["Ταμπλέτες καθαρισμού νερού: ακολούθησε τις οδηγίες της συσκευασίας ακριβώς.","Φορητά φίλτρα: αφαιρούν βακτήρια και παράσιτα, αλλά συνήθως όχι ιούς ή χημικά. Διάβασε τι πιστοποιεί ο κατασκευαστής.","Ηλιακή απολύμανση (SODIS): διάφανο πλαστικό μπουκάλι έως 2 λίτρων με καθαρό νερό, στον ήλιο για τουλάχιστον 6 ώρες (2 ημέρες αν έχει συννεφιά). Μόνο αν δεν υπάρχει άλλη λύση."]},{"type":"warn","title":"Προσοχή","items":["Καμία από αυτές τις μεθόδους δεν αφαιρεί χημικά, καύσιμα ή βαρέα μέταλλα. Νερό από πλημμύρα ή κοντά σε βιομηχανία δεν γίνεται πόσιμο έτσι.","Μην χρησιμοποιείς χλωρίνη με άρωμα, παχύρρευστη ή «ειδική για ρούχα».","Το βράσιμο και η χλωρίνη ΔΕΝ καθιστούν ασφαλές νερό μολυσμένο με χημικά ή ραδιενεργές ουσίες."]}],"sources":[{"label":"CDC – How to Make Water Safe in an Emergency","url":"https://www.cdc.gov/water-emergency/about/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"piges","title":"Κρυμμένες πηγές νερού στο σπίτι","icon":"🔍","lead":"Προτίμησε αποθηκευμένο εμφιαλωμένο νερό. Άλλες πηγές στο σπίτι χρειάζονται αξιολόγηση πριν χρησιμοποιηθούν.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Πιθανές πηγές","items":["Παγάκια από πόσιμο νερό, εφόσον δεν έχουν μολυνθεί.","Νερό σε σωληνώσεις ή θερμοσίφωνα μόνο εφόσον δεν έχει υπάρξει χημική μόλυνση και αφού δοθούν κατάλληλες οδηγίες για ασφαλή συλλογή. Προσοχή σε ηλεκτρισμό, πίεση και εγκαύματα."]},{"type":"warn","title":"Μην το θεωρείς πόσιμο","items":["Μην πίνεις νερό από καζανάκι, καλοριφέρ ή συστήματα θέρμανσης.","Αν υπάρχουν υποψίες χημικής/ραδιενεργής μόλυνσης, βράσιμο ή χλωρίνη δεν αρκούν.","Αν δεν είσαι βέβαιος για την ασφάλεια, μην το καταναλώνεις."]}],"sources":[{"label":"CDC – Make water safe during an emergency","url":"https://www.cdc.gov/water-emergency/communication-resources/index.html"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"protes-voitheies","title":"Πρώτες βοήθειες","icon":"🩹","order":6,"intro":"Βασικές οδηγίες μέχρι να έρθει βοήθεια. Δεν αντικαθιστούν την εκπαίδευση. Αν κινδυνεύει ζωή, κάλεσε πρώτα 112 ή 166 και βάλε το τηλέφωνο σε ανοιχτή ακρόαση.","cards":[{"id":"karpa","title":"ΚΑΡΠΑ (ενήλικας)","icon":"❤️","urgent":true,"lead":"Δεν απαντά και δεν αναπνέει φυσιολογικά; Κάλεσε 166 και ξεκίνα θωρακικές συμπιέσεις αμέσως.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Βήματα","items":["Βεβαιώσου ότι ο χώρος είναι ασφαλής για σένα.","Μίλησέ του δυνατά και ταρακούνησέ τον ελαφρά από τους ώμους. Αν δεν αντιδρά, γείρε το κεφάλι του πίσω και κοίτα για έως 10 δευτερόλεπτα αν αναπνέει φυσιολογικά.","Αν δεν αναπνέει φυσιολογικά: κάλεσε 166 ή 112 σε ανοιχτή ακρόαση. Αν υπάρχει άλλος, στείλ' τον να φέρει απινιδωτή.","Βάλε τη βάση της παλάμης στο κέντρο του στήθους και το άλλο χέρι από πάνω, με τεντωμένα χέρια.","Πίεσε δυνατά και γρήγορα: βάθος 5–6 εκατοστά, ρυθμός 100–120 συμπιέσεις το λεπτό. Άφηνε το στήθος να επανέρχεται πλήρως.","Αν έχεις εκπαιδευτεί: 30 συμπιέσεις και 2 εμφυσήσεις. Αν όχι, κάνε μόνο συνεχείς συμπιέσεις.","Μόλις έρθει απινιδωτής, άνοιξέ τον και ακολούθησε τις φωνητικές οδηγίες.","Μην σταματάς μέχρι να έρθει το ΕΚΑΒ, να αρχίσει να αναπνέει φυσιολογικά ή να εξαντληθείς."]},{"type":"tip","title":"Καλό να ξέρεις","items":["Ο διασώστης του ΕΚΑΒ στο τηλέφωνο μπορεί να σε καθοδηγεί βήμα βήμα.","Ένα σεμινάριο Βασικής Υποστήριξης Ζωής διαρκεί λίγες ώρες και μπορεί να σώσει ζωή."]}],"sources":[{"label":"ERC – Adult Basic Life Support 2025","url":"https://www.erc.edu/media/wrhj5sye/gl2025-04-bls-e.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"kardia","title":"Πόνος στο στήθος (πιθανό έμφραγμα)","icon":"💔","urgent":true,"lead":"Πόνος ή πίεση στο στήθος που κρατά πάνω από λίγα λεπτά: κάλεσε αμέσως 166. Μην τον αφήσεις να οδηγήσει.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Σημάδια","items":["Πόνος, βάρος ή σφίξιμο στο στήθος, που μπορεί να απλώνεται σε χέρι, λαιμό, σαγόνι ή πλάτη.","Δύσπνοια, κρύος ιδρώτας, ναυτία, ζάλη.","Σε γυναίκες, ηλικιωμένους και διαβητικούς τα σημάδια μπορεί να είναι πιο ήπια: κούραση, δυσφορία, ναυτία."]},{"type":"steps","title":"Τι κάνεις","items":["Κάλεσε 166 και πες «πόνος στο στήθος».","Βάλε τον να κάτσει σε άνετη θέση, συνήθως μισοκαθιστός, και χαλάρωσε ρούχα που σφίγγουν.","Μην τον αφήσεις να περπατήσει ή να οδηγήσει.","Ο διασώστης στο τηλέφωνο μπορεί να σου ζητήσει να του δώσεις ασπιρίνη να μασήσει. Κάνε το μόνο αν σου το πει και αν ο άνθρωπος δεν έχει αλλεργία σε αυτή.","Αν χάσει τις αισθήσεις του και δεν αναπνέει φυσιολογικά, ξεκίνα ΚΑΡΠΑ και ζήτα απινιδωτή."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"},{"label":"ΕΚΑΒ","url":"https://www.ekab.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"egkefaliko","title":"Εγκεφαλικό: ο κανόνας Χ.Ο.Π.Α.","icon":"🧠","urgent":true,"lead":"Ξαφνική αδυναμία στο ένα χέρι, μπερδεμένη ομιλία ή στραβό πρόσωπο: κάλεσε αμέσως 166. Κάθε λεπτό μετρά.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Χ.Ο.Π.Α.","items":["Χ – Χέρι: ζήτα του να σηκώσει και τα δύο χέρια. Πέφτει το ένα;","Ο – Ομιλία: ζήτα του να πει μια απλή φράση. Μιλά μπερδεμένα ή δεν βρίσκει λέξεις;","Π – Πρόσωπο: ζήτα του να χαμογελάσει. Στραβώνει η μία πλευρά;","Α – Ασθενοφόρο: αν δεις έστω και ένα από αυτά, κάλεσε 166 αμέσως."]},{"type":"steps","title":"Τι κάνεις","items":["Κάλεσε 166 και πες «πιθανό εγκεφαλικό».","Κοίτα την ώρα: πες στο ΕΚΑΒ πότε ξεκίνησαν τα συμπτώματα ή πότε τον είδες τελευταία φορά καλά. Είναι κρίσιμο για τη θεραπεία.","Μην του δώσεις να φάει, να πιει ή φάρμακα.","Αν χάσει τις αισθήσεις του αλλά αναπνέει, γύρισέ τον στη θέση ανάνηψης."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"},{"label":"ΕΚΑΒ","url":"https://www.ekab.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"anafylaxia","title":"Σοβαρή αλλεργική αντίδραση","icon":"🐝","urgent":true,"lead":"Δυσκολία στην αναπνοή, πρήξιμο σε πρόσωπο ή λαιμό μετά από τσίμπημα, φαγητό ή φάρμακο: κάλεσε αμέσως 166.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Σημάδια","items":["Δυσκολία στην αναπνοή, σφύριγμα, βραχνή φωνή.","Πρήξιμο σε χείλη, γλώσσα, πρόσωπο ή λαιμό.","Εξάνθημα σε όλο το σώμα, ζάλη, λιποθυμία."]},{"type":"steps","title":"Τι κάνεις","items":["Κάλεσε 166 και πες «σοβαρή αλλεργική αντίδραση».","Αν ο άνθρωπος έχει δική του ένεση αδρεναλίνης, βοήθησέ τον να την κάνει αμέσως, όπως λένε οι οδηγίες της συσκευασίας, στο εξωτερικό μέρος του μηρού.","Αν δυσκολεύεται να αναπνεύσει, άφησέ τον να κάτσει. Αν ζαλίζεται ή χλωμιάζει, ξάπλωσέ τον με τα πόδια ψηλά.","Αν δεν βελτιώνεται και υπάρχει δεύτερη ένεση, ακολούθησε τις οδηγίες του ΕΚΑΒ.","Αν σταματήσει να αναπνέει φυσιολογικά, ξεκίνα ΚΑΡΠΑ."]},{"type":"tip","title":"Από πριν","items":["Όποιος έχει γνωστή σοβαρή αλλεργία πρέπει να έχει πάντα μαζί του τη δική του ένεση αδρεναλίνης. Βάλε μία και στην τσάντα διαφυγής, με τη σύσταση του γιατρού."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"},{"label":"ΕΚΑΒ","url":"https://www.ekab.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"aimorragia","title":"Σοβαρή αιμορραγία","icon":"🩸","urgent":true,"lead":"Πίεσε δυνατά και σταθερά πάνω στην πληγή. Κάλεσε 166.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Βήματα","items":["Φόρεσε γάντια αν έχεις.","Πίεσε απευθείας πάνω στην πληγή με καθαρή γάζα ή ύφασμα, με όλη σου τη δύναμη, χωρίς διακοπή.","Αν το αίμα περνά, μην αφαιρείς τη γάζα. Βάλε κι άλλη από πάνω και συνέχισε να πιέζεις.","Κράτα τον άνθρωπο ξαπλωμένο και ζεστό.","Αν η αιμορραγία σε χέρι ή πόδι απειλεί τη ζωή και δεν σταματά με πίεση, μπορεί να χρειαστεί αιμοστατική ταινία (tourniquet). Χρησιμοποίησέ την μόνο αν έχεις εκπαιδευτεί ή σε καθοδηγεί το ΕΚΑΒ."]},{"type":"warn","title":"Μην","items":["Μην αφαιρείς αντικείμενο που έχει καρφωθεί στην πληγή. Πίεσε γύρω του."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"},{"label":"Ελληνικός Ερυθρός Σταυρός","url":"https://www.redcross.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"pnigmoni","title":"Πνιγμονή από φαγητό ή αντικείμενο","icon":"🫁","urgent":true,"lead":"Αν μπορεί να βήξει, ενθάρρυνέ τον να βήχει. Αν δεν μπορεί να βήξει ή να μιλήσει, δράσε αμέσως.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Ενήλικας ή παιδί πάνω από 1 έτους","items":["Σκύψε τον μπροστά και δώσε έως 5 δυνατά χτυπήματα στην πλάτη, ανάμεσα στις ωμοπλάτες, με τη βάση της παλάμης.","Αν δεν βγει: στάσου πίσω του, βάλε τη γροθιά σου ανάμεσα στον αφαλό και το στέρνο, πιάσε τη με το άλλο χέρι και τράβα απότομα προς τα μέσα και πάνω, έως 5 φορές.","Εναλλάσσε 5 χτυπήματα στην πλάτη και 5 κοιλιακές ωθήσεις μέχρι να βγει το αντικείμενο.","Αν χάσει τις αισθήσεις του: κάλεσε 166 και ξεκίνα ΚΑΡΠΑ."]},{"type":"warn","title":"Βρέφος κάτω του 1 έτους","items":["Όχι κοιλιακές ωθήσεις. Χτυπήματα στην πλάτη με το βρέφος μπρούμυτα στο αντιβράχιό σου και θωρακικές ωθήσεις με δύο δάχτυλα. Κάλεσε 166 για καθοδήγηση."]},{"type":"tip","title":"Μετά","items":["Όποιος δέχτηκε κοιλιακές ωθήσεις πρέπει να τον δει γιατρός."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"egkavmata","title":"Εγκαύματα","icon":"🔥","lead":"Δρόσισε με τρεχούμενο νερό βρύσης για 20 λεπτά. Τίποτα άλλο πάνω στο έγκαυμα.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Βήματα","items":["Απομάκρυνε την πηγή της θερμότητας.","Δρόσισε το έγκαυμα με χλιαρό ή δροσερό τρεχούμενο νερό για 20 λεπτά.","Βγάλε δαχτυλίδια, ρολόγια και ρούχα γύρω από το έγκαυμα, εκτός αν έχουν κολλήσει στο δέρμα.","Κάλυψε χαλαρά με μεμβράνη τροφίμων ή καθαρή σακούλα.","Κράτα τον υπόλοιπο άνθρωπο ζεστό."]},{"type":"warn","title":"Μην","items":["Μην βάζεις πάγο, οδοντόκρεμα, βούτυρο, λάδι ή γιαούρτι.","Μην σπας τις φουσκάλες."]},{"type":"warn","title":"Κάλεσε 166 αν","items":["το έγκαυμα είναι μεγαλύτερο από την παλάμη του ανθρώπου,","είναι στο πρόσωπο, στα χέρια, στα πόδια ή στα γεννητικά όργανα,","είναι από ηλεκτρισμό ή χημικό,","αφορά παιδί ή ηλικιωμένο,","το δέρμα είναι λευκό, καφέ ή απανθρακωμένο."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"},{"label":"Ελληνικός Ερυθρός Σταυρός","url":"https://www.redcross.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"thermoplixia","title":"Θερμοπληξία","icon":"🥵","urgent":true,"lead":"Επείγον περιστατικό. Κάλεσε 166 και ξεκίνα ψύξη αμέσως.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Σημάδια","items":["Πολύ υψηλή θερμοκρασία σώματος.","Ζεστό, κόκκινο δέρμα, ξηρό ή υγρό.","Σύγχυση, παράξενη συμπεριφορά, ζάλη, λιποθυμία ή σπασμοί."]},{"type":"steps","title":"Τι κάνεις","items":["Κάλεσε 166.","Μετέφερε τον άνθρωπο σε σκιά ή σε δροσερό χώρο.","Βγάλε περιττά ρούχα.","Ψύξε τον όσο πιο γρήγορα γίνεται: βρέξε το σώμα με δροσερό νερό και κάνε αέρα, βάλε κρύες κομπρέσες ή πάγο τυλιγμένο σε πανί σε λαιμό, μασχάλες και βουβωνική χώρα.","Αν έχει πλήρεις αισθήσεις και μπορεί να καταπιεί, δώσε του δροσερό νερό σε μικρές γουλιές."]},{"type":"tip","title":"Θερμική εξάντληση (πιο ήπια μορφή)","items":["Έντονη εφίδρωση, αδυναμία, πονοκέφαλος, ναυτία. Ξεκούραση σε δροσιά, νερό και ψύξη. Αν δεν βελτιωθεί σε 30 λεπτά ή χειροτερέψει, κάλεσε 166."]}],"sources":[{"label":"ΕΟΔΥ – Καύσωνας","url":"https://eody.gov.gr/"},{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"ypothermia","title":"Υποθερμία","icon":"🥶","lead":"Ζέστανέ τον σταδιακά. Βγάλε βρεγμένα ρούχα, τύλιξέ τον, προστάτεψέ τον από το έδαφος.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Σημάδια","items":["Έντονο τρέμουλο, κρύο και χλωμό δέρμα.","Σύγχυση, αργή ομιλία, αδέξιες κινήσεις, υπνηλία.","Σε σοβαρή υποθερμία το τρέμουλο μπορεί να σταματήσει: είναι κακό σημάδι."]},{"type":"steps","title":"Τι κάνεις","items":["Μετέφερέ τον σε ζεστό, στεγνό χώρο ή προστάτεψέ τον από αέρα και κρύο έδαφος.","Βγάλε βρεγμένα ρούχα και τύλιξέ τον με στεγνές κουβέρτες, μαζί με το κεφάλι. Η θερμική κουβέρτα βοηθά από πάνω.","Αν έχει πλήρεις αισθήσεις, δώσε ζεστό, γλυκό ρόφημα. Όχι αλκοόλ.","Χειρίσου τον απαλά. Κάλεσε 166 αν τα σημάδια είναι έντονα."]},{"type":"warn","title":"Μην","items":["Μην τον βάλεις σε καυτό νερό και μην τρίβεις χέρια και πόδια.","Μην βάζεις θερμοφόρα ή καυτά αντικείμενα απευθείας στο δέρμα."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"katagmata","title":"Κατάγματα & διαστρέμματα","icon":"🦴","lead":"Ακινητοποίησε το τραυματισμένο μέλος στη θέση που το βρήκες. Μην προσπαθήσεις να το ισιώσεις.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Τι κάνεις","items":["Ζήτησε από τον άνθρωπο να μην κουνά το μέλος.","Στήριξε το μέλος με μαξιλάρια, ρούχα ή αυτοσχέδιο νάρθηκα (περιοδικό, σανίδα) πάνω και κάτω από το σημείο.","Βάλε κρύο τυλιγμένο σε πανί για 10–20 λεπτά, για πόνο και πρήξιμο.","Αν υπάρχει ανοιχτή πληγή, κάλυψέ τη με καθαρή γάζα χωρίς να πιέζεις το κόκκαλο."]},{"type":"warn","title":"Κάλεσε 166 και μην τον μετακινήσεις αν","items":["υποψιάζεσαι τραυματισμό σε κεφάλι, αυχένα ή πλάτη,","το κόκκαλο φαίνεται ή το μέλος έχει παραμορφωθεί έντονα,","το χέρι ή το πόδι κάτω από τον τραυματισμό είναι κρύο, χλωμό ή μουδιασμένο."]}],"sources":[{"label":"Ελληνικός Ερυθρός Σταυρός","url":"https://www.redcross.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"thesi-ananipsis","title":"Θέση ανάνηψης","icon":"🛌","lead":"Για άνθρωπο που δεν αντιδρά αλλά αναπνέει φυσιολογικά: γύρισέ τον στο πλάι για να μένει ανοιχτός ο αεραγωγός.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Βήματα","items":["Γονάτισε δίπλα του. Το κοντινό σου χέρι του βάλ' το σε ορθή γωνία προς τα πάνω.","Το μακρινό του χέρι φέρ' το πάνω από το στήθος, με τη ράχη της παλάμης στο μάγουλό του.","Λύγισε το μακρινό του γόνατο και τράβα το προς το μέρος σου για να γυρίσει στο πλάι.","Γείρε απαλά το κεφάλι πίσω ώστε να είναι ανοιχτός ο αεραγωγός.","Κάλεσε 166 και έλεγχε συνέχεια την αναπνοή. Αν σταματήσει να αναπνέει φυσιολογικά, γύρισέ τον ανάσκελα και ξεκίνα ΚΑΡΠΑ."]},{"type":"warn","title":"Προσοχή","items":["Αν υποψιάζεσαι τραυματισμό στη σπονδυλική στήλη, μην τον μετακινείς εκτός αν κινδυνεύει να πνιγεί ή ο χώρος δεν είναι ασφαλής."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"lipothymia","title":"Λιποθυμία","icon":"😵","lead":"Ξάπλωσέ τον ανάσκελα και σήκωσε λίγο τα πόδια. Αν δεν συνέλθει μέσα σε ένα λεπτό, κάλεσε 166.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Αν νιώθει ότι θα λιποθυμήσει","items":["Βάλε τον να ξαπλώσει ή να κάτσει κάτω, για να μην πέσει και χτυπήσει.","Αν είναι ξαπλωμένος, σήκωσε τα πόδια του λίγο ψηλότερα από την καρδιά.","Δροσερός αέρας, χαλαρά ρούχα."]},{"type":"steps","title":"Αν λιποθύμησε","items":["Έλεγξε αν αναπνέει φυσιολογικά. Αν όχι, κάλεσε 166 και ξεκίνα ΚΑΡΠΑ.","Αν αναπνέει, άφησέ τον ξαπλωμένο. Αν δεν συνέλθει γρήγορα, γύρισέ τον στη θέση ανάνηψης και κάλεσε 166.","Όταν συνέλθει, να σηκωθεί σιγά σιγά."]},{"type":"warn","title":"Κάλεσε 166 αν","items":["δεν συνέρχεται μέσα σε ένα λεπτό,","λιποθύμησε κατά τη διάρκεια άσκησης ή είχε πόνο στο στήθος ή αίσθημα παλμών,","είναι έγκυος, ηλικιωμένος ή χτύπησε το κεφάλι του."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"},{"label":"ΕΚΑΒ","url":"https://www.ekab.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"spasmoi","title":"Σπασμοί (κρίση επιληψίας)","icon":"⚡","lead":"Προστάτεψε το κεφάλι του, μην τον κρατάς και μην βάζεις τίποτα στο στόμα του. Μέτρα τον χρόνο.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Κατά τη διάρκεια","items":["Απομάκρυνε αντικείμενα με τα οποία μπορεί να χτυπήσει.","Βάλε κάτι μαλακό κάτω από το κεφάλι του.","Μην τον ακινητοποιείς και μην βάζεις τίποτα στο στόμα του. Δεν «καταπίνει τη γλώσσα του».","Κοίτα την ώρα που ξεκίνησαν οι σπασμοί."]},{"type":"steps","title":"Μετά","items":["Όταν σταματήσουν, γύρισέ τον στη θέση ανάνηψης και έλεγξε την αναπνοή.","Μείνε μαζί του. Είναι φυσιολογικό να είναι μπερδεμένος ή νυσταγμένος για λίγο."]},{"type":"warn","title":"Κάλεσε 166 αν","items":["οι σπασμοί κρατούν πάνω από 5 λεπτά ή ξαναρχίζουν,","είναι η πρώτη φορά, ή είναι έγκυος, διαβητικός ή τραυματίστηκε,","δεν αναπνέει φυσιολογικά μετά ή δεν συνέρχεται,","έγινε μέσα στο νερό."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"},{"label":"ΕΚΑΒ","url":"https://www.ekab.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"kefali","title":"Χτύπημα στο κεφάλι","icon":"🤕","lead":"Κρύο στο σημείο και παρακολούθηση για 24 ώρες. Αν λιποθύμησε, κάνει εμετό ή είναι μπερδεμένος, κάλεσε 166.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Τι κάνεις","items":["Αν υποψιάζεσαι τραυματισμό στον αυχένα (πτώση από ύψος, τροχαίο), μην τον μετακινήσεις. Κράτα το κεφάλι ακίνητο και κάλεσε 166.","Βάλε κρύο τυλιγμένο σε πανί στο σημείο.","Αν αιμορραγεί, πίεσε με καθαρή γάζα.","Μην τον αφήσεις μόνο του για τις επόμενες 24 ώρες."]},{"type":"warn","title":"Κάλεσε 166 αν","items":["έχασε τις αισθήσεις του, έστω και για λίγο,","κάνει εμετό, έχει δυνατό πονοκέφαλο που χειροτερεύει, σύγχυση ή υπνηλία,","έχει σπασμούς, αδυναμία σε χέρι ή πόδι, ή θολή όραση,","τρέχει διάφανο υγρό ή αίμα από μύτη ή αυτιά,","παίρνει αντιπηκτικά φάρμακα ή είναι ηλικιωμένος ή μικρό παιδί."]}],"sources":[{"label":"European Resuscitation Council – Guidelines 2025","url":"https://www.erc.edu/science-research/"},{"label":"ΕΚΑΒ","url":"https://www.ekab.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"dilitiriasi","title":"Δηλητηρίαση","icon":"🧪","lead":"Πιθανή δηλητηρίαση: μην προκαλείς εμετό και μην δίνεις ουσίες ή φάρμακα χωρίς οδηγία. Αν υπάρχει απειλή ζωής, κάλεσε αμέσως 112 ή 166.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Τι κάνεις","items":["Απομάκρυνε τον άνθρωπο από την ουσία. Για αέρια ή καπνό: βγες στον καθαρό αέρα.","Κάλεσε το Κέντρο Δηλητηριάσεων ή το 166. Έχε τη συσκευασία μπροστά σου: τι ήταν, πόσο, πότε.","Για ουσία στο δέρμα ή στα μάτια: ξέπλυνε με άφθονο νερό για τουλάχιστον 15 λεπτά.","Αν δεν αντιδρά ή δεν αναπνέει, ακολούθησε τις κάρτες «Θέση ανάνηψης» ή «ΚΑΡΠΑ»."]},{"type":"warn","title":"Μην","items":["Μην προκαλείς εμετό και μην δίνεις γάλα ή άλλα «αντίδοτα» αν δεν σου το πουν οι ειδικοί."]}],"sources":[{"label":"Κέντρο Δηλητηριάσεων","url":"https://www.paidon-agiasofia.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"dagkoma","title":"Δάγκωμα ζώου","icon":"🐾","lead":"Πλύνε αμέσως την πληγή με σαπούνι και τρεχούμενο νερό για 15 λεπτά. Μετά πήγαινε σε γιατρό την ίδια μέρα.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Τι κάνεις","items":["Αν αιμορραγεί πολύ, πίεσε πρώτα με καθαρή γάζα και κάλεσε 166.","Πλύνε καλά την πληγή με σαπούνι και άφθονο τρεχούμενο νερό για τουλάχιστον 15 λεπτά.","Βάλε αντισηπτικό και κάλυψε χαλαρά με καθαρή γάζα.","Πήγαινε σε γιατρό ή νοσοκομείο την ίδια μέρα, για έλεγχο λοίμωξης, τετάνου και λύσσας.","Αν μπορείς, σημείωσε ποιο ζώο ήταν, πού και αν έχει ιδιοκτήτη ή βιβλιάριο εμβολίων. Μην προσπαθήσεις να το πιάσεις."]},{"type":"warn","title":"Πάντα σε γιατρό αν","items":["Το δάγκωμα είναι από άγριο ζώο, νυχτερίδα ή αδέσποτο.","Είναι στο πρόσωπο, στα χέρια, κοντά σε άρθρωση ή είναι βαθύ.","Εμφανιστεί κοκκίνισμα, πρήξιμο, πύον ή πυρετός τις επόμενες ημέρες."]}],"sources":[{"label":"WHO – Animal bites","url":"https://www.who.int/"},{"label":"ΕΟΔΥ","url":"https://eody.gov.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"psyxologia","title":"Ψυχολογία & παιδιά","icon":"🧠","order":9,"intro":"Πώς κρατάς ψυχραιμία, πώς στηρίζεις τα παιδιά και τους πιο ευάλωτους, πριν, κατά και μετά την κρίση.","cards":[{"id":"panikos","title":"Πανικός: ηρέμησε για να σκεφτείς","icon":"🫁","lead":"Ο φόβος είναι φυσιολογικός. Μια αργή ανάσα σου δίνει τον χρόνο να πάρεις τη σωστή απόφαση.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Αναπνοή σε 1 λεπτό","items":["Πάρε ανάσα από τη μύτη μετρώντας ως το 4.","Βγάλε τον αέρα αργά από το στόμα μετρώντας ως το 6.","Επανάλαβε 5 φορές. Η αργή εκπνοή ηρεμεί τον καρδιακό ρυθμό."]},{"type":"list","title":"Γείωση στο εδώ και τώρα","items":["Πες 5 πράγματα που βλέπεις, 4 που ακούς, 3 που αγγίζεις.","Πάτα σταθερά τα πόδια στο πάτωμα και νιώσε το βάρος σου."]},{"type":"tip","title":"Μετά","items":["Διάλεξε μία επόμενη κίνηση και κάν' την. Μετά την επόμενη.","Μίλα σε κάποιον δίπλα σου. Η ηρεμία είναι μεταδοτική, όπως και ο πανικός."]}],"sources":[{"label":"WHO – Psychological first aid","url":"https://www.who.int/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"meta-tin-krisi","title":"Μετά την κρίση: τι είναι φυσιολογικό","icon":"🌱","lead":"Αϋπνία, νεύρα, φόβος ή θλίψη για μέρες ή εβδομάδες είναι συνηθισμένες αντιδράσεις. Δεν είσαι μόνος.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Τι βοηθά","items":["Επιστροφή σε μια απλή ρουτίνα: ύπνος, φαγητό, κίνηση.","Επαφή με ανθρώπους που εμπιστεύεσαι.","Λιγότερες ειδήσεις και βίντεο από την καταστροφή, ειδικά πριν τον ύπνο.","Να βοηθάς άλλους με κάτι πρακτικό, όταν μπορείς."]},{"type":"warn","title":"Ζήτα βοήθεια αν","items":["Τα συμπτώματα δεν βελτιώνονται μετά από μερικές εβδομάδες ή χειροτερεύουν.","Δεν μπορείς να κοιμηθείς, να δουλέψεις ή να φροντίσεις τον εαυτό σου ή την οικογένειά σου.","Γραμμή ψυχοκοινωνικής υποστήριξης: 10306. Σε άμεσο κίνδυνο: 112."]}],"sources":[{"label":"WHO – Mental health in emergencies","url":"https://www.who.int/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"paidia-milao","title":"Πώς μιλάω στα παιδιά","icon":"🧒","lead":"Τα παιδιά παίρνουν τη στάση τους από τους μεγάλους. Ειλικρίνεια με απλά λόγια και πολλή σιγουριά.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τι λες","items":["Την αλήθεια, με λόγια για την ηλικία τους: «Έγινε σεισμός. Είμαστε μαζί και ξέρουμε τι να κάνουμε».","Τι κάνουν οι μεγάλοι για να είναι όλοι ασφαλείς.","Απάντα στις ίδιες ερωτήσεις όσες φορές χρειαστεί. Έτσι ηρεμούν."]},{"type":"list","title":"Τι κάνεις","items":["Κράτα όσο γίνεται ρουτίνα: φαγητό, ύπνος, παιχνίδι.","Δώσε τους μια μικρή δουλειά: να κρατάνε τον φακό, να μοιράζουν νερό. Νιώθουν ότι βοηθάνε.","Περιόρισε τις εικόνες της καταστροφής στην τηλεόραση και στα κινητά.","Άφησέ τα να ζωγραφίσουν ή να παίξουν αυτό που έζησαν. Είναι ο τρόπος τους να το επεξεργαστούν."]},{"type":"tip","title":"Φυσιολογικό","items":["Για λίγο καιρό τα παιδιά μπορεί να κολλάνε στους γονείς, να ξαναβρέξουν το κρεβάτι ή να έχουν εφιάλτες. Αν κρατήσει πολύ, μίλα με παιδίατρο ή ψυχολόγο."]}],"sources":[{"label":"UNICEF – Talking to children in crisis","url":"https://www.unicef.org/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"paidia-proetoimasia","title":"Ετοίμασε τα παιδιά από πριν","icon":"🎒","lead":"Ένα παιδί που έχει κάνει πρόβα ξέρει τι να κάνει και φοβάται λιγότερο.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Μάθε τους","items":["«Σκύψε, κάλυψου, κρατήσου» σαν παιχνίδι, με πρόβα στο σπίτι.","Το ονοματεπώνυμό τους, τη διεύθυνση και ένα τηλέφωνο γονιού. Για τα μικρά, σε καρτέλα στην τσάντα.","Πότε και πώς καλούν το 112.","Το σημείο συνάντησης της οικογένειας."]},{"type":"list","title":"Ετοίμασε","items":["Μάθε το σχέδιο έκτακτης ανάγκης του σχολείου και ποιος μπορεί να παραλάβει το παιδί.","Ένα μικρό σακίδιο για κάθε παιδί με νερό, σνακ, φακό, σφυρίχτρα και το αγαπημένο τους λούτρινο ή παιχνίδι."]}],"sources":[{"label":"ΟΑΣΠ – Εκπαιδευτικό υλικό","url":"https://www.oasp.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"evalotoi","title":"Ηλικιωμένοι & άτομα με αναπηρία","icon":"🧓","lead":"Χρειάζονται σχέδιο από πριν και κάποιον που θα τους ελέγξει πρώτο.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τι ετοιμάζεις","items":["Δύο τουλάχιστον άτομα (συγγενής, γείτονας) που θα επικοινωνήσουν ή θα πάνε αμέσως.","Λίστα φαρμάκων, δόσεων και γιατρών σε χαρτί, μέσα στην τσάντα διαφυγής.","Εφεδρικά γυαλιά, ακουστικά βαρηκοΐας με μπαταρίες, μπαστούνι ή περπατούρα κοντά στο κρεβάτι.","Σχέδιο για ιατρικές συσκευές που θέλουν ρεύμα.","Πώς θα μετακινηθούν σε εκκένωση, αν δεν οδηγούν ή δεν περπατούν εύκολα."]},{"type":"tip","title":"Καλό να ξέρεις","items":["Ρώτα τον δήμο σου για υπηρεσίες όπως το «Βοήθεια στο Σπίτι» και αν κρατά κατάλογο ευάλωτων κατοίκων για εκκένωση.","Για άτομα με προβλήματα ακοής: φρόντισε να λαμβάνουν τα μηνύματα 112 στο κινητό και να έχουν ειδοποίηση με δόνηση ή φως."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"geitonia","title":"Γειτονιά & αλληλοβοήθεια","icon":"🤝","lead":"Στις πρώτες ώρες, αυτοί που βοηθούν πρώτοι είναι συνήθως οι γείτονες.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Από τώρα","items":["Γνώρισε τους γείτονές σου και ανταλλάξτε τηλέφωνα.","Μάθε ποιος μένει μόνος, ποιος έχει μωρό, ποιος δυσκολεύεται να κινηθεί.","Μάθετε ποιος έχει γεννήτρια, εργαλεία, γνώσεις πρώτων βοηθειών ή αυτοκίνητο με μεγάλη χωρητικότητα."]},{"type":"tip","title":"Ιδέα","items":["Μια ομάδα στο κινητό για την πολυκατοικία ή τον δρόμο βοηθά πολύ σε κρίση. Συμφωνήστε να γράφετε μόνο επιβεβαιωμένες πληροφορίες."]}],"sources":[{"label":"Ελληνικός Ερυθρός Σταυρός","url":"https://www.redcross.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"trofi","title":"Τροφή","icon":"🥫","order":4,"intro":"Τι αποθηκεύεις, πώς το ανανεώνεις και πώς τρως με ασφάλεια όταν δεν υπάρχει ρεύμα.","cards":[{"id":"apothema","title":"Απόθεμα τροφίμων: τι αγοράζω","icon":"🛒","lead":"Τρόφιμα που τρώει ήδη η οικογένειά σου, που κρατούν πολύ και τρώγονται χωρίς μαγείρεμα.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τρώγονται κατευθείαν","items":["Κονσέρβες: τόνος, σαρδέλες, σκουμπρί, κρέας, όσπρια (ρεβίθια, φασόλια), καλαμπόκι, ντολμαδάκια.","Φρυγανιές, παξιμάδια, κριτσίνια, κράκερ.","Ξηροί καρποί, αποξηραμένα φρούτα, μπάρες δημητριακών.","Ταχίνι, φυστικοβούτυρο, μέλι, χαλβάς.","Γάλα μακράς διαρκείας, χυμοί σε μικρές συσκευασίες.","Σοκολάτα και κάτι γλυκό: βοηθά και στην ψυχολογία."]},{"type":"list","title":"Χρειάζονται λίγο μαγείρεμα","items":["Κους κους και πλιγούρι: φουσκώνουν μόνο με ζεστό νερό, χωρίς βράσιμο.","Ζυμαρικά, ρύζι, φακές: θέλουν καύσιμο και νερό, οπότε υπολόγισέ τα επιπλέον.","Ελαιόλαδο, αλάτι, ζάχαρη, καφές, τσάι."]},{"type":"tip","title":"Καλό να ξέρεις","items":["Προτίμησε συσκευασίες μιας μερίδας: δεν χρειάζεται ψυγείο για τα περισσεύματα.","Αν κάποιος έχει αλλεργία, κοιλιοκάκη ή διαβήτη, φρόντισε να υπάρχουν κατάλληλα τρόφιμα και στο απόθεμα.","Αλμυρά τρόφιμα αυξάνουν τη δίψα. Ισορρόπησέ τα με νερό."]}],"sources":[{"label":"Ευρωπαϊκή Επιτροπή – Ετοιμότητα πολιτών","url":"https://civil-protection-humanitarian-aid.ec.europa.eu/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"anakyklosi","title":"Ανανέωση αποθέματος","icon":"🔄","lead":"Το απόθεμα δεν είναι για να ξεχαστεί. Τρως το παλιό, αγοράζεις καινούργιο.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Πώς το κάνεις","items":["Γράψε με μαρκαδόρο την ημερομηνία λήξης μπροστά σε κάθε συσκευασία.","Βάλε τα καινούργια πίσω και τα παλιά μπροστά.","Όταν πλησιάζει η λήξη, φάε το στο κανονικό σου πρόγραμμα και αντικατάστησέ το.","Δύο φορές τον χρόνο κάνε γενικό έλεγχο. Χρησιμοποίησε τις ημερομηνίες λήξης στο «Κιτ» της εφαρμογής για υπενθύμιση."]}],"sources":[{"label":"ΕΦΕΤ – Ασφάλεια τροφίμων","url":"https://www.efet.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"mageirema","title":"Μαγείρεμα χωρίς ρεύμα","icon":"🍳","lead":"Γκαζάκι ή ψησταριά μόνο σε ανοιχτό χώρο. Και εξοικονόμησε καύσιμο.","status":"draft","updated":"2026-11","blocks":[{"type":"warn","title":"Ασφάλεια πρώτα","items":["Γκαζάκι κάμπινγκ, ψησταριά, μαγκάλι: μόνο έξω ή σε ανοιχτό μπαλκόνι, ποτέ μέσα στο σπίτι. Κίνδυνος μονοξειδίου και φωτιάς.","Μην αφήνεις φωτιά χωρίς επίβλεψη και κράτα τα παιδιά μακριά."]},{"type":"list","title":"Λιγότερο καύσιμο, λιγότερο νερό","items":["Μαγείρευε πάντα με καπάκι.","Κους κους και πλιγούρι: ρίξε βραστό νερό, σκέπασε και περίμενε 10 λεπτά.","Ζυμαρικά: βράσε τα 2 λεπτά, κλείσε τη φωτιά και άφησέ τα σκεπασμένα να ψηθούν στο ζεστό νερό.","Ένα θερμός κρατά νερό ζεστό για ώρες: για ρόφημα, βρεφικό γάλα ή φαγητό που φουσκώνει.","Το νερό από κονσέρβες λαχανικών μπορεί να μπει στο μαγείρεμα."]}],"sources":[{"label":"Πυροσβεστικό Σώμα","url":"https://www.fireservice.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"asfaleia-trofimon","title":"Ασφάλεια τροφίμων σε κρίση","icon":"🧊","lead":"Μια τροφική δηλητηρίαση είναι πολύ χειρότερη όταν δεν λειτουργούν νοσοκομεία και δρόμοι. Αν έχεις αμφιβολία, πέτα το.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Ψυγείο και καταψύκτης","items":["Κλειστό ψυγείο: περίπου 4 ώρες. Γεμάτος καταψύκτης: περίπου 48 ώρες.","Φάε πρώτα ό,τι είναι στο ψυγείο, μετά τον καταψύκτη και στο τέλος το απόθεμα."]},{"type":"warn","title":"Πέτα","items":["Κονσέρβες φουσκωμένες, σκουριασμένες, βαθουλωμένες στις ενώσεις ή που τρέχουν.","Τρόφιμα που μυρίζουν, έχουν μούχλα ή άλλαξαν υφή.","Ό,τι ήρθε σε επαφή με νερό πλημμύρας, εκτός από κονσέρβες που απολυμάνθηκαν."]},{"type":"tip","title":"Υγιεινή με λίγο νερό","items":["Καθάριζε τα χέρια με αντισηπτικό πριν από κάθε φαγητό.","Χρησιμοποίησε πιάτα μιας χρήσης ή σκέπασε τα πιάτα με μεμβράνη για να μην τα πλένεις."]}],"sources":[{"label":"ΕΦΕΤ","url":"https://www.efet.gr/"},{"label":"USDA – Food safety in emergencies","url":"https://www.foodsafety.gov/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"vrefi-diatrofi","title":"Βρέφη & ειδικές διατροφές","icon":"🍼","lead":"Τα βρέφη και όσοι έχουν ειδική διατροφή χρειάζονται δικό τους απόθεμα από πριν.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Βρέφη","items":["Αν θηλάζεις, συνέχισε. Είναι η πιο ασφαλής τροφή σε κρίση.","Το έτοιμο υγρό βρεφικό γάλα δεν χρειάζεται νερό και είναι η καλύτερη επιλογή για απόθεμα.","Αν χρησιμοποιείς σκόνη, φτιάξ' το με εμφιαλωμένο ή βρασμένο νερό και ακολούθησε τις οδηγίες της συσκευασίας. Χρειάζεσαι και καθαρά μπιμπερό.","Ρώτα τον παιδίατρο από πριν τι να έχεις στο απόθεμα."]},{"type":"list","title":"Ειδικές διατροφές","items":["Κοιλιοκάκη, τροφικές αλλεργίες, διαβήτης: κράτα απόθεμα από τα τρόφιμα που μπορεί να φάει ο άνθρωπος και γράψε τις ανάγκες του στο «Οικογενειακό σχέδιο».","Για όσους χρειάζονται φάρμακα με το φαγητό, έχε και κάτι που τρώγεται εύκολα."]}],"sources":[{"label":"WHO – Infant feeding in emergencies","url":"https://www.who.int/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"votana","title":"Βότανα & φύση","icon":"🌿","order":10,"intro":"Γνωστά βότανα για ρόφημα και τα επικίνδυνα φυτά που πρέπει να αναγνωρίζεις. Τα βότανα δεν αντικαθιστούν φάρμακα ή γιατρό.","cards":[{"id":"kanonas","title":"Ο χρυσός κανόνας","icon":"⚠️","urgent":true,"lead":"Αν δεν είσαι 100% σίγουρος τι φυτό είναι, δεν το τρως, δεν το πίνεις, δεν το βάζεις στη φωτιά για μαγείρεμα.","status":"review","updated":"2026-11","blocks":[{"type":"warn","title":"Γιατί","items":["Στην Ελλάδα φυτρώνουν θανατηφόρα φυτά που μοιάζουν πολύ με φαγώσιμα: το κώνειο μοιάζει με μαϊντανό και άγριο καρότο, ο μανδραγόρας με λάπαθο και σέσκουλο.","Οι «δοκιμές φαγώσιμου» που κυκλοφορούν στο internet (γεύση, τρίψιμο στο δέρμα) δεν είναι ασφαλείς. Μερικά δηλητήρια δρουν μετά από ώρες."]},{"type":"list","title":"Πάντα","items":["Μάζευε μόνο φυτά που ξέρεις ήδη από πριν, ιδανικά μαζί με κάποιον έμπειρο.","Μακριά από δρόμους, χωράφια με φυτοφάρμακα και ρυπασμένες περιοχές.","Προσοχή σε εγκυμοσύνη, θηλασμό, μικρά παιδιά και όποιον παίρνει φάρμακα: πολλά βότανα αλληλεπιδρούν με φάρμακα."]}],"sources":[{"label":"Κέντρο Δηλητηριάσεων","url":"https://www.paidon-agiasofia.gr/"},{"label":"ΕΟΦ – Φυτικά προϊόντα","url":"https://www.eof.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"rofimata","title":"Βότανα για ζεστό ρόφημα","icon":"🍵","lead":"Αποξηραμένα βότανα της κουζίνας στο απόθεμα: ζεστό ρόφημα για ηρεμία και ζέστη. Αγόρασέ τα συσκευασμένα από πριν.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Συνηθισμένα και γνωστά","items":["Χαμομήλι: παραδοσιακά για χαλάρωση και το στομάχι. Προσοχή αν έχεις αλλεργία στα αγριολούλουδα της ίδιας οικογένειας (π.χ. αμβροσία).","Τσάι του βουνού (σιδερίτης): ζεστό ρόφημα, παραδοσιακά για κρυολόγημα.","Θυμάρι: παραδοσιακά για βήχα και λαιμό.","Μέντα και δυόσμος: για το στομάχι. Μπορεί να χειροτερέψουν τις καούρες.","Φασκόμηλο: παραδοσιακά για τον λαιμό. Όχι σε εγκυμοσύνη, θηλασμό και όχι σε μεγάλες ποσότητες ή για πολλές μέρες."]},{"type":"steps","title":"Πώς το φτιάχνεις","items":["Βάλε 1 κουταλάκι αποξηραμένο βότανο σε ένα φλιτζάνι βραστό νερό.","Σκέπασε και άφησε 5–10 λεπτά.","Σούρωσε. Λίγο μέλι αν θες (όχι μέλι σε βρέφη κάτω του 1 έτους)."]},{"type":"warn","title":"Προσοχή","items":["Τα βότανα δεν θεραπεύουν λοιμώξεις, πυρετό που επιμένει ή σοβαρά συμπτώματα. Αν κάποιος χειροτερεύει, κάλεσε 166."]}],"sources":[{"label":"European Medicines Agency – Herbal medicines","url":"https://www.ema.europa.eu/"},{"label":"ΕΟΦ","url":"https://www.eof.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"epikindyna","title":"Επικίνδυνα φυτά που μοιάζουν αθώα","icon":"☠️","lead":"Μάθε να τα αναγνωρίζεις και μάθε τα στα παιδιά. Μερικά σκοτώνουν σε μικρή ποσότητα.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Συχνά στην Ελλάδα","items":["Πικροδάφνη: παντού σε δρόμους και κήπους. Όλο το φυτό είναι δηλητηριώδες. Ούτε φύλλα, ούτε κλαδιά για σουβλάκι, ούτε καύση για μαγείρεμα.","Κώνειο: μοιάζει με μαϊντανό, άγριο καρότο ή μάραθο. Θανατηφόρο.","Μανδραγόρας: φύλλα σε ροζέτα που μοιάζουν με λάπαθο ή σέσκουλο. Έχει προκαλέσει δηλητηριάσεις από λάθος συλλογή χόρτων.","Τάτουλας (ντατούρα): μεγάλα λευκά λουλούδια σαν χωνί και αγκαθωτοί καρποί. Πολύ τοξικός.","Ρετσινολαδιά: οι σπόροι είναι θανατηφόροι.","Δακτυλίτιδα: καλλωπιστικό, επηρεάζει την καρδιά."]},{"type":"warn","title":"Μανιτάρια","items":["Μην τρως άγρια μανιτάρια αν δεν τα έχει αναγνωρίσει έμπειρος. Τα πιο θανατηφόρα μοιάζουν με φαγώσιμα και τα συμπτώματα αργούν πολλές ώρες, όταν η βλάβη στο συκώτι έχει ήδη γίνει."]}],"sources":[{"label":"Κέντρο Δηλητηριάσεων","url":"https://www.paidon-agiasofia.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"an-efage","title":"Αν κάποιος έφαγε κάτι ύποπτο","icon":"📞","urgent":true,"lead":"Κάλεσε αμέσως το Κέντρο Δηλητηριάσεων 210 779 3777, ακόμη κι αν δεν έχει συμπτώματα.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Τι κάνεις","items":["Κάλεσε Κέντρο Δηλητηριάσεων ή 166.","Κράτα δείγμα ή φωτογραφία του φυτού ή του μανιταριού.","Πες πόσο έφαγε, πότε και ποια συμπτώματα έχει.","Μην προκαλέσεις εμετό και μη δώσεις τίποτα χωρίς οδηγία."]}],"sources":[{"label":"Κέντρο Δηλητηριάσεων","url":"https://www.paidon-agiasofia.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"xorta","title":"Χόρτα: μόνο αν τα ξέρεις ήδη","icon":"🥬","lead":"Τα χόρτα είναι μέρος της ελληνικής κουζίνας, αλλά σε κρίση δεν είναι ώρα για πειράματα.","status":"review","updated":"2026-11","blocks":[{"type":"list","title":"Αν μαζεύεις","items":["Μόνο είδη που έχεις μαζέψει πολλές φορές στο παρελθόν με κάποιον που τα ξέρει.","Ένα-ένα φύλλο, όχι χούφτες: ένα τοξικό φυτό μπορεί να κρύβεται ανάμεσα στα φαγώσιμα.","Πλύνε καλά και μαγείρεψέ τα.","Μην μαζεύεις κοντά σε δρόμους, σκουπίδια ή χωράφια με φυτοφάρμακα."]},{"type":"tip","title":"Καλύτερα","items":["Το απόθεμα τροφίμων είναι πολύ πιο ασφαλής λύση από τη συλλογή άγριων φυτών για 72 ώρες ή και περισσότερο."]}],"sources":[{"label":"Κέντρο Δηλητηριάσεων","url":"https://www.paidon-agiasofia.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"zoa","title":"Ζώα συντροφιάς","icon":"🐾","order":8,"intro":"Τα ζώα σου εξαρτώνται από σένα. Ένα σχέδιο από πριν τα κρατά ασφαλή και σε κρατά κι εσένα μακριά από επικίνδυνες αποφάσεις.","cards":[{"id":"zoa-sxedio","title":"Σχέδιο για τα κατοικίδια","icon":"📋","lead":"Microchip, ταυτότητα στο κολάρο, φωτογραφία και ένα μέρος να πάνε αν χρειαστεί να φύγετε.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Από τώρα","items":["Σήμανση (microchip) και καταγραφή με τα σωστά, ενημερωμένα τηλέφωνά σου.","Κολάρο με ταυτότητα και τηλέφωνο.","Πρόσφατη φωτογραφία του ζώου, και μία μαζί σου, για να αποδείξεις ότι είναι δικό σου.","Ρώτα από πριν ποιοι χώροι φιλοξενίας δέχονται ζώα. Πολλοί δεν δέχονται.","Βρες έναν φίλο ή συγγενή εκτός περιοχής που μπορεί να τα φιλοξενήσει.","Συνήθισε τη γάτα στο κλουβί μεταφοράς: άφηνέ το ανοιχτό στο σπίτι με μια κουβέρτα μέσα."]},{"type":"tip","title":"Στο κιτ","items":["Τροφή, νερό, φάρμακα, βιβλιάριο υγείας, λουρί, κλουβί μεταφοράς, άμμος και σακούλες. Τα ζώα υπολογίζονται στο «Κιτ» της εφαρμογής."]}],"sources":[{"label":"Ready.gov – Prepare your pets for disasters","url":"https://www.ready.gov/pets"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"zoa-ekkenosi","title":"Εκκένωση με ζώα","icon":"🚗","urgent":true,"lead":"Φεύγεις νωρίς και τα παίρνεις μαζί σου. Αν δεν είναι ασφαλές για σένα να μείνεις, δεν είναι ούτε για εκείνα.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Τι κάνεις","items":["Με την πρώτη προειδοποίηση, μάζεψε τα ζώα σε ένα δωμάτιο για να μη χρειαστεί να τα ψάχνεις.","Σκύλοι με λουρί, γάτες και μικρά ζώα σε κλουβί μεταφοράς. Τα φοβισμένα ζώα το σκάνε.","Πάρε την τσάντα τους μαζί με τη δική σου."]},{"type":"warn","title":"Αν αναγκαστείς να τα αφήσεις (μόνο ως έσχατη λύση)","items":["Μην τα δέσεις ποτέ: δεμένα δεν μπορούν να ξεφύγουν από φωτιά ή νερό.","Άφησέ τα σε εσωτερικό δωμάτιο, με πολύ νερό και τροφή.","Γράψε στην πόρτα «ΖΩΑ ΜΕΣΑ», πόσα είναι και το τηλέφωνό σου, για τους διασώστες."]}],"sources":[{"label":"Ready.gov – Prepare your pets for disasters","url":"https://www.ready.gov/pets"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"zoa-kafsonas","title":"Ζώα σε καύσωνα","icon":"🌡️","lead":"Σκιά, φρέσκο νερό, βόλτα νωρίς το πρωί ή αργά το βράδυ. Ποτέ μέσα σε αυτοκίνητο.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τι κάνεις","items":["Πολλά μπολ με νερό σε σκιά, και ένα επιπλέον αν λείψεις.","Βόλτα μόνο νωρίς το πρωί ή μετά τη δύση. Ακούμπησε την άσφαλτο με την παλάμη σου για 5 δευτερόλεπτα: αν καίει εσένα, καίει και τις πατούσες του.","Ποτέ ζώο σε αυτοκίνητο, ούτε για λίγα λεπτά, ούτε με τα παράθυρα μισάνοιχτα."]},{"type":"warn","title":"Θερμοπληξία στα ζώα","items":["Έντονο λαχάνιασμα, σάλια, αδυναμία, ζάλη, εμετός.","Μετάφερέ το σε δροσιά, βρέξε το με χλιαρό (όχι παγωμένο) νερό και πήγαινέ το αμέσως σε κτηνίατρο."]}],"sources":[{"label":"Ready.gov – Pets and extreme heat","url":"https://www.ready.gov/pets"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"zoa-fovos","title":"Φόβος: σεισμός, κεραυνοί, πυροτεχνήματα","icon":"🫂","lead":"Τα φοβισμένα ζώα κρύβονται ή το σκάνε. Κράτα τα μέσα και κλείσε πόρτες και παράθυρα.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τι κάνεις","items":["Μετά από σεισμό κράτα τα μέσα ή με λουρί: φράχτες και πόρτες μπορεί να έχουν πάθει ζημιά.","Δώσε τους ένα ήσυχο, σκοτεινό μέρος να κρυφτούν.","Μίλα τους ήρεμα. Μην τα τιμωρείς και μην τα αναγκάζεις να βγουν.","Αν χαθεί κάποιο: ενημέρωσε τον δήμο και τους κοντινούς κτηνιάτρους και ανέβασε τη φωτογραφία του σε τοπικές ομάδες."]}],"sources":[{"label":"Ready.gov – Prepare your pets for disasters","url":"https://www.ready.gov/pets"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]}]</script><script>/*!
 * 72 Ώρες – Οδηγός Ετοιμότητας & Επιβίωσης
 * Δωρεάν οδηγός για όλους. Λειτουργεί offline μέσω service worker.
 */
(function () {
	'use strict';

	var CFG = window.SG_CONFIG || {};
	CFG.statsUrl = "";
	var root = document.getElementById('sg-app');
	if (!root) return;

	var LS_PREFIX = 'sg72:';
	var STANDALONE = !!CFG.standalone;

	/* ------------------------------------------------------------------ *
	 * Βοηθητικά
	 * ------------------------------------------------------------------ */

	function esc(s) {
		return String(s == null ? '' : s)
			.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
	}

	function load(key, fallback) {
		try {
			var raw = window.localStorage.getItem(LS_PREFIX + key);
			return raw ? JSON.parse(raw) : fallback;
		} catch (e) { return fallback; }
	}

	function save(key, value) {
		try { window.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); } catch (e) { /* noop */ }
	}

	function removeAll() {
		try {
			Object.keys(window.localStorage).forEach(function (k) {
				if (k.indexOf(LS_PREFIX) === 0) window.localStorage.removeItem(k);
			});
		} catch (e) { /* noop */ }
	}

	function fmt(n) {
		var r = Math.round(n * 10) / 10;
		try { return r.toLocaleString('el-GR'); } catch (e) { return String(r).replace('.', ','); }
	}

	/** Κανονικοποίηση για αναζήτηση: πεζά, χωρίς τόνους, ς → σ. */
	function norm(s) {
		return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ς/g, 'σ');
	}

	function $(sel, ctx) { return (ctx || root).querySelector(sel); }
	function $all(sel, ctx) { return Array.prototype.slice.call((ctx || root).querySelectorAll(sel)); }

	function telHref(n) { return 'tel:' + String(n).replace(/\s+/g, ''); }

	function daysUntil(dateStr) {
		if (!dateStr) return null;
		var d = new Date(dateStr + 'T00:00:00');
		if (isNaN(d.getTime())) return null;
		var today = new Date(); today.setHours(0, 0, 0, 0);
		return Math.round((d - today) / 86400000);
	}

	function toast(msg) {
		var t = document.createElement('div');
		t.className = 'sg-toast';
		t.setAttribute('role', 'status');
		t.textContent = msg;
		root.appendChild(t);
		setTimeout(function () { t.classList.add('sg-toast-out'); }, 2600);
		setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
	}

	/* ------------------------------------------------------------------ *
	 * Κατάσταση
	 * ------------------------------------------------------------------ */

	var S = {
		sections: {},
		order: [],
		prefs: load('prefs', { theme: 'light', big: false }),
		household: load('household', { adults: 2, children: 0, infants: 0, pets: 0, days: 3 }),
		kit: load('kit', { home: {}, bag: {} }),
		kitMode: load('kitMode', 'home'),
		campOn: load('campOn', false),
		plan: load('plan', { members: [] }),
		online: navigator.onLine,
		offlineReady: false,
		swState: 'checking',
		installEvt: null
	};

	function isInstalled() {
		return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
	}

	function isIOS() {
		var ua = navigator.userAgent || '';
		return /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	}

	/* ------------------------------------------------------------------ *
	 * Φόρτωση περιεχομένου
	 * ------------------------------------------------------------------ */

	function loadContent() {
		var urls = CFG.content || [];
		if (Array.isArray(window.SG_EMBEDDED_CONTENT) && window.SG_EMBEDDED_CONTENT.length) {
			return Promise.resolve(window.SG_EMBEDDED_CONTENT).then(function (list) {
				list.forEach(function (sec) { if (sec && sec.id) S.sections[sec.id] = sec; });
				S.order = list.filter(Boolean).sort(function (a,b) { return (a.order || 99) - (b.order || 99); }).map(function (s) { return s.id; });
				buildIndex();
			});
		}
		return Promise.all(urls.map(function (u) {
			return fetch(u, { credentials: 'same-origin' }).then(function (r) {
				if (!r.ok) throw new Error('HTTP ' + r.status);
				return r.json();
			});
		})).then(function (list) {
			list.forEach(function (sec) {
				if (sec && sec.id) S.sections[sec.id] = sec;
			});
			S.order = list.filter(Boolean).sort(function (a, b) { return (a.order || 99) - (b.order || 99); }).map(function (s) { return s.id; });
			buildIndex();
		});
	}

	function findCard(sid, cid) {
		var sec = S.sections[sid];
		if (!sec || !sec.cards) return null;
		for (var i = 0; i < sec.cards.length; i++) if (sec.cards[i].id === cid) return sec.cards[i];
		return null;
	}

	/* ------------------------------------------------------------------ *
	 * Αναζήτηση
	 * ------------------------------------------------------------------ */

	var INDEX = [];

	function cardText(card) {
		var parts = [card.title, card.lead];
		(card.blocks || []).forEach(function (b) {
			parts.push(b.title);
			(b.items || []).forEach(function (i) { parts.push(i); });
			if (b.text) parts.push(b.text);
		});
		return parts.filter(Boolean).join(' · ');
	}

	function buildIndex() {
		INDEX = [];
		S.order.forEach(function (sid) {
			var sec = S.sections[sid];
			(sec.cards || []).forEach(function (c) {
				var txt = cardText(c);
				INDEX.push({ sid: sid, cid: c.id, title: c.title, icon: c.icon, section: sec.title, text: txt, ntitle: norm(c.title), ntext: norm(txt) });
			});
			(sec.items || []).forEach(function (it) {
				var txt = it.name + ' · ' + (it.note || '');
				INDEX.push({ sid: sid, kit: true, cid: it.id, title: it.name, icon: '🎒', section: 'Κιτ 72 ωρών', text: txt, ntitle: norm(it.name), ntext: norm(txt) });
			});
		});
	}

	function search(q) {
		var terms = norm(q).split(/\s+/).filter(function (t) { return t.length > 1; });
		if (!terms.length) return [];
		var out = [];
		INDEX.forEach(function (e) {
			var score = 0;
			for (var i = 0; i < terms.length; i++) {
				var alts = expandTerm(terms[i]);
				var best = 0;
				for (var j = 0; j < alts.length; j++) {
					var t = alts[j], w = j === 0 ? 1 : 0.6;
					if (e.ntitle.indexOf(t) !== -1) best = Math.max(best, 5 * w);
					else if (e.ntext.indexOf(t) !== -1) best = Math.max(best, 1 * w);
				}
				if (!best) return;
				score += best;
			}
			out.push({ e: e, score: score });
		});
		out.sort(function (a, b) { return b.score - a.score; });
		return out.slice(0, 30).map(function (x) { return x.e; });
	}

	function snippet(e, q) {
		var t = norm(q).split(/\s+/).filter(function (x) { return x.length > 1; })[0] || '';
		var i = e.ntext.indexOf(t);
		if (i < 0) return e.text.slice(0, 140);
		var start = Math.max(0, i - 50);
		return (start > 0 ? '…' : '') + e.text.slice(start, start + 160) + '…';
	}

	/* ------------------------------------------------------------------ *
	 * Κιτ: υπολογισμοί
	 * ------------------------------------------------------------------ */

	function countFor(per) {
		var h = S.household;
		switch (per) {
			case 'person': return h.adults + h.children + h.infants;
			case 'adult': return Math.max(h.adults, 1);
			case 'child': return h.children;
			case 'infant': return h.infants;
			case 'pet': return h.pets;
			default: return 1;
		}
	}

	function kitItems(mode) {
		var sec = S.sections.kit;
		if (!sec) return [];
		return (sec.items || []).filter(function (it) {
			if (mode === 'camp') { if (it.only !== 'camp') return false; }
			else if (it.only === 'camp') return false;
			if (mode === 'bag' && !it.bag) return false;

		}).map(function (it) {

		var out = [];
		var sec = S.sections.kit;

		var names = {};
		(sec.items || []).forEach(function (it) { names[it.id] = it.name; });
		['home', 'bag'].forEach(function (mode) {
			var st = S.kit[mode] || {};
			Object.keys(st).forEach(function (id) {
				var d = daysUntil(st[id].exp);
				if (d !== null && d <= EXP_WARN && names[id]) out.push({ id: id, name: names[id], days: d, mode: mode });

	/* ------------------------------------------------------------------ *

	var ICON = {
		// πλοήγηση
		'nav-home': 'house', 'nav-em': 'siren', 'nav-kit': 'backpack', 'nav-plan': 'users', 'nav-tools': 'flashlight',
		// κίνδυνοι
		seismos: 'activity', pyrkagia: 'flame', plimmyra: 'waves', kafsonas: 'thermometer-sun', blackout: 'zap-off',
		ekkenosi: 'car', ximiko: 'biohazard', pyriniko: 'radiation', xionothyella: 'snowflake',
		// ενότητες
		epeigon: 'siren', kit: 'backpack', nero: 'droplets', trofi: 'soup', katafygio: 'tent', 'protes-voitheies': 'heart-pulse',
		energeia: 'radio', zoa: 'paw-print', psyxologia: 'brain', votana: 'leaf',
		// εργαλεία
		light: 'lightbulb', torch: 'flashlight', sos: 'life-buoy', strobe: 'zap', sound: 'megaphone', siren: 'siren',
		cpr: 'heart-pulse', location: 'map-pin', compass: 'compass', storm: 'cloud-lightning', chlorine: 'flask-conical', calc: 'calculator', search: 'search',
		// κατηγορίες κιτ
		'cat-nero': 'droplets', 'cat-trofima': 'soup', 'cat-fos': 'battery-charging', 'cat-ygeia': 'briefcase-medical', 'cat-ygieini': 'bath',
		'cat-eggrafa': 'file-text', 'cat-ergaleia': 'wrench', 'cat-paidia': 'baby', 'cat-diany': 'tent'
	};

	function ico(key, fallback) {
		var n = ICON[key];
		if (!n) return fallback ? esc(fallback) : '';
		return '<svg class="sg-i" aria-hidden="true" focusable="false"><use href="#i-' + n + '"/></svg>';
	}

	function mountSprite() {
		if (document.getElementById('sg-sprite')) return;
		var d = document.createElement('div');
		d.id = 'sg-sprite';
		d.style.display = 'none';
		d.innerHTML = SG_SPRITE;
		document.body.insertBefore(d, document.body.firstChild);
	}

	/* ------------------------------------------------------------------ *
	 * Ανώνυμα στατιστικά (χωρίς cookies, χωρίς προσωπικά δεδομένα)
	 * ------------------------------------------------------------------ */

	function track(e, k) {
		try {
			if (!CFG.statsUrl || !navigator.onLine || navigator.doNotTrack === '1' || !navigator.sendBeacon) return;
			var body = JSON.stringify({ e: e, k: k || '' });
			navigator.sendBeacon(CFG.statsUrl, new Blob([body], { type: 'text/plain' }));
		} catch (err) { /* noop */ }
	}

	function trackOpen() {
		var today = new Date().toISOString().slice(0, 10);
		if (load('lastOpen', '') === today) return;
		save('lastOpen', today);
		track(isInstalled() ? 'open_app' : 'open', '');
	}

	/* ------------------------------------------------------------------ *
	 * Εποχικό μήνυμα
	 * ------------------------------------------------------------------ */

	function season() {
		var m = new Date().getMonth() + 1;
		var y = new Date().getFullYear();
		if (m >= 6 && m <= 8) return { key: 'summer-' + y, icon: 'flame', title: 'Αντιπυρική περίοδος και καύσωνες', text: 'Δες τι κάνεις αν πλησιάσει φωτιά και πώς προστατεύεσαι στη ζέστη.', links: [['#/c/epeigon/pyrkagia', 'Δασική πυρκαγιά'], ['#/c/epeigon/kafsonas', 'Καύσωνας']] };
		if (m === 5 || m === 9) return { key: 'fire-' + m + '-' + y, icon: 'flame', title: 'Αντιπυρική περίοδος (Μάιος – Οκτώβριος)', text: 'Καθάρισε ξερά χόρτα γύρω από το σπίτι και μάθε τι κάνεις αν σου ζητηθεί να φύγεις.', links: [['#/c/epeigon/pyrkagia', 'Δασική πυρκαγιά'], ['#/c/epeigon/ekkenosi', 'Εκκένωση']] };
		if (m === 10 || m === 11) return { key: 'autumn-' + y, icon: 'cloud-lightning', title: 'Φθινοπωρινές καταιγίδες και πλημμύρες', text: 'Μην μπαίνεις σε δρόμο με νερό που τρέχει. Δες τι κάνεις πριν και κατά τη διάρκεια.', links: [['#/c/epeigon/plimmyra', 'Πλημμύρα'], ['#/tools/storm', 'Απόσταση καταιγίδας']] };
		if (m === 12 || m <= 2) return { key: 'winter-' + (m === 12 ? y : y - 1), icon: 'snowflake', title: 'Χειμώνας: κρύο, χιόνι και μονοξείδιο', text: 'Ποτέ μαγκάλι ή γεννήτρια σε κλειστό χώρο. Ζέστη χωρίς ρεύμα, με ασφάλεια.', links: [['#/c/energeia/monoxeidio', 'Μονοξείδιο'], ['#/c/katafygio/zesti', 'Ζέστη χωρίς ρεύμα']] };
		return null;
	}

	function seasonBanner() {
		var s = season();
		if (!s || S.prefs.seasonOff === s.key) return '';
		return '<section class="sg-season"><span class="sg-season-ico" aria-hidden="true"><svg class="sg-i"><use href="#i-' + s.icon + '"/></svg></span>' +
			'<div><strong>' + esc(s.title) + '</strong><p>' + esc(s.text) + '</p><div class="sg-season-links">' +
			s.links.map(function (l) { return '<a href="' + l[0] + '">' + esc(l[1]) + ' ›</a>'; }).join('') + '</div></div>' +
			'<button type="button" class="sg-icon-btn sg-season-x" data-act="season-off" data-key="' + esc(s.key) + '" aria-label="Απόκρυψη"><svg class="sg-i"><use href="#i-x"/></svg></button></section>';
	}

	/* ------------------------------------------------------------------ *
	 * Ξεκίνα σε 3 βήματα
	 * ------------------------------------------------------------------ */

	function onboarding() {
		if (S.prefs.onbHidden) return '';
		var steps = [
			{ done: isInstalled() || !!S.prefs.installDone, t: 'Βάλε τον οδηγό στην αρχική οθόνη', d: 'Ανοίγει με ένα πάτημα, και χωρίς internet.', act: 'install' },
			{ done: !!load('hhSet', false) || kitProgress('home').have > 0, t: 'Υπολόγισε τις ποσότητες για το σπίτι σου', d: 'Βάλε πόσοι είστε. Μένει μόνο στο κινητό σου.', href: '#/kit' },
			{ done: !!(S.plan.meetNear || S.plan.destA), t: 'Φτιάξτε το οικογενειακό σχέδιο', d: 'Σημείο συνάντησης και προορισμός. Θέλει 5 λεπτά.', href: '#/plan' }
		];
		var n = steps.filter(function (s) { return s.done; }).length;
		if (n === steps.length) return '';
		return '<section class="sg-onb" aria-label="Ξεκίνα σε 3 βήματα"><div class="sg-onb-head"><strong>Ξεκίνα σε 3 βήματα</strong><span>' + n + ' / 3</span>' +
			'<button type="button" class="sg-icon-btn" data-act="onb-hide" aria-label="Απόκρυψη"><svg class="sg-i"><use href="#i-x"/></svg></button></div><ol>' +
			steps.map(function (s, i) {
				var inner = '<span class="sg-onb-n">' + (s.done ? '<svg class="sg-i"><use href="#i-check"/></svg>' : (i + 1)) + '</span><span><b>' + esc(s.t) + '</b><small>' + esc(s.d) + '</small></span>';
				var cls = 'sg-onb-step' + (s.done ? ' is-done' : '');
				return '<li>' + (s.act ? '<button type="button" class="' + cls + '" data-act="' + s.act + '">' + inner + '</button>' : '<a class="' + cls + '" href="' + s.href + '">' + inner + '</a>') + '</li>';
			}).join('') + '</ol></section>';
	}

	/* ------------------------------------------------------------------ *
	 * Κοινοποίηση στην οικογένεια
	 * ------------------------------------------------------------------ */

	var SHARE_TEXT = '72 Ώρες: δωρεάν οδηγός ετοιμότητας που λειτουργεί και χωρίς internet. Κιτ 72 ωρών, οικογενειακό σχέδιο, οδηγίες για σεισμό, φωτιά, πλημμύρα και πρώτες βοήθειες.';

	function shareApp() {
		var url = CFG.pageUrl || location.href.split('#')[0];
		track('share', 'app');
		if (navigator.share) {
			navigator.share({ title: '72 Ώρες – Οδηγός Ετοιμότητας', text: SHARE_TEXT, url: url }).catch(function () { /* noop */ });
			return;
		}
		var msg = encodeURIComponent(SHARE_TEXT + ' ' + url);
		sheet('<h2>Στείλε το στην οικογένεια</h2><p class="sg-muted">Όσο περισσότεροι στην οικογένεια το έχουν, τόσο καλύτερα.</p>' +
			'<a class="sg-btn sg-btn-primary" href="https://wa.me/?text=' + msg + '" target="_blank" rel="noopener">WhatsApp</a>' +
			'<a class="sg-btn" href="viber://forward?text=' + msg + '">Viber</a>' +
			'<a class="sg-btn" href="mailto:?subject=' + encodeURIComponent('72 Ώρες – Οδηγός Ετοιμότητας') + '&body=' + msg + '">Email</a>' +
			'<button type="button" class="sg-btn" data-act="copy-link">Αντιγραφή συνδέσμου</button>', true);
	}

	function sharePanel() {
		return '<section class="sg-share"><div><strong>Στείλε το στην οικογένεια</strong><p>Σε κρίση χρειάζεται να ξέρουν όλοι τι κάνουν, όχι μόνο εσύ.</p></div>' +
			'<button type="button" class="sg-btn sg-btn-primary" data-act="share-app"><svg class="sg-i"><use href="#i-share-2"/></svg> Κοινοποίηση</button></section>';
	}

	/* ------------------------------------------------------------------ *
	 * Αντίγραφο ασφαλείας (εξαγωγή / εισαγωγή)
	 * ------------------------------------------------------------------ */

	var BACKUP_KEYS = ['prefs', 'household', 'kit', 'kitMode', 'campOn', 'plan', 'hhSet', 'chlorineL'];

	function backupText() {
		var data = { app: '72-ores', v: 1, date: new Date().toISOString(), data: {} };
		BACKUP_KEYS.forEach(function (k) { var v = load(k, null); if (v !== null) data.data[k] = v; });
		return JSON.stringify(data);
	}
	function backupName() { return '72-ores-antigrafo-' + ymd(new Date()) + '.txt'; }
	// Τα κινητά μοιράζονται αξιόπιστα μόνο αρχεία .txt (text/plain). Το .json απορρίπτεται από το Chrome Android.
	function backupFile() {
		try { return new File([backupText()], backupName(), { type: 'text/plain' }); } catch (e) { return null; }
	}
	function canShareBackup() {
		var f = backupFile();
		try { return !!(f && navigator.canShare && navigator.share && navigator.canShare({ files: [f] })); } catch (e) { return false; }
	}

	/** Ανοίγει το παράθυρο με τους τρεις τρόπους αποθήκευσης. */
	function exportData() {
		var share = canShareBackup();
		var ios = isIOS();
		var steps = share
			? (ios
				? '<li>Πάτα <strong>Αποστολή ή αποθήκευση</strong>.</li><li>Διάλεξε <strong>Αποθήκευση στα Αρχεία</strong> (ή στείλ’ το με Viber, email κ.λπ.).</li>'
				: '<li>Πάτα <strong>Αποστολή ή αποθήκευση</strong>.</li><li>Διάλεξε <strong>Drive</strong>, email ή Viber, ή στείλ’ το στον εαυτό σου.</li>')
			: '<li>Πάτα <strong>Λήψη αρχείου</strong>. Θα το βρεις στις <strong>Λήψεις</strong> (Downloads).</li>';
		sheet('<h2>Αποθήκευση αντιγράφου</h2>' +
			'<p class="sg-muted">Περιέχει το κιτ, το σχέδιο και τις ρυθμίσεις. Όχι κωδικούς ή άλλα προσωπικά δεδομένα.</p>' +
			'<ol class="sg-steps">' + steps + '<li>Για επαναφορά: <strong>Σχετικά → Αντίγραφο ασφαλείας → Επαναφορά</strong>.</li></ol>' +
			'<div class="sg-backup-actions">' +
				(share ? '<button type="button" class="sg-btn sg-btn-primary" data-act="backup-share"><svg class="sg-i"><use href="#i-share-2"/></svg> Αποστολή ή αποθήκευση</button>' : '') +
				(!share || !ios ? '<button type="button" class="sg-btn' + (share ? '' : ' sg-btn-primary') + '" data-act="backup-download"><svg class="sg-i"><use href="#i-download"/></svg> Λήψη αρχείου</button>' : '') +
				'<button type="button" class="sg-btn" data-act="backup-copy">Αντιγραφή ως κείμενο</button>' +
			'</div>' +
			'<p class="sg-muted sg-small">Αν τίποτα από τα παραπάνω δεν δουλεύει: «Αντιγραφή ως κείμενο» και επικόλλησέ το σε ένα μήνυμα στον εαυτό σου.</p>', true);
	}

	function backupShare() {
		var f = backupFile();
		if (!f) { backupDownload(); return; }
		navigator.share({ files: [f], title: 'Αντίγραφο 72 Ώρες' }).then(function () {
			track('backup', 'export');
			closeSheet();
			toast('Έτοιμο. Κράτα το αρχείο κάπου ασφαλές.');
		}).catch(function (e) {
			if (e && e.name === 'AbortError') return; // ο χρήστης έκλεισε το παράθυρο
			backupDownload();
		});
	}

	function backupDownload() {
		var blob = new Blob([backupText()], { type: 'text/plain' });
		var url = URL.createObjectURL(blob);
		var a = document.createElement('a');
		a.href = url; a.download = backupName(); a.rel = 'noopener';
		a.style.display = 'none';
		document.body.appendChild(a); a.click(); document.body.removeChild(a);
		setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
		track('backup', 'export');
		closeSheet();
		toast('Το αρχείο ' + backupName() + ' είναι στις Λήψεις.');
	}

	function copyText(text, okMsg) {
		function fallback() {
			var ta = document.createElement('textarea');
			ta.value = text; ta.setAttribute('readonly', '');
			ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '-9999px';
			document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
			var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
			document.body.removeChild(ta);
			toast(ok ? okMsg : 'Δεν έγινε αντιγραφή. Δοκίμασε «Λήψη αρχείου».');
			return ok;
		}
		if (navigator.clipboard && window.isSecureContext) {
			navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
		} else fallback();
	}

	function backupCopy() {
		copyText(backupText(), 'Αντιγράφηκε. Επικόλλησέ το σε ένα μήνυμα στον εαυτό σου.');
		track('backup', 'export');
		closeSheet();
	}

	var pendingImport = null;

	/** Δέχεται το κείμενο του αντιγράφου, ακόμη κι αν έχει γύρω του άλλο κείμενο (π.χ. από Viber). */
	function parseBackup(text) {
		text = String(text || '');
		var a = text.indexOf('{'), b = text.lastIndexOf('}');
		if (a < 0 || b <= a) return null;
		try {
			var obj = JSON.parse(text.slice(a, b + 1));
			return (obj && obj.app === '72-ores' && obj.data) ? obj : null;
		} catch (e) { return null; }
	}

	function askImport(obj) {
		if (!obj) { toast('Αυτό δεν είναι αντίγραφο του «72 Ώρες».'); return; }
		pendingImport = obj;
		var when = obj.date ? dmy(new Date(obj.date)) : '';
		sheet('<h2>Επαναφορά αντιγράφου</h2>' +
			'<p>Αντίγραφο' + (when ? ' της <strong>' + esc(when) + '</strong>' : '') + '. Θα αντικαταστήσει το κιτ, το σχέδιο και τις ρυθμίσεις αυτής της συσκευής.</p>' +
			'<div class="sg-backup-actions"><button type="button" class="sg-btn sg-btn-primary" data-act="import-confirm">Επαναφορά</button></div>', true);
	}

	function applyImport() {
		var obj = pendingImport; pendingImport = null;
		if (!obj) return;
		BACKUP_KEYS.forEach(function (k) { if (k in obj.data) save(k, obj.data[k]); });
		S.prefs = load('prefs', S.prefs);
		S.household = load('household', S.household);
		S.kit = load('kit', { home: {}, bag: {} });
		S.kitMode = load('kitMode', 'home');
		S.campOn = load('campOn', false);
		S.plan = load('plan', { members: [] });
		track('backup', 'import');
		closeSheet();
		applyPrefs();
		rerender();
		toast('Τα δεδομένα επαναφέρθηκαν.');
	}

	function importData(file) {
		var reader = new FileReader();
		reader.onload = function () { askImport(parseBackup(reader.result)); };
		reader.onerror = function () { toast('Δεν άνοιξε το αρχείο. Δοκίμασε «Επικόλληση κειμένου».'); };
		reader.readAsText(file);
	}
