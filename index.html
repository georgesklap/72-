	function planScore() {
		var p = S.plan;
		var keys = ['meetNear', 'meetFar', 'destA', 'destB', 'trigger', 'contactName', 'contactPhone', 'switchPower', 'switchWater', 'switchGas'];
		var done = keys.filter(function (k) { return p[k] && String(p[k]).trim(); }).length;
		var members = (p.members || []).filter(function (m) { return m.name || m.phone; }).length ? 1 : 0;
		var checks = p.checks || {};
		var cdone = PLAN_CHECKS.filter(function (c) { return checks[c.k]; }).length;
		return Math.round((done + members + cdone) * 100 / (keys.length + 1 + PLAN_CHECKS.length));
	}

	function readiness() {
		var home = kitProgress('home').pct;
		var bag = kitProgress('bag').pct;
		var plan = planScore();
		var parts = [home, bag, plan];
		var camp = null;
		if (S.campOn) { camp = kitProgress('camp').pct; parts.push(camp); }
		var sum = parts.reduce(function (a, b) { return a + b; }, 0);
		return { home: home, bag: bag, plan: plan, camp: camp, total: Math.round(sum / parts.length) };
	}

	function inAppName() {
		var ua = navigator.userAgent || '';

		if (/FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(ua)) return 'Facebook';
		if (/BytedanceWebview|TikTok|musical_ly/i.test(ua)) return 'TikTok';
		if (/LinkedInApp/i.test(ua)) return 'LinkedIn';
		if (/Snapchat/i.test(ua)) return 'Snapchat';

		return '';

	}
	function chromeIntentUrl() {
		var u = cleanUrl();

	}
	function openExternal() {
		track('tool', 'open-browser');
		if (isAndroid()) {
			location.href = chromeIntentUrl();
			// Αν δεν υπάρχει Chrome, δοκίμασε τον προεπιλεγμένο browser.
			setTimeout(function () {
				if (!document.hidden) location.href = 'intent:' + cleanUrl() + '#Intent;end';
			}, 1600);

			location.href = 'x-safari-' + cleanUrl();

	/* --- Πυξίδα --- */
	var DIRS = ['Β', 'ΒΑ', 'Α', 'ΝΑ', 'Ν', 'ΝΔ', 'Δ', 'ΒΔ'];
	function startCompass() {
		function begin() {
			var got = false;
			function onOri(e) {
				var h = null;
				if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
				else if ((e.absolute || e.type === 'deviceorientationabsolute') && typeof e.alpha === 'number') h = 360 - e.alpha;
				if (h === null || isNaN(h)) return;
				got = true;
				h = (h + 360) % 360;
				var dial = $('#sg-dial'), read = $('#sg-heading');
				if (dial) dial.style.transform = 'rotate(' + (-h) + 'deg)';
				if (read) read.textContent = Math.round(h) + '° ' + DIRS[Math.round(h / 45) % 8];
			}
			var evt = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
			window.addEventListener(evt, onOri, true);
			TOOL.cleanups.push(function () { window.removeEventListener(evt, onOri, true); });
			TOOL.timer = setTimeout(function () {
				if (!got) { var r = $('#sg-heading'); if (r) r.textContent = 'Η συσκευή ή ο browser δεν δίνει στοιχεία πυξίδας.'; }
			}, 3000);
		}
		if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
			DeviceOrientationEvent.requestPermission().then(function (st) {
				if (st === 'granted') begin(); else toast('Χρειάζεται άδεια για τους αισθητήρες κίνησης.');
			}).catch(function () { toast('Χρειάζεται άδεια για τους αισθητήρες κίνησης.'); });
		} else if (window.DeviceOrientationEvent) {
			begin();
		} else {
			var r = $('#sg-heading'); if (r) r.textContent = 'Η συσκευή δεν υποστηρίζει πυξίδα.';
		}
	}

	/* --- Καταιγίδα --- */
	function stormClick(btn) {
		var timeEl = $('#sg-storm-time'), out = $('#sg-storm-out');
		if (!TOOL.stormStart) {

			btn.textContent = '🔊 Άκουσα βροντή';
			if (out) out.innerHTML = '';

				if (!TOOL.stormStart) return;
				var s = (Date.now() - TOOL.stormStart) / 1000;

				TOOL.timer = setTimeout(tick, 100);

			clearTimeout(TOOL.timer);
			btn.textContent = '⚡ Είδα αστραπή';
			var km = sec * 0.343;

				(danger ? 'Πολύ κοντά. Μπες τώρα σε κτίριο ή κλειστό αυτοκίνητο.' : 'Ακόμη μακριά, αλλά μπορεί να πλησιάσει γρήγορα. Ετοιμάσου να μπεις μέσα.') + '</span></div>';

	/* --- Χλωρίνη --- */
	function chlorineCalc() {
		var inp = $('[data-chl="l"]'), out = $('#sg-chl-out');
		if (!inp || !out) return;
		var l = parseFloat(String(inp.value).replace(',', '.'));
		save('chlorineL', inp.value);
		if (!(l > 0)) { out.innerHTML = ''; return; }
		var per = TOOL.chlMode === 'cloudy' ? 4 : 2;
		var drops = Math.ceil(l * per);
		var ml = drops / 20;
		out.innerHTML = '<div class="sg-result is-info"><strong>' + drops + ' σταγόνες</strong><span>' +
			(ml >= 1 ? 'περίπου ' + fmt(ml) + ' ml (1 ml ≈ 20 σταγόνες) · ' : '') + per + ' σταγόνες ανά λίτρο · ΜΟΝΟ για απλή μη αρωματισμένη χλωρίνη 5–9% χωρίς πρόσθετα · αναμονή ≥30 λεπτά. Όχι για χημική μόλυνση.</span></div>';

	/* --- Σειρήνα & ΚΑΡΠΑ --- */
	function audioCtx() {

		if (!Ctx) return null;

		TOOL.audio = ctx;

	function startSiren() {
		var ctx = audioCtx();
		if (!ctx) { toast('Ο ήχος δεν υποστηρίζεται σε αυτόν τον browser.'); return; }
		var osc = ctx.createOscillator(), gain = ctx.createGain();
		osc.type = 'sawtooth'; gain.gain.value = 0.55;
		osc.connect(gain); gain.connect(ctx.destination); osc.start();
		var set = overlay('Σειρήνα');
		TOOL.overlay.classList.add('sg-overlay-siren');
		var up = true;
		(function sweep() {
			var t = ctx.currentTime;
			osc.frequency.cancelScheduledValues(t);
			osc.frequency.setValueAtTime(up ? 650 : 1500, t);
			osc.frequency.linearRampToValueAtTime(up ? 1500 : 650, t + 0.6);
			set(up);
			up = !up;
			TOOL.timer = setTimeout(sweep, 600);
		})();
	}

	function startCpr() {
		var ctx = audioCtx();
		var o = document.createElement('div');
		o.className = 'sg-overlay sg-overlay-cpr';
		o.innerHTML = '<div class="sg-cpr-top"><strong>Κάλεσε 166</strong><span>Πίεσε δυνατά στο κέντρο του στήθους, βάθος 5–6 εκ.</span></div>' +

			'<div class="sg-cpr-hint" id="sg-cpr-hint">Συνεχείς συμπιέσεις. Αν έχεις εκπαιδευτεί: 2 εμφυσήσεις κάθε 30.</div>' +
			'<button type="button" class="sg-overlay-stop">✕ Τέλος</button>';
		root.appendChild(o);
		o.querySelector('.sg-overlay-stop').addEventListener('click', stopTool);
		TOOL.overlay = o;
		keepAwake();
		var n = 0;
		var beatEl = o.querySelector('#sg-cpr-beat'), nEl = o.querySelector('#sg-cpr-n');
		function click(accent) {
			if (!ctx) return;
			var osc = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
			osc.frequency.value = accent ? 1600 : 1000;
			g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
			osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t + 0.09);

			n = n % 30 + 1;
			nEl.textContent = n;
			beatEl.classList.remove('is-hit'); void beatEl.offsetWidth; beatEl.classList.add('is-hit');
			click(n === 30);

		})();
	}

	/* ------------------------------------------------------------------ *
	 * Εργαλεία φωτός & ήχου
	 * ------------------------------------------------------------------ */

	var TOOL = { timer: null, torchTrack: null, audio: null, wake: null, overlay: null, cleanups: [], stormStart: null, chlMode: 'clear' };

	// Μονάδα Morse 250ms: τελεία 1, παύλα 3, κενό 1, μεταξύ γραμμάτων 3, μεταξύ λέξεων 7.
	function sosPattern() {
		var u = 250;
		var seq = [];
		function sym(len) { seq.push([true, len * u]); seq.push([false, u]); }
		[1, 1, 1].forEach(sym); seq[seq.length - 1][1] = 3 * u;
		[3, 3, 3].forEach(sym); seq[seq.length - 1][1] = 3 * u;
		[1, 1, 1].forEach(sym); seq[seq.length - 1][1] = 7 * u;
		return seq;
	}

	function runPattern(seq, setOn) {
		var i = 0;
		function tick() {
			var step = seq[i % seq.length];
			setOn(step[0]);
			i++;
			TOOL.timer = setTimeout(tick, step[1]);
		}
		tick();
	}

	function getTorch() {
		if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error('no-media'));
		return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } }).then(function (stream) {
			var track = stream.getVideoTracks()[0];
			var caps = track.getCapabilities ? track.getCapabilities() : {};
			if (!caps.torch) {
				track.stop();
				throw new Error('no-torch');
			}
			TOOL.torchTrack = track;
			return function (on) {
				track.applyConstraints({ advanced: [{ torch: !!on }] }).catch(function () { /* noop */ });
			};
		});
	}

	function beepSetter() {
		var Ctx = window.AudioContext || window.webkitAudioContext;
		if (!Ctx) return null;
		var ctx = new Ctx();
		var osc = ctx.createOscillator();
		var gain = ctx.createGain();
		osc.type = 'square';
		osc.frequency.value = 2800;
		gain.gain.value = 0;
		osc.connect(gain); gain.connect(ctx.destination);
		osc.start();
		TOOL.audio = ctx;
		return function (on) { gain.gain.setTargetAtTime(on ? 0.6 : 0, ctx.currentTime, 0.005); };
	}

	function keepAwake() {
		if ('wakeLock' in navigator) {
			navigator.wakeLock.request('screen').then(function (w) { TOOL.wake = w; }).catch(function () { /* noop */ });
		}
	}

	function stopTool() {
		clearTimeout(TOOL.timer);
		TOOL.timer = null;
		if (TOOL.torchTrack) { try { TOOL.torchTrack.stop(); } catch (e) { /* noop */ } TOOL.torchTrack = null; }
		if (TOOL.audio) { try { TOOL.audio.close(); } catch (e) { /* noop */ } TOOL.audio = null; }
		if (TOOL.wake) { try { TOOL.wake.release(); } catch (e) { /* noop */ } TOOL.wake = null; }
		TOOL.cleanups.forEach(function (f) { try { f(); } catch (e) { /* noop */ } });
		TOOL.cleanups = [];
		TOOL.stormStart = null;
		if (TOOL.overlay && TOOL.overlay.parentNode) TOOL.overlay.parentNode.removeChild(TOOL.overlay);
		TOOL.overlay = null;
		if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () { /* noop */ });
	}

	function overlay(label) {
		var o = document.createElement('div');
		o.className = 'sg-overlay';
		o.innerHTML = '<div class="sg-overlay-label">' + esc(label) + '</div><button type="button" class="sg-overlay-stop">✕ Τέλος</button>';
		root.appendChild(o);
		o.querySelector('.sg-overlay-stop').addEventListener('click', stopTool);
		TOOL.overlay = o;
		keepAwake();
		if (o.requestFullscreen) o.requestFullscreen().catch(function () { /* noop */ });
		return function (on) { o.classList.toggle('is-on', !!on); };
	}

	function startTool(id) {
		stopTool();
		if (id === 'light') {
			overlay('Φακός οθόνης')(true);
		} else if (id === 'strobe') {
			var set = overlay('Αναλαμπές');
			runPattern([[true, 120], [false, 380]], set);
		} else if (id === 'sos') {
			getTorch().then(function (torch) {
				var screen = overlay('SOS · φλας και οθόνη');
				runPattern(sosPattern(), function (on) { torch(on); screen(on); });
			}).catch(function () {
				runPattern(sosPattern(), overlay('SOS · · · — — — · · ·'));
			});
		} else if (id === 'torch') {
			getTorch().then(function (torch) {
				torch(true);
				var o = overlay('Φακός κάμερας αναμμένος');
				o(false);
				TOOL.overlay.classList.add('sg-overlay-dark');
			}).catch(function (e) {
				toast(e && e.message === 'no-torch'
					? 'Ο browser δεν επιτρέπει το φλας σε αυτή τη συσκευή. Χρησιμοποίησε τον φακό οθόνης ή τον φακό του κινητού.'
					: 'Χρειάζεται άδεια κάμερας για το φλας. Χρησιμοποίησε τον φακό οθόνης.');
			});
		} else if (id === 'siren') {
			startSiren();
		} else if (id === 'cpr') {
			startCpr();
		} else if (id === 'sound') {
			var beep = beepSetter();
			if (!beep) { toast('Ο ήχος δεν υποστηρίζεται σε αυτόν τον browser.'); return; }
			var vis = overlay('Ηχητικό SOS');
			runPattern(sosPattern(), function (on) { beep(on); vis(on); });
		}
	}

	/* ------------------------------------------------------------------ *
	 * Router
	 * ------------------------------------------------------------------ */

	function route() {
		stopTool();
		var hash = location.hash || '#/';
		var parts = hash.replace(/^#\/?/, '').split('?');
		var path = parts[0].split('/').filter(Boolean).map(decodeURIComponent);
		var query = {};
		(parts[1] || '').split('&').forEach(function (kv) {
			if (!kv) return;
			var p = kv.split('=');
			query[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
		});

		var html;
		switch (path[0]) {
			case undefined: html = viewHome(); break;
			case 's': html = viewSection(path[1]); break;
			case 'c': html = viewCard(path[1], path[2]); break;
			case 'kit': html = viewKit(); break;
			case 'plan': html = viewPlan(); break;
			case 'tools': html = path[1] ? viewToolPage(path[1]) : viewTools(); break;
			case 'search': html = viewSearch(query.q || ''); break;
			case 'about': html = viewAbout(); break;
			case 'print': html = viewPrint(path[1] || 'all'); break;
			default: html = viewNotFound();
		}
		if (!html) return;
		root.innerHTML = html;
		applyPrefs();
		if (path[0] === 'c') track('card', path[1] + '/' + path[2]);
		else if (path[0] === 'tools' && path[1]) track('tool', path[1]);
		var anchor = (location.hash.split('#')[2] || '');

		closeSheet();
		if (path[0] === 'tools' && path[1] === 'chlorine') { TOOL.chlMode = 'clear'; chlorineCalc(); }
		if (path[0] === 'search') {
			var inp = $('input[type=search]');
			if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
		} else if (anchor && document.getElementById(anchor)) {
			document.getElementById(anchor).scrollIntoView();
		} else if (STANDALONE) {
			window.scrollTo(0, 0);
		} else {
			var top = root.getBoundingClientRect().top + window.pageYOffset - 12;
			if (window.pageYOffset > top) window.scrollTo(0, top);
		}
	}

	function rerender() {
		var y = window.pageYOffset;
		route();
		window.scrollTo(0, y);
	}

	function refreshStatus() {
		var el = $('.sg-status');
		if (el) el.innerHTML = statusPill();
	}

	/* ------------------------------------------------------------------ *
	 * Events
	 * ------------------------------------------------------------------ */

	root.addEventListener('click', function (e) {
		var km = e.target.closest('[data-kitmode-link]');
		if (km) { S.kitMode = km.getAttribute('data-kitmode-link'); save('kitMode', S.kitMode); }
		var t = e.target.closest('[data-act],[data-step],[data-days],[data-kitmode],[data-tool],[data-member-del],[data-chl-mode]');
		if (!t || !root.contains(t)) return;

		if (t.hasAttribute('data-step')) {
			var k = t.getAttribute('data-step');
			var lim = { adults: [1, 30], children: [0, 30], infants: [0, 10], pets: [0, 50] }[k];
			S.household[k] = Math.min(lim[1], Math.max(lim[0], S.household[k] + parseInt(t.getAttribute('data-d'), 10)));
			save('household', S.household);
			save('hhSet', true);
			rerender();
			return;
		}
		if (t.hasAttribute('data-days')) {
			S.household.days = parseInt(t.getAttribute('data-days'), 10);
			save('household', S.household);
			rerender();
			return;
		}
		if (t.hasAttribute('data-kitmode')) {
			S.kitMode = t.getAttribute('data-kitmode');
			save('kitMode', S.kitMode);
			rerender();
			return;
		}
		if (t.hasAttribute('data-chl-mode')) {
			TOOL.chlMode = t.getAttribute('data-chl-mode');
			$all('[data-chl-mode]').forEach(function (b) { b.classList.toggle('is-on', b === t); });
			chlorineCalc();
			return;
		}
		if (t.hasAttribute('data-tool')) {
			startTool(t.getAttribute('data-tool'));
			return;
		}
		if (t.hasAttribute('data-member-del')) {
			S.plan.members.splice(parseInt(t.getAttribute('data-member-del'), 10), 1);
			save('plan', S.plan);
			rerender();
			return;
		}

		switch (t.getAttribute('data-act')) {
			case 'theme':
				S.prefs.theme = S.prefs.theme === 'dark' ? 'light' : 'dark';
				save('prefs', S.prefs);
				rerender();
				break;
			case 'open-external':
				openExternal();
				break;
			case 'install':
				if (inAppName() && !STANDALONE) { openExternal(); break; }
				if (S.installEvt) {
					S.installEvt.prompt();
					S.installEvt.userChoice.finally(function () { S.installEvt = null; rerender(); });
				} else {
					sheet(installHelpHtml());
				}
				break;
			case 'sheet-close':
				closeSheet();
				break;
			case 'season-off':
				S.prefs.seasonOff = t.getAttribute('data-key');
				save('prefs', S.prefs);
				rerender();
				break;
			case 'onb-hide':
				S.prefs.onbHidden = true;
				save('prefs', S.prefs);
				rerender();
				break;
			case 'share-app':
				shareApp();
				break;
			case 'export':
				exportData();
				break;
			case 'backup-share': backupShare(); break;
			case 'backup-download': backupDownload(); break;
			case 'backup-copy': backupCopy(); break;
			case 'paste-open': pasteSheet(); break;
			case 'paste-import':
				var pta = root.querySelector('[data-paste]');
				askImport(parseBackup(pta ? pta.value : ''));
				break;
			case 'import-confirm': applyImport(); break;
			case 'remind':
				var rev = expiryEvent(t.getAttribute('data-id'), t.getAttribute('data-mode'));
				if (rev) remindSheet(rev, '72-ores-' + t.getAttribute('data-id') + '.ics');
				break;
			case 'ics-pending':
				if (S.pendingIcs) { downloadIcs(S.pendingIcs.filename, icsCalendar([S.pendingIcs.ev])); track('ics', 'one'); }
				closeSheet();
				break;
			case 'ics-all':
				var evs = allExpiries();
				if (!evs.length) { toast('Δεν έχεις βάλει ακόμη ημερομηνίες λήξης.'); break; }
				downloadIcs('72-ores-ligeis.ics', icsCalendar(evs));
				track('ics', 'all');
				toast(evs.length + (evs.length === 1 ? ' υπενθύμιση' : ' υπενθυμίσεις') + ' για το ημερολόγιό σου.');
				break;
			case 'drill-remind':
				var dd = new Date(); dd.setHours(0, 0, 0, 0); dd.setMonth(dd.getMonth() + 6);
				remindSheet({ uid: 'drill-' + ymd(dd), date: dd, title: '72 Ώρες: Πρόβα οικογενειακού σχεδίου',
					desc: 'Κάντε μαζί πρόβα του οικογενειακού σχεδίου: σημείο συνάντησης, προορισμός, ποιος παίρνει ποιον. Ελέγξτε και το κιτ: λήξεις, μπαταρίες, power bank, ρούχα εποχής.' }, '72-ores-prova.ics');
				break;
			case 'copy-link':
				copyText(cleanUrl(), 'Ο σύνδεσμος αντιγράφηκε.');
				break;
			case 'locate':
				locate();
				break;
			case 'loc-copy':
				if (S.lastLoc && navigator.clipboard) navigator.clipboard.writeText(S.lastLoc).then(function () { toast('Αντιγράφηκε.'); });
				break;
			case 'loc-share':
				if (S.lastLoc && navigator.share) navigator.share({ text: S.lastLoc }).catch(function () { /* noop */ });
				break;
			case 'compass':
				startCompass();
				t.style.display = 'none';
				break;
			case 'storm':
				stormClick(t);
				break;
			case 'kit-reset':
				if (window.confirm('Να μηδενιστεί η λίστα του κιτ;')) {
					S.kit[S.kitMode] = {};
					save('kit', S.kit);
					rerender();
				}
				break;
			case 'member-add':
				S.plan.members = S.plan.members || [];
				S.plan.members.push({ name: '', phone: '' });
				save('plan', S.plan);
				rerender();
				var ins = $all('[data-member][data-mk="name"]');
				if (ins.length) ins[ins.length - 1].focus();
				break;
			case 'plan-share':
				var txt = planText();
				if (navigator.share) {
					navigator.share({ title: 'Οικογενειακό σχέδιο', text: txt }).catch(function () { /* noop */ });
				} else if (navigator.clipboard) {
					navigator.clipboard.writeText(txt).then(function () { toast('Αντιγράφηκε. Επικόλλησέ το σε μήνυμα.'); });
				}
				break;
			case 'plan-reset':
				if (window.confirm('Να διαγραφεί το οικογενειακό σχέδιο από αυτή τη συσκευή;')) {
					S.plan = { members: [] };
					save('plan', S.plan);
					rerender();
				}
				break;
			case 'print':
				preparePrint();
				window.print();
				break;
			case 'wipe':
				if (window.confirm('Να διαγραφούν κιτ, σχέδιο και ρυθμίσεις από αυτή τη συσκευή; Ο οδηγός θα παραμείνει διαθέσιμος offline.')) {
					removeAll();
					S.kit = { home: {}, bag: {} };
					S.plan = { members: [] };
					S.prefs = { theme: 'light', big: false };
					S.household = { adults: 2, children: 0, infants: 0, pets: 0, days: 3 };
					rerender();
					toast('Τα δεδομένα διαγράφηκαν.');
				}
				break;
		}
	});

	root.addEventListener('change', function (e) {
		var t = e.target;
		if (t.hasAttribute('data-kit')) {
			var id = t.getAttribute('data-kit');
			var m = S.kitMode;
			S.kit[m] = S.kit[m] || {};
			S.kit[m][id] = S.kit[m][id] || {};
			S.kit[m][id].have = t.checked;
			save('kit', S.kit);
			rerender();
		} else if (t.hasAttribute('data-exp')) {
			var eid = t.getAttribute('data-exp');
			S.kit[S.kitMode][eid] = S.kit[S.kitMode][eid] || { have: true };
			S.kit[S.kitMode][eid].exp = t.value;
			save('kit', S.kit);
			rerender();
		} else if (t.hasAttribute('data-plancheck')) {
			S.plan.checks = S.plan.checks || {};
			S.plan.checks[t.getAttribute('data-plancheck')] = t.checked;
			save('plan', S.plan);
			var li = t.closest('li'); if (li) li.classList.toggle('is-done', t.checked);
		} else if (t.hasAttribute('data-missing')) {
			S.prefs.kitMissing = t.checked;
			save('prefs', S.prefs);
			rerender();
		} else if (t.hasAttribute('data-import')) {
			if (t.files && t.files[0]) importData(t.files[0]);
			t.value = '';
		} else if (t.hasAttribute('data-campon')) {
			S.campOn = t.checked;
			save('campOn', S.campOn);
		} else if (t.hasAttribute('data-hh')) {
			var hk = t.getAttribute('data-hh');
			var hl = { adults: [1, 30], children: [0, 30], infants: [0, 10], pets: [0, 50] }[hk];
			var hv = parseInt(t.value, 10);
			S.household[hk] = Math.min(hl[1], Math.max(hl[0], isNaN(hv) ? hl[0] : hv));
			save('household', S.household);
			save('hhSet', true);
			rerender();
		} else if (t.hasAttribute('data-pref')) {
			var pk = t.getAttribute('data-pref');
			if (pk === 'big') S.prefs.big = t.checked;
			if (pk === 'dark') S.prefs.theme = t.checked ? 'dark' : 'light';
			save('prefs', S.prefs);
			applyPrefs();
		}
	});

	root.addEventListener('input', function (e) {
		var t = e.target;
		if (t.hasAttribute('data-plan')) {
			S.plan[t.getAttribute('data-plan')] = t.value;
			save('plan', S.plan);
		} else if (t.hasAttribute('data-member')) {
			var i = parseInt(t.getAttribute('data-member'), 10);
			S.plan.members[i][t.getAttribute('data-mk')] = t.value;
			save('plan', S.plan);
		} else if (t.hasAttribute('data-chl')) {
			chlorineCalc();
		} else if (t.type === 'search') {
			var q = t.value;
			var box = $('.sg-results');
			if (box) box.innerHTML = resultsHtml(search(q), q);
			try { history.replaceState(null, '', '#/search' + (q ? '?q=' + encodeURIComponent(q) : '')); } catch (err) { /* noop */ }
		}
	});

	root.addEventListener('toggle', function (e) {
		var d = e.target;
		if (!d || !d.hasAttribute || !d.hasAttribute('data-cat')) return;
		S.prefs.kitClosed = S.prefs.kitClosed || {};
		if (d.open) delete S.prefs.kitClosed[d.getAttribute('data-cat')];
		else S.prefs.kitClosed[d.getAttribute('data-cat')] = true;
		save('prefs', S.prefs);
	}, true);

	root.addEventListener('submit', function (e) {
		e.preventDefault();
		var inp = e.target.querySelector('input[type=search]');
		if (inp) inp.blur();
	});

	document.addEventListener('keydown', function (e) {
		if (e.key === 'Escape') { if (TOOL.overlay) stopTool(); closeSheet(); }
	});

	window.addEventListener('hashchange', route);
	window.addEventListener('online', function () { S.online = true; refreshStatus(); });
	window.addEventListener('offline', function () { S.online = false; refreshStatus(); });

	// Android μέσα σε Facebook/Instagram: μία αυτόματη προσπάθεια ανά επίσκεψη να ανοίξει στο Chrome.
	if (inAppName() && isAndroid() && !STANDALONE) {
		try {
			if (!sessionStorage.getItem('sg72:esc')) {
				sessionStorage.setItem('sg72:esc', '1');
				setTimeout(function () { track('tool', 'open-browser-auto'); location.href = chromeIntentUrl(); }, 700);
			}
		} catch (e) { /* noop */ }
	}

	// Καθαρισμός από την v0.6.0–0.6.1 (καιρός, αφαιρέθηκε).
	try { localStorage.removeItem(LS_PREFIX + 'wx'); if (S.prefs.wxOff !== undefined) { delete S.prefs.wxOff; save('prefs', S.prefs); } } catch (e) { /* noop */ }

	window.addEventListener('beforeinstallprompt', function (e) {
		e.preventDefault();
		S.installEvt = e;
		var r = location.hash.replace(/^#\/?/, '');
		if (r === '' || r === 'about') rerender();
	});
	window.addEventListener('appinstalled', function () {
		S.installEvt = null;
		S.prefs.installDone = true;
		save('prefs', S.prefs);
		track('install', '');
		toast('Εγκαταστάθηκε! Θα το βρεις στην αρχική οθόνη.');
	});

	/* ------------------------------------------------------------------ *
	 * Service worker
	 * ------------------------------------------------------------------ */

	function askStatus(reg) {
		var sw = (reg && reg.active) || navigator.serviceWorker.controller;
		if (!sw || typeof MessageChannel === 'undefined') return;
		var ch = new MessageChannel();
		ch.port1.onmessage = function (ev) {
			var ready = !!(ev.data && ev.data.ready);
			if (ready !== S.offlineReady) {
				S.offlineReady = ready;
				S.swState = ready ? 'ready' : 'caching';
				refreshStatus();
			}
			if (!ready) setTimeout(function () { askStatus(reg); }, 2500);
		};
		sw.postMessage({ type: 'status' }, [ch.port2]);
	}

	function cacheThemeAssets(reg) {
		if (STANDALONE || !window.performance || !performance.getEntriesByType) return;
		var sw = (reg && reg.active) || navigator.serviceWorker.controller;
		if (!sw) return;
		var urls = [location.href.split('#')[0]];
		performance.getEntriesByType('resource').forEach(function (r) {
			if (/\.(css|js|woff2?|ttf|svg|png|jpe?g|webp|gif)(\?|$)/i.test(r.name)) urls.push(r.name);
		});
		sw.postMessage({ type: 'cache-urls', urls: urls });
	}

	function registerSW() {
		var secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
		if (!('serviceWorker' in navigator) || !secure || !CFG.swUrl || !CFG.pageUrl) {
			S.swState = 'unsupported';
			refreshStatus();
			return;
		}
		var hadController = !!navigator.serviceWorker.controller;
		navigator.serviceWorker.register(CFG.swUrl, { scope: CFG.scope || '/' }).then(function (reg) {
			return navigator.serviceWorker.ready.then(function (r) {
				askStatus(r);
				cacheThemeAssets(r);
				if (navigator.storage && navigator.storage.persist) {
					navigator.storage.persist().catch(function () { /* noop */ });
				}
				return reg;
			});
		}).catch(function () {
			S.swState = 'unsupported';
			refreshStatus();
		});
		navigator.serviceWorker.addEventListener('controllerchange', function () {
			if (hadController) toast('Ο οδηγός ενημερώθηκε στη νέα έκδοση.');
			askStatus(null);
		});
	}

	/* ------------------------------------------------------------------ *
	 * Εκκίνηση
	 * ------------------------------------------------------------------ */

	mountSprite();
	applyPrefs();
	loadContent().then(function () {
		route();
		trackOpen();
		registerSW();
	}).catch(function () {
		root.innerHTML = '<div class="sg-fatal"><h1>Δεν φορτώθηκε ο οδηγός</h1>' +
			'<p>Έλεγξε τη σύνδεση και δοκίμασε ξανά. Αν είναι η πρώτη φορά που τον ανοίγεις, χρειάζεται internet.</p>' +
			'<p><button class="sg-btn sg-btn-primary" type="button" onclick="location.reload()">Δοκίμασε ξανά</button></p>' +
			'<p>Έκτακτη ανάγκη: <a href="tel:112">112</a> · ΕΚΑΒ <a href="tel:166">166</a> · Πυροσβεστική <a href="tel:199">199</a></p></div>';
		registerSW();
	});
})();
</script></body></html>
