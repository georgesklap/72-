<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>72 Ώρες</title><style>/* 72 Ώρες – Οδηγός Ετοιμότητας & Επιβίωσης
 * Φωτεινό θέμα υψηλής αντίθεσης, σκοτεινό θέμα για οικονομία μπαταρίας.
 * Σημείωση: δεν χρησιμοποιούμε text-transform: uppercase (τα ελληνικά κεφαλαία γράφονται χωρίς τόνους, χειροκίνητα).
 */

.sg-root {
	--sg-bg: #f6f4ef;
	--sg-surface: #ffffff;
	--sg-surface-2: #f0ece3;
	--sg-text: #17140f;
	--sg-muted: #5c564c;
	--sg-line: #e4dfd4;
	--sg-accent: #c2410c;
	--sg-accent-ink: #ffffff;
	--sg-red: #c81e1e;
	--sg-red-ink: #ffffff;
	--sg-red-soft: #fdecea;
	--sg-ok: #166534;
	--sg-ok-soft: #e3f6e8;
	--sg-warn: #a15c07;
	--sg-warn-soft: #fdf2d8;
	--sg-info-soft: #e8f3fb;
	--sg-radius: 20px;
	--sg-radius-sm: 14px;
	--sg-shadow: 0 1px 2px rgba(23,20,15,.05), 0 6px 20px rgba(23,20,15,.06);
	--sg-shadow-lg: 0 12px 34px rgba(23,20,15,.12);
	--sg-fs: 17px;
	--sg-nav-h: 64px;

	box-sizing: border-box;
	position: relative;
	max-width: 820px;
	margin: 0 auto;
	padding: 0 0 20px;
	background: var(--sg-bg);
	color: var(--sg-text);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
	font-size: var(--sg-fs);
	line-height: 1.55;
	-webkit-font-smoothing: antialiased;
	-webkit-tap-highlight-color: transparent;
	border-radius: var(--sg-radius);
	text-align: left;
}
.sg-root *, .sg-root *::before, .sg-root *::after { box-sizing: inherit; }
.sg-root.sg-big { --sg-fs: 20px; }

.sg-root.sg-dark {
	--sg-bg: #0c0c0d;
	--sg-surface: #17171a;
	--sg-surface-2: #212125;
	--sg-text: #f4f3f1;
	--sg-muted: #aaa49c;
	--sg-line: #2d2d32;
	--sg-accent: #fb8a4b;
	--sg-accent-ink: #1a0d05;
	--sg-red: #f26a6a;
	--sg-red-ink: #1b0606;
	--sg-red-soft: #33151555;
	--sg-ok: #4ade80;
	--sg-ok-soft: #0f2c1a;
	--sg-warn: #f5c451;
	--sg-warn-soft: #2f2608;
	--sg-info-soft: #0f2533;
	--sg-shadow: none;
	--sg-shadow-lg: 0 12px 34px rgba(0,0,0,.5);
}

.sg-root a { color: inherit; text-decoration: none; }
.sg-root button { font: inherit; color: inherit; cursor: pointer; }
.sg-root h1, .sg-root h2, .sg-root h3, .sg-root h4 { margin: 0; line-height: 1.2; color: var(--sg-text); letter-spacing: -0.015em; text-transform: none; font-family: inherit; }
.sg-root p { margin: 0 0 12px; }
.sg-root ul, .sg-root ol { margin: 0; padding-left: 1.25em; }
.sg-root :focus-visible { outline: 3px solid var(--sg-accent); outline-offset: 2px; border-radius: 10px; }
.sg-root svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Tint helper: --h ανά ενότητα */
.sg-root [style*="--h"] { --h-soft: color-mix(in srgb, var(--h) 12%, var(--sg-surface)); --h-line: color-mix(in srgb, var(--h) 28%, var(--sg-line)); }

/* Standalone (PWA) */
body.sg-standalone-body { margin: 0; background: #f6f4ef; }
body.sg-standalone-body.sg-dark-body { background: #0c0c0d; }
.sg-root.sg-standalone { border-radius: 0; min-height: 100vh; }

.sg-boot { display: grid; place-items: center; gap: 6px; padding: 64px 16px; color: var(--sg-muted); }
.sg-boot strong { font-size: 28px; color: var(--sg-accent); }

/* Header εφαρμογής */
.sg-header {
	display: flex; align-items: center; justify-content: space-between; gap: 8px;
	padding: 10px 12px 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
	background: var(--sg-surface); border-bottom: 1px solid var(--sg-line);
	border-radius: var(--sg-radius) var(--sg-radius) 0 0;
}
.sg-standalone .sg-header { position: sticky; top: 0; z-index: 20; border-radius: 0; }
.sg-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sg-logo {
	display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 38px;
	border-radius: 12px; background: var(--sg-red); color: var(--sg-red-ink);
	font-weight: 900; font-size: 16px; letter-spacing: -0.03em;
}
.sg-brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.sg-brand-text strong { font-size: 17px; font-weight: 800; white-space: nowrap; }
.sg-brand-text small { font-size: 12px; color: var(--sg-muted); white-space: nowrap; }
.sg-header-actions { display: flex; align-items: center; gap: 2px; }
.sg-icon-btn {
	display: inline-grid; place-items: center; width: 42px; height: 42px;
	border: 0; border-radius: 12px; background: transparent; color: var(--sg-text);
}
.sg-icon-btn:hover { background: var(--sg-surface-2); }

.sg-pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.sg-pill-ok { background: var(--sg-ok-soft); color: var(--sg-ok); }
.sg-pill-off { background: var(--sg-warn-soft); color: var(--sg-warn); }
.sg-pill-wait, .sg-pill-warn { background: var(--sg-surface-2); color: var(--sg-muted); }
@media (max-width: 400px) { .sg-brand-text small { display: none; } }

/* Πλοήγηση: κάτω μπάρα στο κινητό, καρτέλες στο desktop */
.sg-nav {
	display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
	background: var(--sg-surface); border-bottom: 1px solid var(--sg-line);
}
.sg-nav-item {
	position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
	min-height: 56px; padding: 6px 2px; color: var(--sg-muted);
}
.sg-nav-ico { font-size: 21px; line-height: 1.1; filter: grayscale(.6); opacity: .85; }
.sg-nav-item small { font-size: 11.5px; font-weight: 700; }
.sg-nav-item.is-active { color: var(--sg-text); }
.sg-nav-item.is-active .sg-nav-ico { filter: none; opacity: 1; }
.sg-nav-item.is-active::after { content: ""; position: absolute; left: 28%; right: 28%; bottom: 0; height: 3px; border-radius: 3px; background: var(--sg-red); }

@media (max-width: 759px) {
	.sg-nav {
		position: fixed; left: 0; right: 0; bottom: 0; z-index: 9990;
		border-top: 1px solid var(--sg-line); border-bottom: 0;
		padding-bottom: env(safe-area-inset-bottom);
		box-shadow: 0 -6px 20px rgba(0,0,0,.06);
	}
	.sg-nav-item.is-active::after { top: 0; bottom: auto; }
	.sg-root { padding-bottom: calc(var(--sg-nav-h) + 20px); }
	.sg-root:not(.sg-standalone) { border-radius: var(--sg-radius) var(--sg-radius) 0 0; }
}
@media (min-width: 760px) {
	.sg-standalone .sg-nav { position: sticky; top: 59px; z-index: 19; }
	.sg-nav { max-width: 100%; }
}

.sg-main { padding: 16px; outline: none; }
@media (min-width: 760px) { .sg-main { padding: 22px 24px; } }
.sg-footer {
	display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px;
	padding: 4px 16px 0; font-size: 13px; color: var(--sg-muted);
}
.sg-footer a { text-decoration: underline; text-underline-offset: 2px; }

/* Τυπογραφία */
.sg-h1 { font-size: 1.6em; font-weight: 850; }
.sg-h2 { font-size: 1.12em; font-weight: 800; margin: 26px 2px 10px !important; }
.sg-h3 { font-size: 1.02em; font-weight: 800; margin: 22px 2px 8px !important; display: flex; align-items: center; gap: 8px; }
.sg-intro { color: var(--sg-muted); margin: 8px 0 0 !important; }
.sg-muted { color: var(--sg-muted); font-size: .9em; }
.sg-eyebrow { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .09em; color: var(--sg-accent); }
.sg-eyebrow-red { color: var(--sg-red); }
.sg-link { display: inline-block; margin-top: 6px; color: var(--sg-accent) !important; font-weight: 700; }
.sg-crumbs { font-size: .82em; color: var(--sg-muted); margin-bottom: 8px; }
.sg-crumbs a { text-decoration: underline; text-underline-offset: 2px; }

/* Alert λήξεων */
.sg-alert {
	display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; margin-bottom: 14px;
	border-radius: var(--sg-radius-sm); background: var(--sg-warn-soft); border: 1px solid color-mix(in srgb, var(--sg-warn) 30%, transparent);
}
.sg-alert-ico { font-size: 22px; }
.sg-alert strong { display: block; }
.sg-alert small { color: var(--sg-muted); }

/* ===== Panel έκτακτης ανάγκης ===== */
.sg-emergency {
	background: var(--sg-surface); border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
	box-shadow: var(--sg-shadow); padding: 18px; overflow: hidden; position: relative;
}
.sg-emergency::before {
	content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--sg-red);
}
.sg-em-head h1 { font-size: 2em; font-weight: 900; letter-spacing: -0.03em; margin: 4px 0 2px; }
.sg-em-head p { color: var(--sg-muted); margin: 0 0 14px; }

.sg-call-hero {
	display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px;
	background: var(--sg-red); color: var(--sg-red-ink) !important; box-shadow: 0 10px 24px color-mix(in srgb, var(--sg-red) 35%, transparent);
}
.sg-call-hero:active { transform: scale(.99); }
.sg-call-hero-ico { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.18); font-size: 22px; }
.sg-call-hero strong { display: block; font-size: 1.35em; font-weight: 900; line-height: 1.1; }
.sg-call-hero small { opacity: .9; font-size: .82em; }
.sg-call-hero .sg-chev { margin-left: auto; color: inherit; opacity: .8; }

.sg-call-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0 16px; }
.sg-call-row a {
	display: flex; flex-direction: column; align-items: center; padding: 9px 4px; border-radius: 12px;
	background: var(--sg-red-soft); color: var(--sg-red) !important; text-align: center;
}
.sg-call-row strong { font-size: 1.2em; font-weight: 900; line-height: 1.1; }
.sg-call-row small { font-size: 11.5px; font-weight: 700; color: var(--sg-text); opacity: .75; }

.sg-hazards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 599px) { .sg-hazards .sg-hazard:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; } }
@media (min-width: 600px) { .sg-hazards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.sg-hazards-page { margin-top: 14px; }
.sg-hazard {
	display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px;
	min-height: 100px; padding: 12px; border-radius: var(--sg-radius-sm);
	background: var(--h-soft, var(--sg-surface-2)); border: 1.5px solid var(--h-line, var(--sg-line));
	font-weight: 800; line-height: 1.18; transition: transform .12s ease, box-shadow .12s ease;
}
.sg-hazard:hover { box-shadow: var(--sg-shadow); transform: translateY(-1px); }
.sg-hazard:active { transform: scale(.98); }
.sg-hazard-ico {
	display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px;
	background: var(--sg-surface); font-size: 22px; box-shadow: inset 0 0 0 1.5px var(--h-line, var(--sg-line));
}
.sg-hazard-name { font-size: .95em; min-width: 0; overflow-wrap: break-word; }

/* ===== Ετοιμότητα ===== */
.sg-ready {
	display: flex; align-items: center; gap: 18px; margin-top: 14px; padding: 18px;
	background: var(--sg-surface); border: 1px solid var(--sg-line); border-radius: var(--sg-radius); box-shadow: var(--sg-shadow);
}
.sg-ring {
	--p: 0; flex: 0 0 86px; width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center;
	background: conic-gradient(var(--sg-ok) calc(var(--p) * 1%), var(--sg-surface-2) 0);
}
.sg-ring span {
	display: grid; place-items: center; width: 66px; height: 66px; border-radius: 50%;
	background: var(--sg-surface); font-weight: 900; font-size: 1.15em;
}
.sg-ready-body { flex: 1; min-width: 0; }
.sg-ready-body h2 { font-size: 1.05em; font-weight: 800; margin-bottom: 6px; }
.sg-ready-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 6px 0; font-size: .9em; }
.sg-ready-row .sg-bar { grid-column: 1 / -1; grid-row: 2; }
.sg-ready-row b { text-align: right; font-size: .95em; }
.sg-bar { height: 8px; border-radius: 99px; background: var(--sg-surface-2); overflow: hidden; }
.sg-bar i { display: block; height: 100%; background: var(--sg-ok); border-radius: inherit; }
@media (max-width: 420px) {
	.sg-ready { flex-direction: column; align-items: stretch; }
	.sg-ring { align-self: center; }
}

/* ===== Ενότητες οδηγού ===== */
.sg-sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 600px) { .sg-sections { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.sg-sec {
	display: flex; flex-direction: column; gap: 4px; min-height: 118px; padding: 14px;
	background: var(--sg-surface); border: 1px solid var(--sg-line); border-radius: var(--sg-radius-sm);
	box-shadow: var(--sg-shadow); transition: transform .12s ease, border-color .12s ease;
}
.sg-sec:hover { border-color: var(--h); transform: translateY(-1px); }
.sg-sec-ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--h-soft); font-size: 24px; margin-bottom: 6px; }
.sg-sec strong { font-size: .98em; line-height: 1.2; }
.sg-sec small { color: var(--sg-muted); font-size: .8em; margin-top: auto; }

/* Γρήγορα εργαλεία */
.sg-quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sg-quick button, .sg-quick a {
	display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px;
	background: var(--sg-surface); border: 1px solid var(--sg-line); border-radius: var(--sg-radius-sm);
	font-size: .8em; font-weight: 700; text-align: center;
}
.sg-quick span { font-size: 24px; line-height: 1; }

/* Τηλέφωνα */
.sg-numbers { display: grid; gap: 8px; }
@media (min-width: 720px) { .sg-numbers { grid-template-columns: 1fr 1fr; } }
.sg-number {
	display: flex; align-items: center; gap: 12px; padding: 12px 14px;
	background: var(--sg-surface); border: 1px solid var(--sg-line); border-radius: var(--sg-radius-sm);
}
.sg-number-tel { flex: 0 0 auto; min-width: 52px; white-space: nowrap; font-weight: 900; font-size: 1.15em; line-height: 1.15; color: var(--sg-red); font-variant-numeric: tabular-nums; }
.sg-number-body { display: flex; flex-direction: column; min-width: 8.5em; flex: 1 1 8.5em; line-height: 1.3; }
.sg-number { flex-wrap: wrap; }
.sg-number-body strong { font-size: .92em; }
.sg-number-body small { color: var(--sg-muted); font-size: .78em; }
.sg-number-call { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--sg-red-soft); font-size: 17px; }

/* Install */
.sg-install {
	margin-top: 24px; padding: 18px; border-radius: var(--sg-radius);
	background: var(--sg-surface); border: 1px solid var(--sg-line); box-shadow: var(--sg-shadow);
}
.sg-install-head { display: flex; gap: 14px; align-items: flex-start; }
.sg-install-ico {
	display: grid; place-items: center; flex: 0 0 46px; width: 46px; height: 46px; border-radius: 14px;
	background: var(--sg-info-soft); color: #0369a1;
}
.sg-dark .sg-install-ico { color: #7cc4f0; }
.sg-install-ico svg { width: 24px; height: 24px; }
.sg-install h2 { font-size: 1.05em; font-weight: 800; margin: 2px 0 4px; }
.sg-install p, .sg-install ol { margin: 0 0 6px !important; color: var(--sg-muted); font-size: .94em; }
.sg-install p strong, .sg-install ol strong { color: var(--sg-text); }
.sg-install-steps { padding-left: 1.2em !important; }
.sg-install-actions { display: grid; gap: 8px; margin-top: 14px; }
.sg-install-actions.sg-two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.sg-install-actions .sg-btn { width: 100%; }
@media (max-width: 480px) { .sg-install-actions.sg-two { grid-template-columns: 1fr; } }

/* Τα emoji του WordPress δεν πρέπει να γίνονται εικόνες μέσα στην εφαρμογή */
.sg-root img.emoji { display: inline !important; width: 1em !important; height: 1em !important; margin: 0 !important; vertical-align: -0.1em !important; box-shadow: none !important; border: 0 !important; }

/* ===== Σελίδα ενότητας / κάρτας ===== */
.sg-page-hero {
	padding: 16px 18px 18px; margin-bottom: 14px; border-radius: var(--sg-radius);
	background: var(--h-soft, var(--sg-surface)); border: 1px solid var(--h-line, var(--sg-line));
}
.sg-page-hero-row { display: flex; align-items: center; gap: 12px; }
.sg-page-ico {
	display: grid; place-items: center; flex: 0 0 50px; width: 50px; height: 50px; border-radius: 14px;
	background: var(--sg-surface); font-size: 28px; box-shadow: inset 0 0 0 1.5px var(--h-line, var(--sg-line));
}

.sg-list { display: grid; gap: 8px; }
.sg-row {
	display: flex; align-items: center; gap: 12px; padding: 14px;
	border-radius: var(--sg-radius-sm); background: var(--sg-surface); border: 1px solid var(--sg-line);
	transition: border-color .12s ease;
}
.sg-row:hover { border-color: var(--h, var(--sg-accent)); }
.sg-row-info { margin-top: 18px; background: var(--sg-info-soft); border-color: transparent; }
.sg-row-icon { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; background: var(--h-soft, var(--sg-surface-2)); font-size: 23px; }
.sg-row-body { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.sg-row-body strong { line-height: 1.25; }
.sg-row-body small { color: var(--sg-muted); font-size: .84em; line-height: 1.4; margin-top: 2px; }
.sg-row-flag { font-style: normal; font-size: 11px; font-weight: 700; color: var(--sg-warn); margin-top: 4px; }
.sg-chev { font-size: 26px; line-height: 1; color: var(--sg-muted); }

.sg-card { position: relative; }
.sg-card-hero {
	padding: 16px 18px 18px; border-radius: var(--sg-radius); margin-bottom: 12px;
	background: var(--h-soft, var(--sg-surface)); border: 1px solid var(--h-line, var(--sg-line));
}
.sg-card-hero .sg-badge { margin-top: 12px; }
.sg-lead {
	font-size: 1.14em; font-weight: 750; line-height: 1.45; margin: 0 0 4px !important;
	padding: 14px 16px; border-left: 5px solid var(--h, var(--sg-accent)); background: var(--sg-surface);
	border-radius: 0 var(--sg-radius-sm) var(--sg-radius-sm) 0;
}
.sg-badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.sg-badge-review { background: var(--sg-warn-soft); color: var(--sg-warn); }
.sg-badge-ok { background: var(--sg-ok-soft); color: var(--sg-ok); }

.sg-calls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.sg-call {
	flex: 1 1 120px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 10px;
	border-radius: 14px; background: var(--sg-red-soft); color: var(--sg-red) !important; font-weight: 800;
}
.sg-call strong { font-size: 1.15em; }
.sg-call small { font-size: .78em; font-weight: 700; color: var(--sg-text); opacity: .75; }
.sg-call.sg-call-main-sm { background: var(--sg-red); color: var(--sg-red-ink) !important; }
.sg-call.sg-call-main-sm small { color: inherit; opacity: .9; }

.sg-block { margin-top: 12px; padding: 16px 18px; border-radius: var(--sg-radius-sm); background: var(--sg-surface); border: 1px solid var(--sg-line); }
.sg-block h3 { display: flex; align-items: center; gap: 8px; font-size: 1em; font-weight: 800; margin-bottom: 10px; }
.sg-block-ico { font-size: 1em; }
.sg-block li { margin: 7px 0; }
.sg-block li::marker { color: var(--sg-muted); }
.sg-block-steps .sg-block-ico { color: var(--h, var(--sg-accent)); font-weight: 900; }
.sg-steps { list-style: none; padding: 0 !important; counter-reset: sgstep; }
.sg-steps li { counter-increment: sgstep; position: relative; padding: 2px 0 10px 44px; margin: 0 0 4px; min-height: 34px; }
.sg-steps li::before {
	content: counter(sgstep); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
	display: grid; place-items: center; background: var(--h, var(--sg-accent)); color: #fff; font-weight: 900; font-size: .9em;
}
.sg-steps li:not(:last-child)::after { content: ""; position: absolute; left: 14px; top: 32px; bottom: -4px; width: 2px; background: var(--h-line, var(--sg-line)); }
.sg-dark .sg-steps li::before { color: #111; }
.sg-block-warn { background: var(--sg-red-soft); border-color: color-mix(in srgb, var(--sg-red) 25%, transparent); }
.sg-block-warn h3 { color: var(--sg-red); }
.sg-block-tip { background: var(--sg-info-soft); border-color: transparent; }

.sg-sources { margin-top: 16px; padding: 0 4px; font-size: .84em; color: var(--sg-muted); }
.sg-sources a { text-decoration: underline; text-underline-offset: 2px; }
.sg-sources ul { margin: 4px 0 6px; }

.sg-pager { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.sg-pager a {
	display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: var(--sg-radius-sm);
	background: var(--sg-surface); border: 1px solid var(--sg-line);
}
.sg-pager small { color: var(--sg-muted); font-size: .78em; font-weight: 700; }
.sg-pager strong { font-size: .92em; line-height: 1.25; }
.sg-pager-next { text-align: right; }

/* Buttons */
.sg-btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 6px;
	min-height: 48px; padding: 10px 18px; border-radius: 14px;
	background: var(--sg-surface); border: 1px solid var(--sg-line); font-weight: 700;
}
.sg-btn:hover { border-color: var(--sg-accent); }
.sg-btn-primary { background: var(--sg-text); color: var(--sg-bg) !important; border-color: var(--sg-text); }
.sg-btn-ghost { background: transparent; border-color: var(--sg-line); color: var(--sg-text) !important; }
.sg-root .sg-btn { font-family: inherit; font-size: 1em; font-weight: 750; line-height: 1.2; white-space: nowrap; text-decoration: none; text-transform: none; letter-spacing: normal; }
.sg-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }

/* Εργαλεία */
.sg-tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .sg-tools { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.sg-tool {
	display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; text-align: left; min-height: 128px;
	background: var(--sg-surface); border: 1px solid var(--sg-line); border-radius: var(--sg-radius-sm); box-shadow: var(--sg-shadow);
	font: inherit; color: inherit;
}
.sg-tool:hover { border-color: var(--sg-accent); }
.sg-tool-ico { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--sg-surface-2); font-size: 23px; margin-bottom: 4px; }
.sg-tool strong { font-size: .98em; line-height: 1.2; }
.sg-tool small { color: var(--sg-muted); font-size: .8em; line-height: 1.35; }
.sg-row-info { margin-top: 20px; }
.sg-wide { width: 100%; margin-top: 4px; }
.sg-tool-out { margin: 14px 0; }
.sg-tool-out:empty { margin: 0; }
.sg-coords { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sg-coords > div { display: flex; flex-direction: column; padding: 14px; border-radius: var(--sg-radius-sm); background: var(--sg-surface); border: 1px solid var(--sg-line); }
.sg-coords small { color: var(--sg-muted); font-weight: 700; font-size: .78em; }
.sg-coords strong { font-size: 1.3em; font-weight: 900; font-variant-numeric: tabular-nums; }
.sg-coords span { font-size: .85em; color: var(--sg-muted); }
.sg-result { display: flex; flex-direction: column; gap: 2px; padding: 16px; border-radius: var(--sg-radius-sm); border: 1px solid var(--sg-line); background: var(--sg-surface); }
.sg-result strong { font-size: 1.8em; font-weight: 900; line-height: 1.1; }
.sg-result span { color: var(--sg-muted); }
.sg-result.is-bad { background: var(--sg-red-soft); border-color: transparent; }
.sg-result.is-bad strong { color: var(--sg-red); }
.sg-result.is-ok { background: var(--sg-warn-soft); border-color: transparent; }
.sg-result.is-info { background: var(--sg-info-soft); border-color: transparent; }
.sg-storm { text-align: center; }
.sg-storm-time { font-size: 3em; font-weight: 900; font-variant-numeric: tabular-nums; margin: 6px 0 10px; }
.sg-root .sg-num { width: 110px; font: inherit; font-weight: 800; text-align: center; padding: 10px; border-radius: 12px; border: 1px solid var(--sg-line); background: var(--sg-bg); color: var(--sg-text); }
.sg-compass { position: relative; width: min(260px, 72vw); aspect-ratio: 1; margin: 8px auto 4px; }
.sg-compass-dial {
	position: absolute; inset: 0; border-radius: 50%; background: var(--sg-surface); border: 2px solid var(--sg-line);
	box-shadow: var(--sg-shadow); transition: transform .15s linear;
}
.sg-compass-dial span { position: absolute; font-weight: 900; font-size: 1.2em; }
.sg-compass-dial .n { top: 8px; left: 50%; transform: translateX(-50%); color: var(--sg-red); }
.sg-compass-dial .s { bottom: 8px; left: 50%; transform: translateX(-50%); }
.sg-compass-dial .e { right: 12px; top: 50%; transform: translateY(-50%); }
.sg-compass-dial .w { left: 12px; top: 50%; transform: translateY(-50%); }
.sg-compass-dial i { position: absolute; left: 50%; top: 18%; bottom: 50%; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--sg-red); }
.sg-compass-mark { position: absolute; left: 50%; top: -10px; margin-left: -8px; border: 8px solid transparent; border-top: 12px solid var(--sg-text); }
.sg-compass-read { text-align: center; font-size: 1.6em; font-weight: 900; margin: 6px 0 12px !important; }

/* Οδηγίες εγκατάστασης (sheet) */
.sg-sheet-wrap {
	position: fixed; inset: 0; z-index: 2147483002; background: rgba(0,0,0,.45);
	display: flex; align-items: flex-end; justify-content: center; padding: 12px;
}
@media (min-width: 640px) { .sg-sheet-wrap { align-items: center; } }
.sg-sheet {
	width: 100%; max-width: 480px; max-height: 88vh; overflow: auto; padding: 22px 20px calc(18px + env(safe-area-inset-bottom));
	background: var(--sg-surface); color: var(--sg-text); border-radius: 22px; box-shadow: var(--sg-shadow-lg);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
.sg-sheet h2 { font-size: 1.2em; font-weight: 850; margin: 0 0 14px; }
.sg-sheet .sg-steps li::before { background: var(--sg-text); color: var(--sg-surface); }
.sg-sheet .sg-btn { width: 100%; margin-top: 8px; }
.sg-sheet .sg-muted { margin-top: 6px; }

/* Κιτ */
.sg-household { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--sg-radius); background: var(--sg-surface); border: 1px solid var(--sg-line); }
.sg-stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sg-stepper > span { font-weight: 600; }
.sg-stepper > div { display: flex; align-items: center; gap: 6px; }
.sg-stepper button {
	width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--sg-line);
	background: var(--sg-surface-2); font-size: 22px; font-weight: 700;
}
.sg-stepper button:disabled { opacity: .35; cursor: default; }
.sg-root .sg-step-num { width: 56px; height: 44px; padding: 0 4px; text-align: center; font: inherit; font-weight: 900; font-size: 1.1em; border: 1px solid var(--sg-line); border-radius: 12px; background: var(--sg-bg); color: var(--sg-text); -moz-appearance: textfield; }
.sg-root .sg-step-num::-webkit-inner-spin-button, .sg-root .sg-step-num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.sg-seg { display: flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--sg-line); }
.sg-seg button { width: auto; min-width: 48px; height: 42px; border: 0; border-radius: 0; font-size: 1em; background: var(--sg-surface); }
.sg-seg button.is-on { background: var(--sg-text); color: var(--sg-bg); }

.sg-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 14px; padding: 4px; background: var(--sg-surface-2); border-radius: 16px; }
.sg-tabs button { min-height: 46px; border: 0; border-radius: 12px; background: transparent; font-weight: 700; }
.sg-tabs button.is-on { background: var(--sg-surface); box-shadow: var(--sg-shadow); }

.sg-progress-wrap { display: flex; align-items: center; gap: 12px; margin: 14px 2px 8px; }
.sg-progress { height: 12px; flex: 1; border-radius: 99px; background: var(--sg-surface-2); overflow: hidden; }
.sg-progress span { display: block; height: 100%; background: var(--sg-ok); border-radius: inherit; transition: width .3s; }
.sg-progress-wrap strong { font-size: .9em; white-space: nowrap; }

.sg-checklist { list-style: none; padding: 0 !important; display: grid; gap: 6px; }
.sg-checklist li { background: var(--sg-surface); border: 1px solid var(--sg-line); border-radius: var(--sg-radius-sm); }
.sg-checklist li.is-done { background: var(--sg-ok-soft); border-color: transparent; }
.sg-checklist li.is-done .sg-check-body strong { text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: .75; }
.sg-check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer; }
.sg-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sg-check-box {
	flex: 0 0 28px; width: 28px; height: 28px; margin-top: 1px; border-radius: 9px;
	border: 2px solid var(--sg-muted); background: var(--sg-surface); display: grid; place-items: center;
}
.sg-check input:checked + .sg-check-box { background: var(--sg-ok); border-color: var(--sg-ok); }
.sg-check input:checked + .sg-check-box::after { content: "✓"; color: #fff; font-weight: 900; font-size: 18px; line-height: 1; }
.sg-dark .sg-check input:checked + .sg-check-box::after { color: #06200f; }
.sg-check input:focus-visible + .sg-check-box { outline: 3px solid var(--sg-accent); outline-offset: 2px; }
.sg-check-body { display: flex; flex-direction: column; gap: 2px; }
.sg-check-body small { color: var(--sg-muted); font-size: .82em; line-height: 1.4; }
.sg-qty { font-weight: 800; color: var(--sg-accent); }
.sg-exp { display: flex; align-items: center; gap: 8px; padding: 0 14px 12px 54px; font-size: .85em; color: var(--sg-muted); }
.sg-exp input { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--sg-line); background: var(--sg-surface); color: var(--sg-text); }
.sg-exp-warn input { border-color: var(--sg-warn); background: var(--sg-warn-soft); }
.sg-exp-bad input { border-color: var(--sg-red); background: var(--sg-red-soft); }

/* Φόρμες */
.sg-form fieldset { border: 1px solid var(--sg-line); border-radius: var(--sg-radius); padding: 14px 16px; margin: 0 0 12px; background: var(--sg-surface); min-width: 0; }
.sg-form legend { font-weight: 800; padding: 0 6px; }
.sg-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.sg-field span { font-size: .9em; font-weight: 600; }
.sg-root input[type=text], .sg-root input[type=tel], .sg-root input[type=search], .sg-root textarea {
	width: 100%; font: inherit; font-size: max(16px, 1em); padding: 12px 13px; border-radius: 12px;
	border: 1px solid var(--sg-line); background: var(--sg-bg); color: var(--sg-text); box-shadow: none; margin: 0;
}
.sg-root input:focus, .sg-root textarea:focus { border-color: var(--sg-accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sg-accent) 20%, transparent); }
.sg-root textarea { resize: vertical; min-height: 64px; }
.sg-members { display: grid; gap: 8px; margin-bottom: 8px; }
.sg-member { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 6px; }
@media (max-width: 420px) { .sg-member { grid-template-columns: 1fr 44px; } .sg-member input[type=tel] { grid-column: 1; grid-row: 2; } .sg-member button { grid-row: 1 / span 2; grid-column: 2; } }

.sg-search input { font-size: 18px !important; padding: 15px !important; border-radius: 16px !important; background: var(--sg-surface) !important; }
.sg-results { margin-top: 12px; }

.sg-settings { display: grid; gap: 8px; margin: 8px 0 12px; }
.sg-switch { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--sg-radius-sm); background: var(--sg-surface); border: 1px solid var(--sg-line); }
.sg-switch input { width: 22px; height: 22px; accent-color: var(--sg-accent); }

.sg-prose h2 { font-size: 1.05em; font-weight: 800; margin: 18px 0 6px; }
.sg-prose a { text-decoration: underline; color: var(--sg-accent); }

/* Overlay εργαλείων */
.sg-overlay {
	position: fixed; inset: 0; z-index: 2147483000; background: #000;
	display: flex; flex-direction: column; justify-content: space-between; align-items: center;
	padding: calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
}
.sg-overlay.is-on { background: #fff; }
.sg-overlay-label { color: #888; font-weight: 700; font-family: system-ui, sans-serif; }
.sg-overlay-siren { background: #7f1d1d; }
.sg-overlay-siren.is-on { background: #ef4444; }
.sg-overlay-siren .sg-overlay-label, .sg-overlay-siren .sg-overlay-stop { color: #fff; border-color: #fff; }
.sg-overlay-cpr { background: #111; color: #fff; text-align: center; font-family: system-ui, sans-serif; }
.sg-cpr-top strong { display: block; font-size: 1.6em; color: #f87171; }
.sg-cpr-top span { display: block; color: #ddd; margin-top: 4px; }
.sg-cpr-beat { display: grid; place-items: center; width: 200px; height: 200px; border-radius: 50%; background: #b91c1c; }
.sg-cpr-beat span { font-size: 4.4em; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
.sg-cpr-beat.is-hit { animation: sgbeat .3s ease-out; }
@keyframes sgbeat { 0% { transform: scale(1.12); background: #ef4444; } 100% { transform: scale(1); } }
.sg-cpr-hint { color: #ccc; max-width: 320px; }
.sg-overlay-cpr .sg-overlay-stop { color: #ddd; border-color: #777; }
.sg-overlay-stop {
	min-width: 180px; min-height: 56px; border-radius: 99px; border: 2px solid #888;
	background: rgba(127,127,127,.25); color: #888; font-size: 18px; font-weight: 800;
}

.sg-toast {
	position: fixed; left: 50%; bottom: calc(var(--sg-nav-h) + 24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
	z-index: 2147483001; max-width: 92vw; padding: 12px 18px; border-radius: 14px;
	background: #17140f; color: #fff; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
	transition: opacity .4s, transform .4s;
}
.sg-toast-out { opacity: 0; transform: translate(-50%, 8px); }

.sg-fatal { padding: 24px; }
.sg-root code { font-size: .85em; background: var(--sg-surface-2); padding: 1px 6px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) {
	.sg-root *, .sg-root *::before, .sg-root *::after { transition: none !important; }
}

/* Εκτύπωση */
.sg-print-area h1 { font-size: 1.6em; margin-bottom: 8px; }
.sg-print-area h2 { font-size: 1.25em; margin: 18px 0 8px; border-bottom: 2px solid var(--sg-text); padding-bottom: 4px; }
.sg-print-area h3 { font-size: 1.05em; margin: 12px 0 4px; }
.sg-print-area h4 { font-size: .95em; margin: 8px 0 2px; }
.sg-print-card { break-inside: avoid; margin-bottom: 10px; }
.sg-print-check { list-style: none; padding: 0 !important; }
.sg-print-pre { white-space: pre-wrap; font-family: inherit; background: var(--sg-surface-2); padding: 12px; border-radius: 12px; }
.sg-print-numbers { font-size: .9em; padding: 8px; border: 2px solid var(--sg-red); border-radius: 8px; }
.sg-print-foot { margin-top: 18px; font-size: .8em; color: var(--sg-muted); }

@media print {
	html, body, body.sg-standalone-body, body.sg-dark-body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
	html.sg-printing body > *:not(#sg-print-host) { display: none !important; }
	#sg-print-host { display: block !important; position: static !important; max-width: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; background: #fff !important; }
	html:not(.sg-printing) body * { visibility: hidden !important; }
	html:not(.sg-printing) .sg-print-area, html:not(.sg-printing) .sg-print-area * { visibility: visible !important; }
	html:not(.sg-printing) .sg-print-area { position: absolute; left: 0; top: 0; width: 100%; }
	.sg-print-area { color: #000; font-size: 11pt; }
	.sg-root, .sg-root.sg-dark { --sg-bg:#fff; --sg-surface:#fff; --sg-surface-2:#f3f3f3; --sg-text:#000; --sg-muted:#444; --sg-line:#ccc; --sg-red:#b91c1c; background: #fff !important; color:#000 !important; }
	.sg-print-area h1, .sg-print-area h2, .sg-print-area h3, .sg-print-area h4 { color: #000 !important; }
	.sg-print-area h2 { border-color: #000 !important; }
	.sg-no-print, .sg-nav { display: none !important; }
}

/* v0.4: λήξεις, διανυκτέρευση, σχέδιο */
.sg-exp { flex-wrap: wrap; }
.sg-exp label { display: flex; align-items: center; gap: 8px; }
.sg-root .sg-remind {
	display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 6px 12px; border-radius: 10px;
	border: 1px solid var(--sg-line); background: var(--sg-surface); color: var(--sg-text); font: inherit; font-size: .95em; font-weight: 700;
}
.sg-tabs:has(button:nth-child(3)) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sg-tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: .82em; line-height: 1.15; padding: 6px 2px; white-space: nowrap; min-height: 54px; }
.sg-tabs button span { font-size: 1.35em; }
.sg-root .sg-btn-text { background: transparent; border-color: transparent; color: var(--sg-muted) !important; }
.sg-camp-note .sg-switch input { flex: 0 0 22px; }
.sg-camp-note { margin: 10px 0 6px; padding: 14px 16px; border-radius: var(--sg-radius-sm); background: var(--sg-info-soft); }
.sg-camp-note p { margin: 0 0 10px !important; font-size: .94em; }
.sg-camp-note .sg-switch { background: var(--sg-surface); }
.sg-alert > span:last-child { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; flex: 1; }
.sg-alert strong { line-height: 1.3; }
.sg-alert small { display: block; line-height: 1.45; }
.sg-alert .sg-link {
	margin-top: 8px; padding: 8px 14px; border-radius: 10px; background: var(--sg-surface);
	border: 1px solid color-mix(in srgb, var(--sg-warn) 30%, transparent); font-size: .9em; line-height: 1.2;
}
.sg-checks { margin-bottom: 14px; }
.sg-checks .sg-wide { margin-top: 10px; }
.sg-sheet .sg-btn + .sg-btn, .sg-sheet a.sg-btn { margin-top: 8px; }

.sg-alert-list { list-style: none; padding: 0 !important; margin: 4px 0 0 !important; width: 100%; display: grid; }
.sg-alert-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid color-mix(in srgb, var(--sg-warn) 22%, transparent); font-size: .9em; color: var(--sg-muted); line-height: 1.35; }
.sg-alert-list li span { min-width: 0; }
.sg-alert-list li b { flex: 0 0 auto; color: var(--sg-warn); white-space: nowrap; }
.sg-alert-list li b.is-bad { color: var(--sg-red); }

/* ===== v0.5: εικονίδια SVG ===== */
.sg-root .sg-i { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.18em; flex: 0 0 auto; }
.sg-nav-ico { filter: none !important; opacity: 1 !important; font-size: 22px; line-height: 1; display: grid; place-items: center; height: 26px; }
.sg-nav-ico .sg-i { width: 24px; height: 24px; stroke-width: 1.9; }
.sg-nav-item.is-active .sg-nav-ico { color: var(--sg-red); }
.sg-hazard-ico { color: var(--h); }
.sg-hazard-ico .sg-i { width: 22px; height: 22px; }
.sg-sec-ico { color: var(--h); }
.sg-sec-ico .sg-i { width: 24px; height: 24px; }
.sg-tool-ico { color: var(--sg-text); }
.sg-tool-ico .sg-i { width: 24px; height: 24px; }
.sg-quick span .sg-i { width: 24px; height: 24px; }
.sg-quick button, .sg-quick a { color: var(--sg-text); }
.sg-btn .sg-i { width: 1.1em; height: 1.1em; }

/* ===== Εποχικό μήνυμα ===== */
.sg-season { position: relative; display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; padding: 14px 44px 14px 16px; border-radius: var(--sg-radius); background: var(--sg-warn-soft); border: 1px solid color-mix(in srgb, var(--sg-warn) 25%, transparent); }
.sg-season-ico { display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px; border-radius: 12px; background: var(--sg-surface); color: var(--sg-warn); }
.sg-season-ico .sg-i { width: 22px; height: 22px; }
.sg-season strong { display: block; line-height: 1.3; }
.sg-season p { margin: 2px 0 6px !important; font-size: .9em; color: var(--sg-muted); }
.sg-season-links { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sg-season-links a { font-weight: 700; color: var(--sg-accent) !important; font-size: .9em; }
.sg-season-x { position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; color: var(--sg-muted); }

/* ===== Ξεκίνα σε 3 βήματα ===== */
.sg-onb { margin-top: 14px; padding: 16px; border-radius: var(--sg-radius); background: var(--sg-surface); border: 2px solid color-mix(in srgb, #2563eb 35%, var(--sg-line)); box-shadow: var(--sg-shadow); }
.sg-onb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.sg-onb-head strong { font-size: 1.05em; }
.sg-onb-head span { font-size: .85em; font-weight: 700; color: #1d4ed8; background: color-mix(in srgb, #2563eb 12%, var(--sg-surface)); padding: 2px 8px; border-radius: 99px; }
.sg-onb-head .sg-icon-btn { margin-left: auto; width: 36px; height: 36px; color: var(--sg-muted); }
.sg-onb ol { list-style: none; padding: 0 !important; margin: 0 !important; display: grid; gap: 6px; }
.sg-onb-step { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--sg-line); background: var(--sg-bg); text-align: left; font: inherit; color: inherit; }
.sg-onb-step b { display: block; line-height: 1.25; }
.sg-onb-step small { color: var(--sg-muted); font-size: .84em; }
.sg-onb-n { display: grid; place-items: center; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: #2563eb; color: #fff; font-weight: 900; }
.sg-onb-step.is-done { opacity: .6; }
.sg-onb-step.is-done .sg-onb-n { background: var(--sg-ok); }
.sg-onb-step.is-done b { text-decoration: line-through; }

/* ===== Κοινοποίηση & αντίγραφο ===== */
.sg-share { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 24px; padding: 16px 18px; border-radius: var(--sg-radius); background: var(--sg-surface); border: 1px solid var(--sg-line); box-shadow: var(--sg-shadow); }
.sg-share strong { display: block; font-size: 1.02em; }
.sg-share p { margin: 2px 0 0 !important; color: var(--sg-muted); font-size: .9em; }
.sg-share > div { flex: 1 1 220px; }
.sg-backup { margin: 18px 0 6px; padding: 16px 18px; border-radius: var(--sg-radius); background: var(--sg-surface); border: 1px solid var(--sg-line); }
.sg-backup .sg-h3 { margin-top: 0 !important; }
.sg-root .sg-file { position: relative; cursor: pointer; }
.sg-root .sg-file { overflow: hidden; }
.sg-root .sg-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 0; }
.sg-backup-actions { display: grid; gap: 10px; margin: 14px 0 6px; }
.sg-backup-actions .sg-btn { width: 100%; justify-content: center; }
.sg-root .sg-paste { width: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, monospace; padding: 10px; border-radius: 10px; border: 1px solid var(--sg-line); background: var(--sg-bg); color: var(--sg-text); }
.sg-small { font-size: 13px; }

/* ===== Κιτ: φίλτρο & κατηγορίες ===== */
.sg-kit-tools { margin: 12px 0 0; }
.sg-switch-sm { padding: 10px 12px; font-size: .92em; font-weight: 600; }
details.sg-kit-cat { margin-top: 14px; }
details.sg-kit-cat > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 4px; margin: 0 0 8px !important; border-radius: 10px; }
details.sg-kit-cat > summary::-webkit-details-marker { display: none; }
details.sg-kit-cat > summary::after { content: "›"; margin-left: 6px; font-size: 1.4em; line-height: 1; color: var(--sg-muted); transform: rotate(90deg); transition: transform .15s; }
details.sg-kit-cat:not([open]) > summary::after { transform: rotate(0deg); }
.sg-cat-ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--sg-surface); border: 1px solid var(--sg-line); color: var(--sg-accent); }
.sg-cat-ico .sg-i { width: 19px; height: 19px; }
.sg-cat-title { flex: 1; }
.sg-cat-count { font-size: .78em; font-weight: 800; color: var(--sg-muted); background: var(--sg-surface-2); padding: 3px 9px; border-radius: 99px; }
.sg-exp-date { font-size: .95em; color: var(--sg-text); margin-left: 4px; }
.sg-done-all { margin-top: 16px; padding: 16px; border-radius: var(--sg-radius-sm); background: var(--sg-ok-soft); color: var(--sg-ok); font-weight: 800; text-align: center; }

/* ===== Μονοσέλιδο ψυγείου ===== */
.sg-fridge { max-width: 720px; margin: 0 auto; font-size: 15px; color: var(--sg-text); }
.sg-fridge header { text-align: center; border: 3px solid var(--sg-red); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
.sg-fridge header h1 { font-size: 1.5em; letter-spacing: .03em; margin: 0 0 2px; }
.sg-fridge header p { margin: 0 !important; font-size: 1.15em; }
.sg-fridge header strong { color: var(--sg-red); font-size: 1.4em; }
.sg-fridge-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.sg-fridge-nums span { border: 1px solid var(--sg-line); border-radius: 10px; padding: 6px 8px; font-size: .85em; line-height: 1.25; }
.sg-fridge-nums b { display: block; font-size: 1.25em; color: var(--sg-red); }
.sg-fridge h2 { font-size: 1.05em; margin: 12px 0 4px; padding-bottom: 3px; border-bottom: 2px solid var(--sg-text); }
.sg-fridge table { width: 100%; border-collapse: collapse; }
.sg-fridge th, .sg-fridge td { text-align: left; vertical-align: top; padding: 4px 6px; border-bottom: 1px solid var(--sg-line); }
.sg-fridge th { width: 38%; font-weight: 700; color: var(--sg-muted); }
.sg-fridge td { font-weight: 700; font-size: 1.05em; }
.sg-fridge footer { margin-top: 12px; font-size: .8em; color: var(--sg-muted); text-align: center; }
@media print {
	@page { size: A4; margin: 12mm; }
	.sg-fridge { font-size: 11pt; max-width: none; }
	.sg-fridge-nums b, .sg-fridge header strong { color: #b91c1c !important; }
}

.sg-fridge td.sg-blank, .sg-fridge th.sg-blank { height: 30px; border-bottom: 1px dashed #999; }
.sg-tabs button span .sg-i { width: 22px; height: 22px; }

/* iPhone: οδηγίες με εικόνες */

.sg-root .sg-ios-fig text, .sg-root .sg-ios-fig .sg-ios-screen, .sg-root .sg-ios-fig .sg-ios-card, .sg-root .sg-ios-fig .sg-ios-line, .sg-root .sg-ios-fig .sg-ios-app, .sg-root .sg-ios-fig .sg-ios-tool { stroke: none; }
