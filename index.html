</div><script>window.SG_CONFIG={"version": "local-1.1", "standalone": true, "pageUrl": "./index.html", "appUrl": "./index.html", "scope": "./", "swUrl": "", "manifestUrl": "./manifest.webmanifest", "content": ["./content/el/energeia.json", "./content/el/epeigon.json", "./content/el/katafygio.json", "./content/el/kit.json", "./content/el/nero.json", "./content/el/protes-voitheies.json", "./content/el/psyxologia.json", "./content/el/trofi.json", "./content/el/votana.json", "./content/el/zoa.json"], "iconUrl": "", "home": "./index.html", "statsUrl": ""};window.SG_EMBEDDED_CONTENT=[{"id":"energeia","title":"Ενέργεια & επικοινωνία","icon":"📻","order":7,"intro":"Πώς κρατάς φως, μπαταρία και επαφή με τους δικούς σου όταν πέφτουν ρεύμα και δίκτυα.","cards":[{"id":"mpataria","title":"Κάνε την μπαταρία του κινητού να κρατήσει","icon":"🔋","lead":"Το κινητό είναι φακός, ραδιόφωνο, χάρτης και τηλέφωνο μαζί. Κράτα το ζωντανό όσο περισσότερο γίνεται.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Αμέσως","items":["Ενεργοποίησε τη λειτουργία εξοικονόμησης ενέργειας.","Χαμήλωσε τη φωτεινότητα στο ελάχιστο και ενεργοποίησε το σκοτεινό θέμα.","Κλείσε Bluetooth, Wi-Fi και τοποθεσία όταν δεν τα χρειάζεσαι.","Αν δεν υπάρχει σήμα, βάλε λειτουργία πτήσης: το κινητό καίει πολλή μπαταρία ψάχνοντας δίκτυο.","Άνοιγε το κινητό σε συγκεκριμένες ώρες για να δεις μηνύματα, αντί να είναι συνέχεια ανοιχτό."]},{"type":"tip","title":"Φόρτιση","items":["Power bank, φορτιστής αυτοκινήτου (με τη μηχανή αναμμένη και σε ανοιχτό χώρο) ή μικρό ηλιακό πάνελ.","Φόρτισε όταν υπάρχει ρεύμα, ακόμη και αν η μπαταρία δεν έχει πέσει πολύ."]}],"sources":[{"label":"Ευρωπαϊκή Επιτροπή – Ετοιμότητα πολιτών","url":"https://civil-protection-humanitarian-aid.ec.europa.eu/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"enimerosi","title":"Πού ενημερώνομαι σε κρίση","icon":"📢","lead":"Μόνο από επίσημες πηγές. Στις κρίσεις κυκλοφορούν πολλές ψεύτικες ειδήσεις.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Επίσημα κανάλια","items":["Μηνύματα του 112 στο κινητό: φτάνουν σε όλα τα κινητά της περιοχής. Μην απενεργοποιείς τις ειδοποιήσεις έκτακτης ανάγκης.","Ραδιόφωνο ΕΡΤ: μεταδίδει ανακοινώσεις και όταν δεν λειτουργεί το internet.","Πολιτική Προστασία, Πυροσβεστική, ΕΜΥ και ο δήμος σου στα επίσημα κανάλια τους."]},{"type":"warn","title":"Πριν το προωθήσεις","items":["Ποιος το λέει; Είναι επίσημη πηγή;","Πότε γράφτηκε; Παλιές φωτογραφίες και βίντεο κυκλοφορούν ξανά σε κάθε καταστροφή.","Αν δεν είσαι σίγουρος, μην το στείλεις παρακάτω."]}],"sources":[{"label":"112 Greece","url":"https://112.gov.gr/"},{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"epikoinonia","title":"Επικοινωνία με την οικογένεια","icon":"💬","lead":"Στείλε SMS αντί για κλήση. Έχετε συμφωνήσει από πριν πού συναντιέστε.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Όταν τα δίκτυα είναι φορτωμένα","items":["Τα SMS περνούν συχνά όταν οι κλήσεις δεν συνδέονται.","Κάνε σύντομες κλήσεις και μόνο για ανάγκη, για να μένει χώρος στο δίκτυο για τις υπηρεσίες.","Το 112 λειτουργεί από κάθε κινητό, ακόμη και χωρίς SIM ή από δίκτυο άλλου παρόχου."]},{"type":"list","title":"Επαφή εκτός περιοχής","items":["Ορίστε έναν συγγενή ή φίλο σε άλλη πόλη. Όλοι στέλνετε σε αυτόν «είμαι καλά, είμαι εδώ».","Συχνά είναι πιο εύκολο να καλέσεις υπεραστικά παρά μέσα στην πληγείσα περιοχή."]},{"type":"tip","title":"Συμπλήρωσε τώρα","items":["Πήγαινε στο «Οικογενειακό σχέδιο» και γράψε σημεία συνάντησης και επαφές. Τύπωσέ το και βάλ' το στην τσάντα διαφυγής."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"simata","title":"Σήματα κινδύνου","icon":"🆘","lead":"Τρία από οτιδήποτε σημαίνει «χρειάζομαι βοήθεια»: τρία σφυρίγματα, τρεις λάμψεις, τρία χτυπήματα.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Πώς δίνεις σήμα","items":["SOS σε Morse: τρία σύντομα, τρία μακριά, τρία σύντομα (· · · — — — · · ·). Με φακό, σφυρίχτρα ή χτυπήματα.","Αν είσαι εγκλωβισμένος σε συντρίμμια: χτύπα σε σωλήνα ή τοίχο και σφύρα. Μην φωνάζεις συνέχεια, για να μη χάσεις δυνάμεις και να μην εισπνέεις σκόνη.","Στην ύπαιθρο: φωτεινά χρώματα, καθρέφτης για αντανάκλαση του ήλιου, μεγάλα σχήματα στο έδαφος."]},{"type":"tip","title":"Στην εφαρμογή","items":["Από τα «Εργαλεία» μπορείς να βγάλεις SOS με λάμψεις στην οθόνη, με τον φακό της κάμερας (όπου υποστηρίζεται) και με ήχο."]}],"sources":[{"label":"Ελληνικός Ερυθρός Σταυρός","url":"https://www.redcross.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"monoxeidio","title":"Γεννήτριες, μαγκάλια & μονοξείδιο","icon":"⚠️","urgent":true,"lead":"Το μονοξείδιο του άνθρακα δεν έχει χρώμα ούτε μυρωδιά και σκοτώνει κάθε χειμώνα. Κάθε καύση θέλει ανοιχτό χώρο.","status":"draft","updated":"2026-11","blocks":[{"type":"warn","title":"Ποτέ σε κλειστό χώρο","items":["Γεννήτρια: μόνο έξω, μακριά από πόρτες, παράθυρα και εξαερισμούς. Ούτε σε γκαράζ, ούτε σε κλειστό μπαλκόνι.","Μαγκάλι, ψησταριά κάρβουνου, γκαζάκι: ποτέ μέσα στο σπίτι, ούτε «για λίγο».","Μην ζεσταίνεσαι με αναμμένη μηχανή αυτοκινήτου σε κλειστό γκαράζ."]},{"type":"list","title":"Σημάδια δηλητηρίασης","items":["Πονοκέφαλος, ζάλη, ναυτία, αδυναμία, σύγχυση, υπνηλία. Συχνά τα παθαίνουν πολλοί στο ίδιο σπίτι μαζί.","Βγάλε όλους αμέσως στον καθαρό αέρα και κάλεσε 166."]},{"type":"tip","title":"Προστασία","items":["Ένας ανιχνευτής μονοξειδίου μπαταρίας κοστίζει λίγο και σώζει ζωές. Βάλε έναν κοντά στα υπνοδωμάτια."]}],"sources":[{"label":"ΕΟΔΥ","url":"https://eody.gov.gr/"},{"label":"Πυροσβεστικό Σώμα","url":"https://www.fireservice.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"epeigon","title":"Επείγον τώρα","icon":"🚨","order":1,"intro":"Σύντομες οδηγίες για τα πρώτα λεπτά. Αν κινδυνεύει ζωή, κάλεσε πρώτα το 112.","numbers":[{"label":"Ευρωπαϊκός αριθμός έκτακτης ανάγκης","tel":"112","note":"Λειτουργεί και χωρίς κάρτα SIM ή υπόλοιπο"},{"label":"ΕΚΑΒ","tel":"166","note":"Ασθενοφόρο"},{"label":"Πυροσβεστική","tel":"199","note":""},{"label":"Αστυνομία","tel":"100","note":""},{"label":"Λιμενικό","tel":"108","note":"Θάλασσα και ακτές"},{"label":"Κέντρο Δηλητηριάσεων","tel":"2107793777","display":"210 779 3777","note":"Δηλητηριάσεις, χημικά, φάρμακα"}],"cards":[{"id":"seismos","title":"Σεισμός","icon":"🌍","urgent":true,"lead":"Σκύψε, κάλυψου, κρατήσου. Μην τρέχεις έξω την ώρα που κουνιέται.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Την ώρα του σεισμού (μέσα)","items":["Σκύψε στο πάτωμα πριν σε ρίξει ο σεισμός.","Κάλυψου κάτω από γερό τραπέζι ή γραφείο. Αν δεν υπάρχει, κάτσε δίπλα σε εσωτερικό τοίχο και προστάτεψε κεφάλι και αυχένα με τα χέρια.","Κρατήσου από το πόδι του τραπεζιού μέχρι να σταματήσει η δόνηση.","Μείνε μακριά από τζάμια, ντουλάπες, βιβλιοθήκες και ό,τι μπορεί να πέσει.","Μην χρησιμοποιείς ασανσέρ και μην τρέχεις σε σκάλες ή μπαλκόνια."]},{"type":"list","title":"Αν είσαι έξω ή στο αυτοκίνητο","items":["Έξω: απομακρύνσου από κτίρια, κολόνες, καλώδια και δέντρα. Σκύψε και προστάτεψε το κεφάλι.","Στο αυτοκίνητο: σταμάτα με ασφάλεια, μακριά από γέφυρες, σήραγγες και κτίρια. Μείνε μέσα με τη ζώνη μέχρι να σταματήσει."]},{"type":"steps","title":"Αμέσως μετά","items":["Έλεγξε αν εσύ ή οι γύρω σου είστε τραυματισμένοι.","Φόρεσε παπούτσια: σπασμένα γυαλιά είναι ο πιο συχνός τραυματισμός μετά από σεισμό.","Αν μυρίζει γκάζι: μην ανάβεις φωτιά ή διακόπτες, κλείσε τη γενική παροχή, άνοιξε παράθυρα και βγες έξω.","Βγες από το κτίριο με ψυχραιμία, από τις σκάλες. Πάρε την τσάντα διαφυγής.","Πήγαινε στον χώρο καταφυγής του δήμου σου ή σε ανοιχτό χώρο. Να περιμένεις μετασεισμούς.","Χρησιμοποίησε το τηλέφωνο μόνο για ανάγκη. Στείλε SMS αντί για κλήση για να μη φορτώνει το δίκτυο."]},{"type":"warn","title":"Κοντά στη θάλασσα: κίνδυνος τσουνάμι","items":["Αν ο σεισμός είναι δυνατός ή κρατά πολύ, ή αν η θάλασσα αποσυρθεί απότομα, ανέβα αμέσως σε ψηλό σημείο ή στους πάνω ορόφους γερού κτιρίου.","Μην περιμένεις μήνυμα. Μην κατεβαίνεις να δεις τη θάλασσα."]},{"type":"tip","title":"Ετοιμάσου από τώρα","items":["Στερέωσε βιβλιοθήκες, ντουλάπες και θερμοσίφωνα στον τοίχο.","Μάθε πού είναι ο γενικός διακόπτης ρεύματος, νερού και γκαζιού.","Βρες τον χώρο καταφυγής της γειτονιάς σου στο site του δήμου σου."]}],"sources":[{"label":"ΟΑΣΠ – Αντισεισμική προστασία","url":"https://www.oasp.gr/"},{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"pyrkagia","title":"Δασική πυρκαγιά","icon":"🔥","urgent":true,"lead":"Αν λάβεις μήνυμα 112 για εκκένωση, φύγε αμέσως. Μην περιμένεις να δεις φλόγες.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Αν σου ζητηθεί να φύγεις","items":["Φύγε αμέσως, από τη διαδρομή που δίνουν οι αρχές.","Αν έχεις λίγα λεπτά: κλείσε πόρτες, παράθυρα και γκάζι, πάρε την τσάντα διαφυγής, τα φάρμακα και τα κατοικίδια.","Ενημέρωσε την επαφή σου εκτός περιοχής ότι φεύγεις και προς τα πού.","Μην γυρίσεις πίσω για πράγματα."]},{"type":"list","title":"Στο αυτοκίνητο","items":["Ανοιχτά φώτα, κλειστά παράθυρα, αερισμός σε ανακυκλοφορία.","Οδήγα αργά και προσεκτικά. Μην μπαίνεις σε δασικούς δρόμους ή αδιέξοδα.","Αν σε εγκλωβίσει η φωτιά: σταμάτα σε σημείο χωρίς βλάστηση, άφησε τη μηχανή αναμμένη και τα φώτα ανοιχτά, ξάπλωσε στο πάτωμα και σκεπάσου με μάλλινη ή βαμβακερή κουβέρτα. Μην βγεις τρέχοντας."]},{"type":"list","title":"Αν εγκλωβιστείς στο σπίτι","items":["Μείνε μέσα. Ένα γερό σπίτι προστατεύει όταν περνά το μέτωπο της φωτιάς.","Κλείσε όλα τα ανοίγματα και βάλε βρεγμένες πετσέτες στις χαραμάδες.","Γέμισε μπανιέρα, νεροχύτες και κουβάδες με νερό.","Μείνε σε δωμάτιο μακριά από τον τοίχο που βλέπει στη φωτιά και μακριά από παράθυρα.","Όταν περάσει το μέτωπο, βγες και σβήσε μικρές εστίες γύρω από το σπίτι."]},{"type":"list","title":"Αν βρεθείς στην ύπαιθρο","items":["Πήγαινε σε ήδη καμένη έκταση, σε δρόμο, βραχώδη περιοχή ή χωράφι χωρίς ξερά χόρτα.","Μην ανεβαίνεις πλαγιά: η φωτιά ανεβαίνει πιο γρήγορα από όσο τρέχεις.","Κάλυψε μύτη και στόμα με βρεγμένο ύφασμα. Ξάπλωσε χαμηλά όπου ο καπνός είναι λιγότερος."]},{"type":"warn","title":"Ποτέ","items":["Μην πας να δεις τη φωτιά ή να τη βιντεοσκοπήσεις.","Μην εμποδίζεις οχήματα πυρόσβεσης. Άφησε τους δρόμους ελεύθερους."]},{"type":"tip","title":"Ετοιμάσου από τώρα","items":["Καθάρισε ξερά χόρτα και κλαδιά σε ακτίνα τουλάχιστον 10 μέτρων γύρω από το σπίτι.","Έχε λάστιχο ποτίσματος που φτάνει γύρω από όλο το σπίτι.","Κράτα το ρεζερβουάρ του αυτοκινήτου πάνω από τη μέση το καλοκαίρι.","Δες τον ημερήσιο Χάρτη Πρόβλεψης Κινδύνου Πυρκαγιάς στο civilprotection.gov.gr."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"},{"label":"Πυροσβεστικό Σώμα","url":"https://www.fireservice.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"plimmyra","title":"Πλημμύρα","icon":"🌊","urgent":true,"lead":"Μην μπαίνεις σε νερό που τρέχει, ούτε με τα πόδια ούτε με το αυτοκίνητο. Ανέβα ψηλά.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Τώρα","items":["Ανέβα σε ψηλότερο όροφο ή σε ψηλότερο σημείο. Βγες από υπόγεια και ισόγεια.","Αν μπορείς με ασφάλεια, κλείσε ρεύμα και γκάζι. Μην αγγίζεις ηλεκτρικά αν είσαι βρεγμένος ή πατάς σε νερό.","Μείνε μακριά από ρέματα, χειμάρρους, γέφυρες και υπόγειες διαβάσεις.","Άκου ραδιόφωνο και ακολούθησε τα μηνύματα του 112."]},{"type":"warn","title":"Το νερό είναι πιο δυνατό απ' όσο φαίνεται","items":["Λίγα εκατοστά ορμητικού νερού μπορούν να σε ρίξουν κάτω.","Περίπου 30 εκατοστά νερού που τρέχει μπορούν να παρασύρουν αυτοκίνητο.","Δεν ξέρεις τι κρύβει το θολό νερό: ανοιχτά φρεάτια, καλώδια, φθαρμένο οδόστρωμα."]},{"type":"list","title":"Αν παγιδευτεί το αυτοκίνητο","items":["Λύσε τη ζώνη και άνοιξε το παράθυρο όσο λειτουργεί ακόμη.","Βγες από το παράθυρο και ανέβα στην οροφή.","Κάλεσε 112. Μην προσπαθήσεις να κολυμπήσεις σε ορμητικό νερό."]},{"type":"list","title":"Μετά","items":["Το νερό της πλημμύρας είναι μολυσμένο. Πλύνε χέρια και πληγές με καθαρό νερό.","Πέτα τρόφιμα που ήρθαν σε επαφή με νερό πλημμύρας, ακόμη και συσκευασμένα που δεν είναι κονσέρβες.","Μην ανοίξεις το ρεύμα πριν ελέγξει ηλεκτρολόγος την εγκατάσταση.","Φωτογράφισε τις ζημιές για την ασφάλεια ή την αποζημίωση."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"kafsonas","title":"Καύσωνας","icon":"🌡️","urgent":true,"lead":"Νερό, σκιά, δροσιά. Έλεγξε ηλικιωμένους και ανθρώπους που μένουν μόνοι.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τι κάνεις","items":["Πίνε νερό συχνά, ακόμη κι αν δεν διψάς. Απόφυγε το αλκοόλ.","Μείνε μέσα τις πιο ζεστές ώρες, περίπου 12:00 με 17:00.","Κλειστά παντζούρια και κουρτίνες τη μέρα, ανοιχτά παράθυρα το βράδυ για δροσιά.","Δροσερά ντους, ελαφριά ανοιχτόχρωμα ρούχα, καπέλο.","Ελαφριά γεύματα με φρούτα και λαχανικά.","Αν το σπίτι σου είναι πολύ ζεστό, πήγαινε σε κλιματιζόμενο χώρο του δήμου ή σε δημόσιο κλιματιζόμενο χώρο."]},{"type":"warn","title":"Ποτέ","items":["Ποτέ παιδί, ηλικιωμένο ή ζώο κλεισμένο σε αυτοκίνητο, ούτε για λίγα λεπτά.","Απόφυγε έντονη άσκηση και χειρωνακτική δουλειά στον ήλιο."]},{"type":"warn","title":"Σημάδια θερμοπληξίας: κάλεσε 166","items":["Πολύ υψηλή θερμοκρασία σώματος, ζεστό δέρμα, σύγχυση, ζάλη, λιποθυμία ή σπασμοί.","Μετέφερε τον άνθρωπο σε δροσιά και ξεκίνα ψύξη αμέσως. Δες την κάρτα «Θερμοπληξία» στις πρώτες βοήθειες."]}],"sources":[{"label":"ΕΟΔΥ – Καύσωνας","url":"https://eody.gov.gr/"},{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"blackout","title":"Μπλακάουτ","icon":"🔦","urgent":true,"lead":"Φακοί, όχι κεριά. Κράτα ψυγείο και καταψύκτη κλειστά. Ποτέ γεννήτρια μέσα στο σπίτι.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Τώρα","items":["Χρησιμοποίησε φακό ή λάμπα μπαταρίας. Τα κεριά είναι συχνή αιτία πυρκαγιάς.","Βγάλε από την πρίζα υπολογιστές, τηλεόραση και ευαίσθητες συσκευές, για τη στιγμή που θα επανέλθει το ρεύμα.","Άφησε ένα φως αναμμένο για να καταλάβεις πότε επανήλθε.","Βάλε το κινητό σε εξοικονόμηση ενέργειας και χαμήλωσε τη φωτεινότητα.","Άκου ραδιόφωνο μπαταρίας για ενημέρωση."]},{"type":"list","title":"Τρόφιμα","items":["Μην ανοίγεις το ψυγείο χωρίς λόγο. Κλειστό, κρατά τα τρόφιμα ασφαλή περίπου 4 ώρες.","Ένας γεμάτος καταψύκτης που μένει κλειστός κρατά περίπου 48 ώρες (μισογεμάτος περίπου 24).","Πέτα ευαλλοίωτα (κρέας, γάλα, έτοιμα φαγητά) που έμειναν πάνω από 2 ώρες σε θερμοκρασία πάνω από 5 °C. Αν έχεις αμφιβολία, πέτα το."]},{"type":"warn","title":"Μονοξείδιο του άνθρακα: σκοτώνει αθόρυβα","items":["Γεννήτρια, ψησταριά, γκαζάκι κάμπινγκ και μαγκάλι μόνο σε ανοιχτό χώρο, μακριά από πόρτες και παράθυρα.","Πονοκέφαλος, ζάλη, ναυτία ή υπνηλία σε κλειστό χώρο: βγες αμέσως στον καθαρό αέρα και κάλεσε 166."]},{"type":"tip","title":"Αν κάποιος στο σπίτι χρειάζεται ιατρική συσκευή με ρεύμα","items":["Έχε σχέδιο από πριν: εφεδρική μπαταρία, πού μπορεί να φορτιστεί, ποιον καλείς.","Ενημέρωσε τον πάροχο ρεύματος ότι υπάρχει ευάλωτος πελάτης στο σπίτι."]}],"sources":[{"label":"Ευρωπαϊκή Επιτροπή – Ετοιμότητα πολιτών","url":"https://civil-protection-humanitarian-aid.ec.europa.eu/"},{"label":"USDA – Food safety during power outage","url":"https://www.foodsafety.gov/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"ekkenosi","title":"Εκκένωση","icon":"🚗","urgent":true,"lead":"Φύγε νωρίς, με την τσάντα διαφυγής, από τη διαδρομή που λένε οι αρχές.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Τι κάνεις","items":["Πάρε την τσάντα διαφυγής, φάρμακα, έγγραφα, φορτιστές και κατοικίδια.","Κλείσε ρεύμα, νερό και γκάζι αν το ζητήσουν οι αρχές.","Κλείδωσε το σπίτι.","Στείλε μήνυμα στην επαφή σου εκτός περιοχής: πότε φεύγεις και πού πηγαίνεις.","Ακολούθησε τη διαδρομή των αρχών. Μην παίρνεις συντομεύσεις.","Αν μπορείς, βοήθησε γείτονες που δεν έχουν μεταφορικό μέσο ή χρειάζονται βοήθεια."]},{"type":"tip","title":"Καλό να ξέρεις","items":["Βρες από τώρα δύο διαφορετικούς δρόμους για να φύγεις από τη γειτονιά σου.","Κράτα το αυτοκίνητο με αρκετό καύσιμο όταν υπάρχει αυξημένος κίνδυνος.","Μην επιστρέψεις πριν πουν οι αρχές ότι είναι ασφαλές."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"ximiko","title":"Χημικό ή βιομηχανικό ατύχημα","icon":"☣️","urgent":true,"lead":"Σε χημικό συμβάν οι οδηγίες εξαρτώνται από την ουσία και τη διεύθυνση του νέφους. Ακολούθησε άμεσα το 112 και τις αρχές: μπορεί να απαιτείται παραμονή μέσα ή εκκένωση.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Μείνε μέσα με ασφάλεια","items":["Μπες στο πιο κοντινό κτίριο.","Κλείσε πόρτες, παράθυρα, εξαερισμούς, κλιματισμό και τζάκι.","Πήγαινε σε εσωτερικό δωμάτιο με όσο το δυνατόν λιγότερα παράθυρα.","Σφράγισε χαραμάδες με βρεγμένες πετσέτες ή ταινία.","Άκου ραδιόφωνο ή τα μηνύματα του 112 και βγες μόνο όταν το πουν οι αρχές."]},{"type":"list","title":"Αν εκτέθηκες","items":["Βγάλε προσεκτικά τα ρούχα και βάλ' τα σε κλειστή σακούλα.","Πλύσου καλά με σαπούνι και άφθονο νερό.","Αν έχεις συμπτώματα (δύσπνοια, κάψιμο στα μάτια ή στο δέρμα), κάλεσε 166 ή το Κέντρο Δηλητηριάσεων."]},{"type":"warn","title":"Μην","items":["Μην πας να πάρεις τα παιδιά από το σχολείο. Τα σχολεία έχουν δικό τους σχέδιο και θα σε ενημερώσουν.","Μην βγεις έξω να δεις τι συμβαίνει."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"pyriniko","title":"Πυρηνικό ή ραδιολογικό συμβάν","icon":"☢️","urgent":true,"lead":"Μπες γρήγορα σε ανθεκτικό κτίριο, απομακρύνσου από παράθυρα και ακολούθησε αποκλειστικά τις επίσημες οδηγίες. Μη λαμβάνεις ιωδιούχο κάλιο χωρίς οδηγία των αρχών.","status":"review","updated":"2026-11","blocks":[{"type":"steps","title":"Τώρα","items":["Μπες αμέσως στο πιο κοντινό γερό κτίριο. Το καλύτερο σημείο είναι το υπόγειο ή το κέντρο του κτιρίου, μακριά από εξωτερικούς τοίχους και στέγη.","Κλείσε πόρτες, παράθυρα, εξαερισμούς, κλιματισμό και τζάκι.","Αν ήσουν έξω: βγάλε προσεκτικά τα εξωτερικά ρούχα και βάλ' τα σε κλειστή σακούλα. Κάνε ντους με σαπούνι και σαμπουάν, χωρίς μαλακτικό μαλλιών.","Φάε και πιες μόνο συσκευασμένα τρόφιμα και εμφιαλωμένο νερό.","Άκου ραδιόφωνο και τα μηνύματα του 112. Μείνε μέσα μέχρι να πουν οι αρχές ότι μπορείς να βγεις, συνήθως τουλάχιστον 24 ώρες."]},{"type":"list","title":"Ιωδιούχο κάλιο: τι πρέπει να ξέρεις","items":["Προστατεύει μόνο τον θυρεοειδή αδένα από ραδιενεργό ιώδιο. Δεν προστατεύει από άλλες μορφές ακτινοβολίας ούτε το υπόλοιπο σώμα.","Παίρνεται μόνο όταν το πουν οι αρχές υγείας, τη στιγμή και στη δόση που ορίζουν. Νωρίτερα, αργότερα ή σε μεγαλύτερη δόση δεν βοηθά και μπορεί να βλάψει.","Το μεγαλύτερο όφελος το έχουν παιδιά, έγκυες, θηλάζουσες και νέοι.","Αν έχεις πάθηση θυρεοειδούς, καρδιοπάθεια ή αλλεργία στο ιώδιο, ρώτα από τώρα τον γιατρό σου.","Η Ελληνική Επιτροπή Ατομικής Ενέργειας (ΕΕΑΕ) συστήνει να μην αγοράζεις δισκία «προληπτικά». Αν χρειαστεί, οι αρχές οργανώνουν τη διανομή."]},{"type":"warn","title":"Ποτέ","items":["Μην πίνεις βάμμα ιωδίου ή αντισηπτικά με ιώδιο. Είναι δηλητηριώδη.","Το ιωδιούχο αλάτι μαγειρικής δεν προστατεύει. Θα χρειαζόταν επικίνδυνη ποσότητα αλατιού."]}],"sources":[{"label":"Ελληνική Επιτροπή Ατομικής Ενέργειας (ΕΕΑΕ)","url":"https://eeae.gr/"},{"label":"WHO – Iodine thyroid blocking","url":"https://www.who.int/"},{"label":"FDA – Potassium iodide FAQ","url":"https://www.fda.gov/drugs/bioterrorism-and-drug-preparedness/frequently-asked-questions-potassium-iodide-ki"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"xionothyella","title":"Χιονοθύελλα & παγετός","icon":"❄️","urgent":true,"lead":"Μείνε μέσα, ζεστάσου με ασφάλεια, ταξίδεψε μόνο αν είναι απαραίτητο.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Στο σπίτι","items":["Ζέστανε ένα δωμάτιο και μείνετε όλοι εκεί. Κλείσε τα υπόλοιπα.","Φόρα πολλά λεπτά ρούχα το ένα πάνω στο άλλο, σκούφο και κάλτσες.","Προστάτεψε σωλήνες νερού που είναι εκτεθειμένοι, με μόνωση ή αφήνοντας μια βρύση να στάζει."]},{"type":"warn","title":"Θέρμανση με ασφάλεια","items":["Ποτέ μαγκάλι, ψησταριά ή γεννήτρια σε κλειστό χώρο: κίνδυνος θανάτου από μονοξείδιο.","Τζάκι και σόμπες ξύλου μόνο με καθαρή καμινάδα και κάποιο άνοιγμα για αερισμό."]},{"type":"list","title":"Αν πρέπει να οδηγήσεις","items":["Αλυσίδες, γεμάτο ρεζερβουάρ, φορτισμένο κινητό.","Στο αυτοκίνητο: κουβέρτα, νερό, φακός, φτυαράκι, κάτι να φας.","Αν ακινητοποιηθείς: μείνε στο αυτοκίνητο, άναβε τη μηχανή για λίγα λεπτά κάθε ώρα και κράτα την εξάτμιση καθαρή από χιόνι."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"},{"label":"ΕΜΥ – Προγνώσεις και έκτακτα δελτία","url":"https://www.emy.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"katafygio","title":"Καταφύγιο","icon":"🏠","order":5,"intro":"Πότε μένεις και πότε φεύγεις, πώς κρατάς ζέστη ή δροσιά, πώς προστατεύεσαι στην ύπαιθρο.","cards":[{"id":"meno-i-fevgo","title":"Μένω ή φεύγω;","icon":"🧭","lead":"Ακολούθησε πάντα τις οδηγίες των αρχών. Αν δεν υπάρχουν, σκέψου αν το σπίτι σε προστατεύει ή σε απειλεί.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Συνήθως μένεις μέσα","items":["Μπλακάουτ, χιονοθύελλα, διακοπή νερού.","Χημικό ή βιομηχανικό ατύχημα, εκτός αν οι αρχές πουν το αντίθετο.","Καύσωνας, αν μπορείς να κρατήσεις έναν χώρο δροσερό."]},{"type":"list","title":"Συνήθως φεύγεις","items":["Όταν οι αρχές δίνουν εντολή εκκένωσης, με μήνυμα 112 ή επιτόπου.","Όταν το κτίριο έχει εμφανείς ζημιές μετά από σεισμό.","Όταν πλησιάζει φωτιά και υπάρχει ακόμη ασφαλής δρόμος διαφυγής.","Όταν ανεβαίνει το νερό και δεν υπάρχει ψηλότερος όροφος."]},{"type":"tip","title":"Κανόνας","items":["Αν φεύγεις, φεύγεις νωρίς. Οι περισσότεροι κίνδυνοι στους δρόμους προκύπτουν από καθυστερημένη εκκένωση."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"organomenos-xoros","title":"Πού πηγαίνω: σε οργανωμένο χώρο, όχι μόνος","icon":"🏕️","lead":"Αν φύγεις, πήγαινε σε χώρο που έχουν οργανώσει οι αρχές ή σε δικούς σου ανθρώπους. Όχι μόνος σε απομονωμένο σημείο.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Γιατί σε οργανωμένο χώρο","items":["Υπάρχει νερό, φαγητό, ιατρική βοήθεια και ενημέρωση.","Είσαι πιο ασφαλής, ειδικά τη νύχτα.","Σε βρίσκουν πιο εύκολα οι δικοί σου και οι αρχές.","Αν αλλάξει η κατάσταση, ενημερώνεσαι πρώτος για νέα εκκένωση."]},{"type":"steps","title":"Πώς το οργανώνεις από τώρα","items":["Βρες στο site του δήμου σου τους χώρους καταφυγής και συγκέντρωσης της περιοχής σου.","Ορίστε στο «Οικογενειακό σχέδιο» δύο προορισμούς: έναν οργανωμένο χώρο και έναν συγγενή ή φίλο εκτός περιοχής.","Συζητήστε από πριν πότε φεύγετε και ποιος παίρνει ποιον."]},{"type":"list","title":"Όταν φτάσεις","items":["Δήλωσε την παρουσία σου στους υπεύθυνους του χώρου. Έτσι σε βρίσκουν όσοι σε ψάχνουν.","Στείλε μήνυμα στην επαφή σου εκτός περιοχής."]},{"type":"warn","title":"Αν δεν υπάρχει οργανωμένος χώρος","items":["Η τσάντα διαφυγής δεν αρκεί. Χρειάζεσαι εξοπλισμό διανυκτέρευσης: υπνόσακο, υπόστρωμα, σκηνή ή μουσαμά. Δες την καρτέλα «Διανυκτέρευση» στο Κιτ.","Μείνε μαζί με άλλους, κοντά σε δρόμο που περνούν οχήματα, μακριά από ρέματα και δάση.","Ενημέρωσε την επαφή σου για το πού ακριβώς βρίσκεσαι. Η «Θέση μου» στα Εργαλεία δίνει συντεταγμένες και χωρίς internet."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"anemoi","title":"Θυελλώδεις άνεμοι","icon":"🌬️","lead":"Μάζεψε ό,τι μπορεί να πετάξει, μείνε μακριά από δέντρα, σκαλωσιές και καλώδια, και απόφυγε τις άσκοπες μετακινήσεις.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Πριν δυναμώσει ο αέρας","items":["Μάζεψε ή δέσε γλάστρες, καρέκλες, τέντες, ομπρέλες και ό,τι υπάρχει στο μπαλκόνι.","Κλείσε καλά παράθυρα και πόρτες. Κατέβασε τα ρολά.","Φόρτισε κινητό και power bank, για την περίπτωση διακοπής ρεύματος.","Αν έχεις σκάφος ή κάτι στην ακτή, ασφάλισέ το νωρίς."]},{"type":"warn","title":"Όσο φυσάει δυνατά","items":["Μην περπατάς ή σταθμεύεις κάτω από δέντρα, σκαλωσιές, διαφημιστικές πινακίδες και κολόνες.","Μην πλησιάζεις πεσμένα καλώδια. Κάλεσε 112, ή τον ΔΕΔΔΗΕ για βλάβη στο δίκτυο (800 400 4000 δωρεάν, ή 11500).","Οδήγησε αργά και κράτα το τιμόνι σταθερά. Πρόσεξε σε γέφυρες και ανοιχτούς δρόμους.","Μείνε μακριά από την ακτή και τα κύματα.","Σε δασική περιοχή ο αέρας απλώνει γρήγορα τη φωτιά: καμία καύση, κανένα κάρβουνο έξω."]},{"type":"tip","title":"Μετά","items":["Έλεγξε για σπασμένα κλαδιά ή χαλαρά αντικείμενα πριν βγεις στο μπαλκόνι.","Ανέφερε πεσμένα δέντρα στον δήμο και επικίνδυνα καλώδια στον ΔΕΔΔΗΕ."]}],"sources":[{"label":"Γενική Γραμματεία Πολιτικής Προστασίας","url":"https://civilprotection.gov.gr/"},{"label":"ΕΜΥ","url":"https://www.emy.gr/"},{"label":"ΔΕΔΔΗΕ: δήλωση βλάβης","url":"https://www.deddie.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"zesti","title":"Ζέστη χωρίς ρεύμα","icon":"🧣","lead":"Ζέστανε ένα δωμάτιο, όχι όλο το σπίτι. Μόνωσε από το πάτωμα και τα παράθυρα.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Τι κάνεις","items":["Διάλεξε το μικρότερο δωμάτιο με τα λιγότερα παράθυρα, ιδανικά προς τον ήλιο. Μείνετε όλοι εκεί.","Κλείσε πόρτες, βάλε κουβέρτες ή χαλιά στις χαραμάδες και κουβέρτες στα παράθυρα το βράδυ.","Φόρα πολλά λεπτά ρούχα το ένα πάνω στο άλλο, σκούφο και κάλτσες. Το κεφάλι και τα πόδια χάνουν πολλή θερμότητα.","Μην κοιμάσαι κατευθείαν στο πάτωμα. Βάλε στρώμα, χαλί ή χαρτόνια από κάτω.","Φάε κάτι ζεστό και πίνε ζεστά υγρά. Το σώμα χρειάζεται θερμίδες για να ζεσταθεί.","Η θερμική κουβέρτα αλουμινίου βοηθά πάνω από τις κανονικές κουβέρτες."]},{"type":"warn","title":"Ποτέ","items":["Μαγκάλι, ψησταριά, γκαζάκι ή γεννήτρια μέσα στο σπίτι, ούτε για λίγο.","Θερμοφόρα με καυτό νερό κατευθείαν στο δέρμα, ειδικά σε παιδιά και ηλικιωμένους."]}],"sources":[{"label":"Πολιτική Προστασία – Οδηγός «Προστασία από Φυσικές Καταστροφές» (2025)","url":"https://civilprotection.gov.gr/sites/default/files/2025-09/%CE%A0%CF%81%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CC%81%CE%B1%20%CE%B1%CF%80%CE%BF%CC%81%20%CE%A6%CF%85%CF%83%CE%B9%CE%BA%CE%B5%CC%81%CF%82%20%CE%9A%CE%B1%CF%84%CE%B1%CF%83%CF%84%CF%81%CE%BF%CF%86%CE%B5%CC%81%CF%82_low.pdf"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"drosia","title":"Δροσιά χωρίς ρεύμα","icon":"🌬️","lead":"Κλειστά τη μέρα, ανοιχτά τη νύχτα. Μείνε στο πιο χαμηλό και σκιερό σημείο.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Τι κάνεις","items":["Παντζούρια, τέντες και κουρτίνες κλειστά όσο έχει ήλιο.","Τη νύχτα άνοιξε παράθυρα σε αντίθετες πλευρές για ρεύμα αέρα.","Κρέμασε βρεγμένα σεντόνια στα ανοιχτά παράθυρα.","Δροσερά ντους ή βρεγμένες πετσέτες σε λαιμό και καρπούς.","Μείνε στον χαμηλότερο όροφο: ο ζεστός αέρας ανεβαίνει."]},{"type":"tip","title":"Δες και","items":["Την κάρτα «Καύσωνας» στο Επείγον και τη «Θερμοπληξία» στις Πρώτες βοήθειες."]}],"sources":[{"label":"ΕΟΔΥ – Καύσωνας","url":"https://eody.gov.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"meta-seismo","title":"Μετά από σεισμό: μπαίνω στο σπίτι;","icon":"🏚️","lead":"Αν βλέπεις σοβαρές ζημιές, μην μπεις. Περίμενε τον έλεγχο από μηχανικούς.","status":"draft","updated":"2026-11","blocks":[{"type":"warn","title":"Μην μπεις αν βλέπεις","items":["Ρωγμές σε κολόνες ή δοκάρια, ειδικά χιαστί (σε σχήμα Χ).","Τοίχους που γέρνουν ή έχουν φουσκώσει.","Σκάλες με ρωγμές ή μετακινημένες.","Μυρωδιά γκαζιού, σπίθες από καλώδια, νερό που τρέχει από σωλήνες."]},{"type":"list","title":"Τι κάνεις","items":["Δήλωσε το κτίριο για αυτοψία από τους μηχανικούς του κράτους, μέσα από τον δήμο ή τις οδηγίες των αρχών.","Αν πρέπει να μπεις για λίγο, μπες με παπούτσια, φακό και γρήγορα, μόνο για τα απαραίτητα.","Φωτογράφισε τις ζημιές για ασφάλεια και αποζημίωση."]}],"sources":[{"label":"ΟΑΣΠ","url":"https://www.oasp.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"ypaithros","title":"Πρόχειρο καταφύγιο στην ύπαιθρο","icon":"⛺","lead":"Στην ύπαιθρο προτεραιότητα είναι η προστασία από κρύο, αέρα και βροχή, πριν από το νερό και το φαγητό.","status":"draft","updated":"2026-11","blocks":[{"type":"list","title":"Ο κανόνας των τριών","items":["Περίπου 3 ώρες αντέχει κανείς εκτεθειμένος σε πολύ κρύο ή καύσωνα χωρίς προστασία.","Περίπου 3 ημέρες χωρίς νερό.","Περίπου 3 εβδομάδες χωρίς φαγητό."]},{"type":"steps","title":"Πώς στήνεις πρόχειρο καταφύγιο","items":["Βρες σημείο προστατευμένο από τον αέρα: πίσω από βράχο, στην πλευρά ενός λόφου, μέσα σε συστάδα δέντρων.","Απόφυγε κοίτες ρεμάτων (ξαφνική πλημμύρα), κορυφές (αέρας, κεραυνοί) και μοναχικά ψηλά δέντρα σε καταιγίδα.","Μόνωσε από το έδαφος με παχύ στρώμα από ξερά φύλλα, κλαδιά ή σακίδιο. Το έδαφος τραβάει θερμότητα γρήγορα.","Φτιάξε μικρό χώρο: όσο πιο μικρός, τόσο πιο ζεστός. Σκέπασε με κλαδιά, αδιάβροχο ή σακούλες σκουπιδιών.","Τυλίξου με τη θερμική κουβέρτα, με τη γυαλιστερή πλευρά προς το σώμα."]},{"type":"tip","title":"Αν χαθείς","items":["Σταμάτα και μείνε σε ένα σημείο. Είναι πιο εύκολο να σε βρουν.","Κάλεσε 112. Αν έχεις λίγη μπαταρία, στείλε SMS με την τοποθεσία σου.","Πριν από κάθε πεζοπορία, πες σε κάποιον τη διαδρομή και πότε θα γυρίσεις."]}],"sources":[{"label":"Ελληνικός Ερυθρός Σταυρός","url":"https://www.redcross.gr/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"toualeta","title":"Τουαλέτα & υγιεινή χωρίς νερό","icon":"🪣","lead":"Χωρίς νερό στο καζανάκι, η υγιεινή γίνεται θέμα υγείας. Οργάνωσέ την από την πρώτη μέρα.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Πρόχειρη τουαλέτα","items":["Βάλε δύο σακούλες σκουπιδιών τη μία μέσα στην άλλη, στη λεκάνη ή σε κουβά.","Μετά από κάθε χρήση, ρίξε λίγο χώμα, πριονίδι ή άμμο γάτας για τη μυρωδιά.","Όταν γεμίσει, δέσε σφιχτά και φύλαξέ την έξω, σε κλειστό δοχείο, μακριά από νερό και τρόφιμα.","Καθάρισε τα χέρια κάθε φορά με αντισηπτικό ή σαπούνι."]},{"type":"tip","title":"Καλό να ξέρεις","items":["Αν υπάρχει νερό από μπανιέρα, ένας κουβάς νερό στη λεκάνη κάνει τη δουλειά του καζανακιού."]}],"sources":[{"label":"WHO – Sanitation in emergencies","url":"https://www.who.int/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."},{"id":"skylos","title":"Επιθετικός σκύλος","icon":"🐕","lead":"Μην τρέξεις. Στάσου ακίνητος, με το πλάι, και απομακρύνσου αργά χωρίς να του γυρίσεις την πλάτη.","status":"draft","updated":"2026-11","blocks":[{"type":"steps","title":"Αν σε πλησιάζει απειλητικά","items":["Μην τρέξεις και μη φωνάξεις. Το τρέξιμο ενεργοποιεί το ένστικτο κυνηγιού.","Στάσου ακίνητος, με τα χέρια κοντά στο σώμα, σαν δέντρο.","Γύρνα λίγο στο πλάι και μην τον κοιτάς κατευθείαν στα μάτια.","Πες ήρεμα και σταθερά «Όχι» ή «Φύγε».","Βάλε ανάμεσά σας ό,τι έχεις: τσάντα, μπουφάν, ομπρέλα, ποδήλατο.","Όταν χάσει το ενδιαφέρον του, απομακρύνσου αργά, χωρίς να γυρίσεις την πλάτη."]},{"type":"warn","title":"Αν σου επιτεθεί","items":["Δώσε του να δαγκώσει την τσάντα ή το μπουφάν, όχι το χέρι σου.","Αν πέσεις κάτω: κουλουριάσου, προστάτεψε με τα χέρια τον αυχένα και τα αυτιά, και μείνε ακίνητος.","Μετά πήγαινε σε γιατρό, ακόμη κι αν η πληγή φαίνεται μικρή. Δες την κάρτα «Δάγκωμα ζώου»."]},{"type":"list","title":"Πρόληψη","items":["Μην πλησιάζεις σκύλο που τρώει, κοιμάται ή φροντίζει κουτάβια.","Απόφυγε σημεία με αγέλες αδέσποτων, ειδικά τη νύχτα, και ανέφερέ τα στον δήμο.","Μάθε τα παιδιά να μην τρέχουν και να «γίνονται δέντρο»."]},{"type":"tip","title":"Γιατί δεν υπάρχει «ήχος απώθησης» στην εφαρμογή","items":["Οι συσκευές απώθησης χρησιμοποιούν υπερήχους που τα ηχεία κινητού δεν μπορούν να βγάλουν με αρκετή ένταση. Ένας ψιλός ήχος μπορεί και να εκνευρίσει περισσότερο τον σκύλο. Δεν θέλουμε να σου δώσουμε ψεύτικη ασφάλεια."]}],"sources":[{"label":"Ελληνικός Ερυθρός Σταυρός","url":"https://www.redcross.gr/"},{"label":"CDC – Preventing dog bites","url":"https://www.cdc.gov/"}],"review_note":"Οδηγός ενημέρωσης, όχι πιστοποιημένο εγχειρίδιο διάσωσης. Σε άμεσο κίνδυνο κάλεσε 112 και ακολούθησε τις αρχές. Ο έλεγχος ειδικού δεν έχει ολοκληρωθεί."}]},{"id":"kit","title":"Κιτ 72 ωρών","icon":"🎒","order":2,"intro":"Η Ευρωπαϊκή Επιτροπή συστήνει κάθε νοικοκυριό να μπορεί να τα βγάλει πέρα μόνο του για τουλάχιστον 72 ώρες. Οι ποσότητες υπολογίζονται με βάση το νοικοκυριό σου. Βάλε ημερομηνίες λήξης και πρόσθεσε υπενθύμιση στο ημερολόγιο, για να τα καταναλώνεις πριν λήξουν.","categories":[{"id":"nero","title":"Νερό","icon":"💧"},{"id":"trofima","title":"Τρόφιμα","icon":"🥫"},{"id":"fos","title":"Φως, ενέργεια, ενημέρωση","icon":"🔋"},{"id":"ygeia","title":"Υγεία","icon":"🩹"},{"id":"ygieini","title":"Υγιεινή","icon":"🧻"},{"id":"eggrafa","title":"Έγγραφα & χρήματα","icon":"📄"},{"id":"ergaleia","title":"Εργαλεία & ρουχισμός","icon":"🧰"},{"id":"paidia","title":"Παιδιά, κατοικίδια & ψυχαγωγία","icon":"🍼"},{"id":"diany","title":"Διανυκτέρευση","icon":"⛺"}],"items":[{"id":"nero-posimo","cat":"nero","name":"Εμφιαλωμένο νερό","per":"person","amount":3,"perDay":true,"unit":"λίτρα","bag":true,"bagAmount":1.5,"expires":true,"note":"Τουλάχιστον 2 λίτρα για να πιεις και 1 για φαγητό και βασική υγιεινή, ανά άτομο την ημέρα. Στην τσάντα διαφυγής: 1,5 λίτρο ανά άτομο."},{"id":"nero-katharismos","cat":"nero","name":"Ταμπλέτες καθαρισμού νερού ή φίλτρο","per":"household","amount":1,"perDay":false,"unit":"συσκευασία","bag":true,"expires":true,"note":"Για την περίπτωση που τελειώσει το εμφιαλωμένο."},{"id":"nero-zoa","cat":"nero","name":"Νερό για τα κατοικίδια","per":"pet","amount":1,"perDay":true,"unit":"λίτρα","bag":true,"bagAmount":0.5,"expires":true,"note":"Μέσος όρος. Ένας μεγάλος σκύλος μπορεί να χρειάζεται 2–3 λίτρα την ημέρα, ειδικά με ζέστη."},{"id":"geumata","cat":"trofima","name":"Τρόφιμα που τρώγονται χωρίς μαγείρεμα (κονσέρβες, έτοιμα γεύματα)","per":"person","amount":3,"perDay":true,"unit":"μερίδες","bag":true,"bagAmount":3,"expires":true,"note":"Διάλεξε τρόφιμα που τρώει ήδη η οικογένειά σου: τόνος, όσπρια, ντολμαδάκια, κονσέρβες κρέατος, φρυγανιές."},{"id":"snack","cat":"trofima","name":"Ξηροί καρποί, κράκερ, δημητριακά, μπάρες, αποξηραμένα φρούτα","per":"person","amount":1,"perDay":true,"unit":"συσκευασίες","bag":true,"bagAmount":2,"expires":true,"note":"Πολλές θερμίδες σε μικρό βάρος."},{"id":"energeiako","cat":"trofima","name":"Ισοτονικό ή ενεργειακό ρόφημα, ζελέ γλυκόζης","per":"adult","amount":1,"perDay":true,"unit":"τεμάχια","bag":true,"bagAmount":1,"expires":true,"note":"Γρήγορη ενέργεια όταν κουράζεσαι ή περπατάς πολύ. Δεν αντικαθιστά το νερό. Τα ενεργειακά με καφεΐνη όχι σε παιδιά, έγκυες ή καρδιοπαθείς."},{"id":"anoixtiri","cat":"trofima","name":"Ανοιχτήρι κονσέρβας (χειροκίνητο)","per":"household","amount":1,"perDay":false,"unit":"τεμάχιο","bag":false,"expires":false,"note":""},{"id":"gkazaki","cat":"trofima","name":"Γκαζάκι κάμπινγκ με φιαλίδια","per":"household","amount":1,"perDay":false,"unit":"σετ","bag":false,"expires":false,"note":"Μόνο σε εξωτερικό χώρο ή μπαλκόνι. Ποτέ μέσα στο σπίτι."},{"id":"piata","cat":"trofima","name":"Πιάτα, ποτήρια και μαχαιροπίρουνα μιας χρήσης ή κάμπινγκ","per":"household","amount":1,"perDay":false,"unit":"σετ","bag":false,"expires":false,"note":"Εξοικονομείς νερό από το πλύσιμο."},{"id":"fakos","cat":"fos","name":"Φακός (ιδανικά κεφαλής)","per":"person","amount":1,"perDay":false,"unit":"τεμάχια","bag":true,"bagAmount":1,"expires":false,"note":""},{"id":"mpataries","cat":"fos","name":"Εφεδρικές μπαταρίες για φακούς και ραδιόφωνο","per":"household","amount":2,"perDay":false,"unit":"σετ","bag":true,"expires":true,"note":"Έλεγξε ότι ταιριάζουν στις συσκευές σου."},{"id":"powerbank","cat":"fos","name":"Power ής","per":"household","amount":1,"perDay":false,"unit":"σετ","bag":true,"expires":false,"note":"Αν φοράει κάποιος."},{"id":"xarti","cat":"ygieini","name":"Χαρτί υγείας","per":"household","amount":4,"perDay":false,"unit":"ρολά","bag":true,"expires":false,"note":""},{"id":"mantilakia","cat":"ygieini","name":"Υγρά μαντηλάκια και αντισηπτικό χεριών","per":"household","amount":2,"perDay":false,"unit":"συσκευασίες","bag":true,"expires":true,"note":""},{"id":"sakoules","cat":"ygieini","name":"Σακούλες σκουπιδιών με κορδόνι","per":"household","amount":10,"perDay":false,"unit":"τεμάχια","bag":true,"expires":false,"note":"Για σκουπίδια, αδιάβροχο ή πρόχειρη τουαλέτα."},{"id":"gynaikeia","cat":"ygieini","name":"Είδη γυναικείας υγιεινής","per":"household","amount":1,"perDay":false,"unit":"συσκευασία","bag":true,"expires":false,"note":"Αν χρειάζονται."},{"id":"metrita","cat":"eggrafa","name":"Μετρητά σε μικρά χαρτονομίσματα","per":"household","amount":1,"perDay":false,"unit":"απόθεμα","bag":true,"expires":false,"note":"Σε μπλακάουτ δεν δουλεύουν κάρτες και ΑΤΜ. Σε αεροστεγές σακουλάκι."},{"id":"antigrafa","cat":"eggrafa","name":"Αντίγραφα εγγράφων, πλαστικοποιημένα ή σε σακουλάκι zip","per":"household","amount":1,"perDay":false,"unit":"φάκελος","bag":true,"expires":false,"note":"Ταυτότητες, διαβατήρια, ΑΜΚΑ, ασφάλιση, συμβόλαια σπιτιού, συνταγές. Κράτα και ψηφιακό αντίγραφο σε ασφαλές cloud."},{"id":"fotografia","cat":"eggrafa","name":"Πρόσφατη φωτογραφία κάθε μέλους, σε σακουλάκι zip","per":"person","amount":1,"perDay":false,"unit":"τεμάχια","bag":true,"bagAmount":1,"expires":false,"note":"Αν χαθεί κάποιος, τη δίνεις σε αρχές και εθελοντές για την αναζήτηση. Βάλε και των κατοικίδιων. Ανανέωσέ τες κάθε χρόνο, ειδικά για τα παιδιά."},{"id":"epafes","cat":"eggrafa","name":"Λίστα επαφών σε χαρτί","per":"household","amount":1,"perDay":false,"unit":"τεμάχιο","bag":true,"expires":false,"note":"Τυπώνεται από το «Οικογενειακό σχέδιο»."},{"id":"kleidia","cat":"eggrafa","name":"Εφεδρικά κ
